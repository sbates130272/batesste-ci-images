# apt-cacher-ng, as the guest builds use it.
#
# Dropped into /etc/apt-cacher-ng/ as zz-ci-images.conf so it is read after the
# packaged acng.conf and wins where the two disagree.  Started by build-vm.sh
# before the first guest boot; see the apt-cache section there.
#
# Only the build-time boots use this.  The published qcow2 carries no proxy
# configuration: build-vm.sh removes it in the verify phase, because a guest
# that points apt at 10.0.2.2:3142 on a consumer's machine is a guest whose apt
# hangs.

CacheDir: /var/cache/apt-cacher-ng
LogDir: /var/log/apt-cacher-ng

# A --security=insecure RUN shares the host network namespace, so this port is
# open on the build machine for as long as the step runs.
#
# The value here is only a fallback: build-vm.sh passes "Port=<n>" on the
# command line, derived per flavour from PROBE_SSH_PORT, because every guest
# flavour building at once shares one port space. Two flavours on one port is
# the collision PROBE_SSH_PORT already exists to avoid.
Port: 3142
BindAddress: 0.0.0.0

# The guest has no DNS for the remap hostnames below and does not need any:
# apt sends the whole URL to the proxy, which is what resolves it.
#
# Remap-<name>: <what the client asks for> ; <where acng actually fetches>
#
# ubuntu is the ordinary case -- a plain-http archive, cached as-is.  The other
# two exist because acng CONNECT-tunnels an https:// request without caching a
# byte of it, so the guest asks for http://<key>/... instead and acng upgrades
# the hop it makes upstream.
Remap-ubuntu: http://archive.ubuntu.com/ubuntu http://security.ubuntu.com/ubuntu ; http://archive.ubuntu.com/ubuntu http://security.ubuntu.com/ubuntu

# ROCm userspace (TheRock).  Guest URI: http://amdrocm/rocm/<component>
Remap-amdrocm: http://amdrocm ; https://stable.repo.amd.com

# The amdgpu kernel driver tree.  Guest URI: http://radeon/amdgpu/<ver>/ubuntu
Remap-radeon: http://radeon ; https://repo.radeon.com

# Anything not named above still works, uncached, rather than failing closed.
# A provision script reaching a repository nobody thought to remap should be
# slow, not broken.
PassThroughPattern: .*

# These are public package repositories and the cache is thrown away with the
# builder; there is nothing here worth an expiry policy beyond keeping the
# directory from growing without bound.
#
# ExTreshold is the only expiry knob, and its spelling is acng's own (one "h").
# There is no separate threshold for index files: a second directive invented
# for that job -- "ExpTreshold" -- is not merely ignored, it makes acng reject
# the whole file with "Error reading main options, terminating", so every guest
# builds with no cache and only the start log says why. Do not add directives
# here without checking them against acng's manual first.
ExTreshold: 10

# Quiet: the build log is already long, and a per-request line for several
# thousand package fetches would bury everything else in it.
VerboseLog: 0
Debug: 0
