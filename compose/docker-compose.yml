services:
  qemu:
    image: batesste-ci-images-ubuntu-qemu-libvfio-user:latest
    cap_add:
      - NET_ADMIN
    volumes:
      - vfio-sockets:/tmp/vfio-sockets
    environment:
      USERNAME: batesste
      VM_NAME: batesste-ci-vm
      SSH_PORT: "2222"
      VCPUS: "2"
      VMEM: "4096"
      VFIO_USER_SOCKET: /tmp/vfio-sockets/rocjitsu.sock
    ports:
      - "2222:2222"
    depends_on:
      - rocm-rocjitsu

  rocm-ernic:
    image: batesste-ci-images-ubuntu-rocm-ernic:latest
    cap_add:
      - NET_ADMIN
    volumes:
      - vfio-sockets:/tmp/vfio-sockets
    command:
      - rocm-ernic
      - --socket
      - /tmp/vfio-sockets/rocm-ernic.sock
      - --backend
      - loopback
    depends_on:
      - qemu

  rocm-rocjitsu:
    image: batesste-ci-images-ubuntu-rocm-rocjitsu:latest
    cap_add:
      - NET_ADMIN
    volumes:
      - vfio-sockets:/tmp/vfio-sockets
    # gfx1250 is the only target with an IP discovery profile upstream, so it is
    # the only config rocjitsu can serve over vfio-user; anything else exits 1.
    command:
      - rocjitsu
      - --config
      - /usr/local/share/rocjitsu/configs/gfx1250_mi455x.json
      - --vfio-socket
      - /tmp/vfio-sockets/rocjitsu.sock

volumes:
  vfio-sockets:
