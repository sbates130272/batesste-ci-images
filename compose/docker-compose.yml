services:
  # The qemu image is the toolchain only; it carries no guest. Extract one from
  # a published ubuntu-qcow2-gen payload into compose/vm/ before "up":
  #
  #   cid=$(docker create \
  #     sbates130272/batesste-ci-images-ubuntu-qcow2-gen:latest)
  #   docker cp "$cid:/output/." compose/vm && docker rm "$cid"
  #
  # VM_NAME below must match the payload's vm-info.json: the disk is named
  # after it, and entrypoint.sh looks for /output/${VM_NAME}.qcow2.
  #
  # Mounted read-write, not :ro -- QEMU opens the qcow2 read-write, so the
  # stack writes back into compose/vm/. Re-extract for a pristine guest.
  qemu:
    image: batesste-ci-images-ubuntu-qemu-libvfio-user:latest
    cap_add:
      - NET_ADMIN
    volumes:
      - vfio-sockets:/tmp/vfio-sockets
      - ./vm:/output
    environment:
      USERNAME: batesste
      VM_NAME: batesste-ci-vm
      SSH_PORT: "2222"
      VCPUS: "2"
      VMEM: "4096"
      VFIO_USER_SOCKET: /tmp/vfio-sockets/rocjitsu.sock
    ports:
      - "2222:2222"
    depends_on:
      - rocm-rocjitsu

  rocm-ernic:
    image: batesste-ci-images-ubuntu-rocm-ernic:latest
    cap_add:
      - NET_ADMIN
    volumes:
      - vfio-sockets:/tmp/vfio-sockets
    command:
      - rocm-ernic
      - --socket
      - /tmp/vfio-sockets/rocm-ernic.sock
      - --backend
      - loopback
    depends_on:
      - qemu

  rocm-rocjitsu:
    image: batesste-ci-images-ubuntu-rocm-rocjitsu:latest
    cap_add:
      - NET_ADMIN
    volumes:
      - vfio-sockets:/tmp/vfio-sockets
    # gfx1250 is the only target with an IP discovery profile upstream, so it is
    # the only config rocjitsu can serve over vfio-user; anything else exits 1.
    command:
      - rocjitsu
      - --config
      - /usr/local/share/rocjitsu/configs/gfx1250_mi455x.json
      - --vfio-socket
      - /tmp/vfio-sockets/rocjitsu.sock

volumes:
  vfio-sockets:
