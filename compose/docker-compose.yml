# Capabilities are dropped here but the uid is not pinned, which is the one
# place this file deliberately diverges from qemu-minimal's stacks. Those carry
# `user: ${CONTAINER_USER:?...}`, and the `:?` is what makes an unset variable
# an error instead of uid 0. This file is the hand-run smoke test documented
# below -- `docker compose up` with no preparation beyond pulling a guest -- so
# requiring two environment variables to start it would cost more than it buys
# for a stack that opens three sockets.
#
# Nothing here needs NET_ADMIN: both device servers open a unix socket on a
# shared volume, and QEMU's networking is SLIRP, which is userspace. It was on
# all three services and was never used by any of them.
#
# The qemu service does need one capability back, and the original version of
# this comment claimed otherwise. ./vm is written by whoever ran the pull
# below -- uid 1001 on a GitHub runner, your own uid by hand -- while this
# file deliberately leaves the container as uid 0. Containerised root reads and
# writes files it does not own only through CAP_DAC_OVERRIDE, so dropping ALL
# left QEMU unable to open the guest at all. qemu-tool checks for this up front
# with os.access(W_OK|X_OK) and refuses to boot, which is how it surfaced: run
# 40996981852, "this VM's storage is not usable by the user it runs as (uid 0)"
# naming files owned by 1001.
#
# Reproduced with nothing but the flag varying, same image and same mount:
#
#   --user 0:0                      -> writable: True
#   --user 0:0 --cap-drop ALL       -> writable: False
#   ... --cap-add DAC_OVERRIDE      -> writable: True
#
# Granted to qemu alone. The two device servers only touch a volume they own,
# and neither needs it.
x-hardening: &hardening
  cap_drop:
    - ALL
  security_opt:
    - "no-new-privileges:true"

services:
  # The qemu image is the toolchain only; it carries no guest. Pull the
  # rocm-golden guest qemu-minimal publishes into compose/vm/ before "up". It
  # is an ORAS artifact, not an image, so this needs oras and zstd:
  #
  #   ref=$(./ci-images-tool.py config ubuntu-qemu-libvfio-user --get guest_qcow2)
  #   oras pull "$ref" -o compose/vm && zstd -d --rm compose/vm/*.qcow2.zst
  #   oras pull "$(oras discover "$ref" --format json \
  #     | jq -r '.referrers[0].reference')" -o compose/vm
  #   chmod 600 compose/vm/id_rsa
  #
  # The second pull is the referrer carrying vm-info.json and the SSH keypair.
  # VM_NAME below must match vm-info.json's vm_name: the disk is named after
  # it, and entrypoint.sh looks for /output/${VM_NAME}.qcow2.
  #
  # Mounted read-write, not :ro -- QEMU opens the qcow2 read-write, so the
  # stack writes back into compose/vm/. Pull again for a pristine guest.
  qemu:
    <<: *hardening
    # See the header: uid 0 cannot open a ./vm pulled by anyone else
    # without this, and this file does not pin the uid on purpose.
    cap_add:
      - DAC_OVERRIDE
    image: batesste-ci-images-ubuntu-qemu-libvfio-user:latest
    volumes:
      - vfio-sockets:/tmp/vfio-sockets
      - ./vm:/output
    environment:
      USERNAME: ubuntu
      VM_NAME: ${VM_NAME:-rocm-golden}
      SSH_PORT: "2222"
      VCPUS: "2"
      VMEM: "4096"
      VFIO_USER_SOCKET: /tmp/vfio-sockets/rocjitsu.sock
    ports:
      - "2222:2222"
    depends_on:
      - rocm-rocjitsu

  rocm-ernic:
    <<: *hardening
    image: batesste-ci-images-ubuntu-rocm-ernic:latest
    volumes:
      - vfio-sockets:/tmp/vfio-sockets
    command:
      - rocm-ernic
      - --socket
      - /tmp/vfio-sockets/rocm-ernic.sock
      - --backend
      - loopback
    depends_on:
      - qemu

  rocm-rocjitsu:
    <<: *hardening
    image: batesste-ci-images-ubuntu-rocm-rocjitsu:latest
    volumes:
      - vfio-sockets:/tmp/vfio-sockets
    # gfx1250 is the only target with an IP discovery profile upstream, so it is
    # the only config rocjitsu can serve over vfio-user; anything else exits 1.
    command:
      - rocjitsu
      - --config
      - /usr/local/share/rocjitsu/configs/gfx1250_mi455x.json
      - --vfio-socket
      - /tmp/vfio-sockets/rocjitsu.sock

volumes:
  vfio-sockets:
