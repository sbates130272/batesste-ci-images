# Single source of truth for every image this repo publishes.
#
# ci-images-tool.py is a generic engine over this file: the pins, the build
# args, the tag variant, the OCI labels and the base each image layers on are
# all declared here and nowhere else. Adding an image means adding a Dockerfile
# and an entry below -- no Python change.
#
# A *target* is an image plus an optional variant: the same Dockerfile built
# with overlaid vars and published to its own suffixed repository. Refer to one
# on the command line as `<image>@<variant>`.
#
# vars
#   Each var is `name: value` or `name: {value: …, env: …, secret: true}`.
#   The environment can override a var (env name defaults to the var name
#   upper-cased) -- but never one a variant pins, so a stray .env cannot
#   rewrite what a variant is deliberately built against. An empty env value
#   means "unset"; `none` means "disabled".
#
# templates
#   "{var}" interpolates, with optional filters: |short (abbreviate a SHA or
#   branch), |ver (strip a leading v), |dots (13-3 -> 13.3), |sanitise.
#   A leading ! names a Python helper for the rare case a template cannot
#   express (see VARIANT_HELPERS in ci-images-tool.py).
#
#   A `variant:` names the upstream pins and is not asked to identify a build
#   on its own: the fully specified tag prefixes the release and a fingerprint
#   of this repo's commit, so a changed Dockerfile or provision script cannot
#   land on a tag that is already taken. Nothing to declare here -- see
#   source_fingerprint() -- but it is why a variant need not chase every pin.
#
# job
#   Which CI job builds this image: `bases` (built once, up front),
#   `matrix` (the flat parallel matrix), `derived` (built after the matrix,
#   on top of an image the matrix produced).
#
# description
#   One sentence saying what the image is for. A variant may override it.
#   This is the single source for the image's OCI
#   org.opencontainers.image.description label and the short description on
#   its Docker Hub page, so the two cannot drift. The long-form Hub overview
#   is the image directory's own README.md.
#
#   Docker Hub caps the short description at 100 *bytes*. Anything longer is
#   trimmed at a word boundary with an ellipsis rather than rejected, but the
#   page reads better if the sentence fits; `describe --dry-run` shows the
#   byte count. The OCI label carries the full text either way.
#
# overlay
#   An optional, gitignored images.local.yml beside this file is deep-merged
#   over it for local experiments -- it can reach anything here, including a
#   variant's pins. CI never reads it. See the README.
#
# badges
#   The README's pinned-upstream shields are generated from the badges: block
#   at the foot of this file, so a pin and the badge that advertises it cannot
#   disagree. `ci-images-tool.py badges --write` regenerates them and
#   `--check` fails if the README is stale; CI runs the latter on every PR.

defaults:
  registry: docker.io
  registry_image: batesste-ci-images
  image_tag: auto
  label_namespace: io.batesste.ci-images

  # Repo-wide provenance. Every image gets these as standard OCI labels, and
  # `ci-images-tool.py describe` pushes the same facts to the Docker Hub page,
  # so the registry, the image and the hub page cannot disagree.
  #
  # {image} interpolates the image directory. licenses is empty because this
  # repo carries no LICENSE file; add one and set an SPDX id here to stamp it.
  metadata:
    source: https://github.com/sbates130272/batesste-ci-images
    url: https://github.com/sbates130272/batesste-ci-images
    documentation: https://github.com/sbates130272/batesste-ci-images/blob/main/{image}/README.md
    vendor: sbates130272
    authors: Stephen Bates
    licenses: ""

  # Shared by more than one image, so they cannot be owned by any single one.
  vars:
    libvfio_user_commit: 803924493a7c787b2ba358751f55f07d5dba64b2
    # The Ubuntu cloud image every guest qcow2 is built from. Ubuntu 26.04 LTS
    # "resolute" ships Linux 7.0. This chooses the *userspace* only: the guest
    # kernel is whatever the release ships unless the flavour sets kernel_ref,
    # and the Ubuntu mainline builds are one set of .debs for all releases, so
    # a newer kernel is not a reason to move off a release. A flavour that
    # needs different userspace pins its own release var.
    release: resolute
    arch: amd64

# Retention for `ci-images-tool.py prune`. Only the immutable, fingerprinted
# date tags are ever candidates: every rolling alias (latest, the bare variant,
# 1.1, sha-…) and every semver release tag is kept regardless of what is set
# here, because those are what consumers and BASE_IMAGE resolve through.
#
# A tag has to fall outside *both* limits to be proposed -- older than
# keep_days *and* past the keep_count newest -- so a repository that has been
# quiet for a month keeps its history, and a busy day does not reap last week.
#
# An image or a variant may override the block wholesale with its own `prune:`.
prune:
  keep_days: 30
  keep_count: 10
  # Globs, matched against the whole tag. Reach for this when something
  # outside this repo pins a dated tag rather than a rolling one.
  protect: []

# Which changed files rebuild which image, for `targets --changed-from`.
# The dockerfile-test workflow hands it the branch's changed paths and builds
# only the targets that come back, instead of rebuilding all thirteen because
# one Dockerfile moved.
#
# An image needs nothing here: the default is its own directory (plus any
# context_dirs), which is the honest answer for all of them. Declare `paths:`
# on an image or a variant only to *replace* that default -- it is not merged,
# because a list that is merged is a list nobody can narrow.
#
# Two things the globs do not have to express. A rebuilt base selects
# everything layered on it, so ubuntu-cuda-rocm-fio need not name
# ubuntu-cuda-rocm/; the closure runs over `base:`, which cannot go stale the
# way a hand-copied glob would. And anything under `always:` selects every
# target, because these are the files that decide what *any* image builds --
# a pin moving in images.yml is a rebuild of whatever image it belongs to, and
# working out which from a diff is not something a glob can do.
#
# `**` spans directory separators; a single `*` stops at one.
path_filter:
  always:
    - images.yml
    - ci-images-tool.py
    - requirements.txt
    - .github/workflows/batesste-ci-images-dockerfile-test.yml
    # compose/ belongs here rather than on an image, because the only job that
    # exercises the stack -- test-compose -- requires four targets to have been
    # selected, and a compose-only diff selects none of them. Leave it out and a
    # PR that edits the stack starts the workflow, skips every job and reports
    # green having validated nothing.
    - compose/**

images:

  ubuntu-base:
    job: bases
    description: >-
      Ubuntu 24.04 base layer every other image here inherits, with
      build-essential, cmake and ccache.
    variant: "ubuntu{ubuntu_version|ver}"
    # common/ holds the root CA this image bakes in, so a change there is a
    # change to the base layer. Declared here rather than in path_filter's
    # always: list precisely so it goes through the base closure -- every
    # image inherits from this one, so the effect is the same and the reason
    # stays attached to the image that actually reads the directory.
    paths:
      - ubuntu-base/**
      - common/**
    labels:
      org.opencontainers.image.base.name: "docker.io/library/ubuntu:{ubuntu_version}"
      "{ns}.ubuntu.version": "{ubuntu_version}"

  ubuntu-libvfio-user:
    job: bases
    description: >-
      Ubuntu with libvfio-user built from source, the vfio-user protocol
      library consumers link against.
    base: ubuntu-base
    build_args:
      LIBVFIO_USER_COMMIT: "{libvfio_user_commit}"
    variant: "vfu.{libvfio_user_commit|short}"
    labels:
      "{ns}.libvfio-user.commit": "{libvfio_user_commit}"

  ubuntu-kernel-build:
    job: matrix
    description: >-
      Ubuntu 24.04 carrying bison, flex, libelf and linux-headers-generic for
      kernel and module builds.
    base: ubuntu-base
    # Adds no pinned payload of its own, so the Ubuntu release is the only
    # thing that can differ between two of its builds.
    variant: "ubuntu{ubuntu_version|ver}"

  ubuntu-cuda-rocm:
    job: matrix
    description: >-
      Ubuntu 24.04 carrying nvcc and hipcc, the CUDA and ROCm/HIP toolkits,
      with no GPU kernel drivers.
    base: ubuntu-base
    # No CI artifact: its only consumer wants a registry ref, so the build job
    # pushes it straight to GHCR instead of round-tripping a ~13 GB tarball.
    vars:
      cuda_version: "13-4"
      # On the therock stream this is descriptive, not selective: that apt
      # source is versionless ("stable"), so the release installed is whatever
      # stable currently holds and this only names it for the tag and label.
      # It therefore goes stale silently -- version-scrub.sh reads the actual
      # amdrocm version back out of the repo index to keep it honest. Only the
      # legacy stream builds this into a URL and so genuinely pins.
      rocm_version: "10.0"
      # 'therock' (repo.amd.com, ROCm 7.13+) or 'legacy' (repo.radeon.com, <=7.2)
      rocm_stream: therock
    build_args:
      CUDA_VERSION: "{cuda_version}"
      ROCM_VERSION: "{rocm_version}"
      ROCM_STREAM: "{rocm_stream}"
    # CUDA_VERSION carries the apt package form (13-4); publish it the way
    # NVIDIA versions it (13.4).
    variant: "rocm{rocm_version|ver}-cuda{cuda_version|dots|ver}"
    labels:
      "{ns}.rocm.version": "{rocm_version}"
      "{ns}.cuda.version": "{cuda_version|dots}"
      "{ns}.rocm.stream": "{rocm_stream}"

  ubuntu-cuda-rocm-fio:
    job: derived
    description: >-
      fio with AMD libhipfile and NVIDIA libcufile direct-to-GPU engines, on a
      CUDA + ROCm toolkit base.
    base: ubuntu-cuda-rocm
    vars:
      # Must be a master commit -- the libhipfile engine is not in any fio tag yet
      fio_repo: https://github.com/axboe/fio.git
      fio_commit: 6bc57a931f04fa3f50348d8c8f087187f050c6e1
      # Provenance only, and empty here: the default target tracks master HEAD,
      # so it has no branch of its own worth recording. A variant built from a
      # fork branch fills it in and the label appears only there.
      fio_branch: ""
    build_args:
      FIO_REPO: "{fio_repo}"
      FIO_COMMIT: "{fio_commit}"
    variant: "rocm{rocm_version|ver}-cuda{cuda_version|dots|ver}-fio.{fio_commit|short}"
    labels:
      "{ns}.rocm.version": "{rocm_version}"
      "{ns}.cuda.version": "{cuda_version|dots}"
      "{ns}.rocm.stream": "{rocm_stream}"
      "{ns}.fio.commit": "{fio_commit}"
      "{ns}.fio.repo": "{fio_repo}"
      "{ns}.fio.branch": "{fio_branch}"
    variants:
      async-hipfile:
        suffix: "-async-hipfile"
        description: >-
          fio from ROCm's unmerged async hipFile branch, adding
          hipfile_mode=sync|batch|stream to libhipfile.
        # AMD's asynchronous hipFile work: adds hipfile_mode=sync|batch|stream
        # to the libhipfile engine. Published alongside the master build rather
        # than replacing it, so the upstream image keeps tracking axboe HEAD.
        #
        # This commit is the head of a WIP fork branch as of 2026-09-02, two
        # commits ahead of and two behind the master pin. version-scrub.sh must
        # not touch it. The branch is recorded so build.json and the branch
        # label say where the commit came from; it is provenance only, since
        # the Dockerfile fetches the commit directly. The pin does not track
        # the branch, so the two will diverge once the branch moves.
        vars:
          fio_repo: https://github.com/ROCm/fio.git
          fio_commit: c32261752c88b3f7aadfde4d011a028ae954f869
          fio_branch: zbyrne/async_hipfile_engine

  ubuntu-rocm-nixl:
    job: derived
    description: >-
      NIXL, NIXLBench and libfabric built from source over a ROCm-enabled UCX,
      for AMD GPU transfers.
    base: ubuntu-cuda-rocm
    vars:
      nixl_repo: https://github.com/ai-dynamo/nixl.git
      # A NIXL release tag, not a SHA: this image tracks tagged releases so the
      # tag it publishes names a version a consumer can recognise. The build
      # still records the resolved commit in nixl-commit.txt for provenance.
      # version-scrub.sh advances this to the newest stable tag and ignores
      # -rc ones.
      nixl_tag: v1.4.1
      # UCX is built from source rather than apt: the packaged build has no
      # ROCm transport, so it cannot register HIP memory.
      #
      # v1.23.x is the release branch upstream NIXL builds against, so this
      # matches what NIXL is tested on rather than running ahead of it on
      # master. Upstream names the branch and takes whatever it points at;
      # this pins the commit instead, so a build stays reproducible when the
      # branch moves under it. version-scrub.sh advances the pin along
      # whichever branch ucx_branch names.
      ucx_repo: https://github.com/openucx/ucx.git
      ucx_branch: v1.23.x
      ucx_commit: 12d6aa65956996625c8daf39cbb3475ef4a1a35b
      etcd_repo: https://github.com/etcd-cpp-apiv3/etcd-cpp-apiv3.git
      etcd_commit: 7c6e714f188f9576e25e0350cac4181139eec23e
      # Abseil and gRPC are built from source because Ubuntu's libgrpc++-dev
      # drags in an Abseil too old for NIXL. These match the pins upstream
      # NIXL uses in .ci/dockerfiles/Dockerfile.rocm.
      absl_repo: https://github.com/abseil/abseil-cpp.git
      # Upstream NIXL writes this as lts_2025_08_14, which is a *branch*, not a
      # tag -- it moves as that LTS line takes patches, despite upstream's
      # comment calling it immutable. This is the release tag at that branch's
      # current head, so it is the same tree and actually immutable.
      # version-scrub.sh does that branch -> tag resolution on every run.
      absl_tag: "20250814.2"
      grpc_repo: https://github.com/grpc/grpc.git
      grpc_tag: v1.73.0
      # NIXL only uses HIP in its libfabric plugin, so libfabric is what makes
      # the ROCm support here NIXL's own and not just UCX's.
      libfabric_repo: https://github.com/ofiwg/libfabric.git
      libfabric_tag: v1.21.0
    build_args:
      NIXL_REPO: "{nixl_repo}"
      NIXL_TAG: "{nixl_tag}"
      UCX_REPO: "{ucx_repo}"
      UCX_COMMIT: "{ucx_commit}"
      ETCD_REPO: "{etcd_repo}"
      ETCD_COMMIT: "{etcd_commit}"
      ABSL_REPO: "{absl_repo}"
      ABSL_TAG: "{absl_tag}"
      GRPC_REPO: "{grpc_repo}"
      GRPC_TAG: "{grpc_tag}"
      LIBFABRIC_REPO: "{libfabric_repo}"
      LIBFABRIC_TAG: "{libfabric_tag}"
    # A release tag becomes nixl1.4.1, the same way the QEMU image names a tag,
    # rather than the nixl.<sha> a commit pin produced.
    variant: "nixl{nixl_tag|ver}-ucx.{ucx_commit|short}"
    labels:
      "{ns}.rocm.version": "{rocm_version}"
      "{ns}.cuda.version": "{cuda_version|dots}"
      "{ns}.rocm.stream": "{rocm_stream}"
      "{ns}.nixl.tag": "{nixl_tag}"
      "{ns}.ucx.branch": "{ucx_branch}"
      "{ns}.ucx.commit": "{ucx_commit}"

  ubuntu-rocm-ernic:
    job: matrix
    description: >-
      A source build of rocm-ernic, which emulates an RDMA NIC and serves it to
      a guest over vfio-user.
    base: ubuntu-libvfio-user
    artifact: true
    vars:
      rocm_ernic_commit: 0b48aa1d5821a66c4fb5b78f049b1d9a759a6e17
    build_args:
      ROCM_ERNIC_COMMIT: "{rocm_ernic_commit}"
    # This image links against libvfio-user, so that pin belongs in the tag:
    # without it two builds differing only in it would collide.
    variant: "ernic.{rocm_ernic_commit|short}-vfu.{libvfio_user_commit|short}"
    labels:
      "{ns}.ernic.commit": "{rocm_ernic_commit}"
      "{ns}.libvfio-user.commit": "{libvfio_user_commit}"

  ubuntu-rocm-rocjitsu:
    job: matrix
    description: >-
      An emulated gfx1250 GPU served by rocjitsu over vfio-user, so a guest
      needs no physical GPU.
    base: ubuntu-base
    artifact: true
    vars:
      rocjitsu_repo:
        value: https://github.com/ROCm/rocm-systems.git
        env: ROCM_ROCJITSU_REPO
      # develop, at last. The gfx1250 vfio-compute work this image was pinned
      # to a review branch for -- users/agutierr/gfx1250-vfio-compute-6, a
      # stack of PRs #11391 through #11397 -- was squashed onto develop as
      # bdc4aea25 and d5927b503 and the branch deleted, so the old pin is not
      # an ancestor of anything that still exists. version-scrub.sh tracks
      # whichever branch this names.
      rocjitsu_branch:
        value: develop
        env: ROCM_ROCJITSU_BRANCH
      # The branch head. A bump is not free: the Dockerfile asserts the three
      # upstream behaviours that replaced the local patch series this image
      # used to carry, so a refactor that drops one fails the build rather than
      # shipping a guest that hangs. Those asserts are the only test of them
      # that exists -- no CI anywhere enables ROCJITSU_ENABLE_VFIO, so develop
      # can lose the vfio-user compute path with every upstream check green.
      rocjitsu_commit:
        value: c85bb752577b6608745f4ff7835e3da91a190795
        env: ROCM_ROCJITSU_COMMIT
      # Compile-time log groups (emulation/rocjitsu/cmake/rj_log.cmake): OFF,
      # ALL, a comma-separated subset of VM, CP, DBT_HOOKS, PLUGINS, DRIVER, or
      # a raw bitmask.
      #
      # There is no runtime gate: util/log.h reads this into a constexpr, so a
      # group compiled in prints unconditionally, mutex-serialised, for every
      # event. CP -- the command processor's doorbell, dispatch and completion
      # path -- was on while the patch series was being proven out, and it is
      # too noisy to leave on for ordinary use: it narrates every dispatch a
      # guest makes. Set it back to CP for a build you are debugging a stuck
      # dispatch on. Warnings and errors print either way, so the vfio-user
      # front end still says what it is serving and still says when it fails.
      # Quoted: bare OFF is a YAML 1.1 boolean and reaches cmake as "False".
      rocjitsu_log_groups:
        value: "OFF"
        env: ROCM_ROCJITSU_LOG_GROUPS
      # Only gfx_target_version 120500 has an IP discovery profile upstream, so
      # this is the only config the vfio-user front end can actually serve. It
      # is a var so a variant built against a different upstream ref can point
      # at a renamed or newly added profile without touching the Dockerfile.
      rocjitsu_config:
        value: gfx1250_mi455x.json
        env: ROCM_ROCJITSU_CONFIG
    build_args:
      ROCJITSU_REPO: "{rocjitsu_repo}"
      ROCJITSU_BRANCH: "{rocjitsu_branch}"
      ROCJITSU_COMMIT: "{rocjitsu_commit}"
      ROCJITSU_CONFIG: "{rocjitsu_config}"
      ROCJITSU_LOG_GROUPS: "{rocjitsu_log_groups}"
    variant: "rocjitsu.{rocjitsu_commit|short}"
    labels:
      "{ns}.rocjitsu.branch": "{rocjitsu_branch}"
      "{ns}.rocjitsu.commit": "{rocjitsu_commit}"
      "{ns}.rocjitsu.log-groups": "{rocjitsu_log_groups}"

  # The storage device server, completing the set: rocm-ernic serves a NIC,
  # rocjitsu serves a GPU, this serves an NVMe controller.
  #
  # base: ubuntu-base, not ubuntu-libvfio-user, and libvfio_user_commit is
  # deliberately absent from both the vars and the tag. SPDK's vfio-user target
  # only builds against libvfio-user's own spdk branch, which its submodule
  # carries; the shared pin in defaults.vars tracks the qemu-project tree that
  # QEMU and rocm-ernic build against. Pinning both from here would mean one
  # bump breaking the other, so this image takes the submodule and the
  # Dockerfile reads the resolved SHA back out for the label below. That is why
  # the tag is spdk.<sha> alone rather than the two-pin form ernic uses.
  ubuntu-spdk-libvfio-user:
    job: matrix
    description: >-
      SPDK's NVMe-oF target serving an NVMe controller with LBA and KV
      namespaces over vfio-user.
    base: ubuntu-base
    artifact: true
    vars:
      # A fork, and not a temporary embarrassment: upstream SPDK v26.05 added
      # the Key Value command set to the NVMe *initiator* only
      # (include/spdk/nvme_kv.h). The target-side kvdev layer, module/kvdev/
      # and nvmf_subsystem_add_kv_ns exist nowhere upstream, so no spdk/spdk ref
      # can serve a KV namespace to a guest and there is no upstream variant to
      # offer. This is the tree ROCm/rocm-xio PR #183 proved the KV path on.
      #
      # version-scrub.sh follows whichever branch spdk_branch names, so expect
      # the pin to move while the work is out of tree. Retire the fork -- repo,
      # branch and this comment -- when the kvdev series lands upstream.
      spdk_repo:
        value: https://github.com/mmgaggle/spdk.git
        env: SPDK_REPO
      spdk_branch:
        value: rados-nkv
        env: SPDK_BRANCH
      spdk_commit:
        value: 18d1d8dab4f2020e10349009e69f94d47de100f9
        env: SPDK_COMMIT
      # "false" by default (a real value, not empty, so the release image's
      # spdk.debug label below reads false rather than blank -- matches
      # rocjitsu_log_groups's OFF/CP pattern above): the release image is
      # built with -DNDEBUG -O2 and SPDK_DEBUGLOG compiled out entirely
      # (include/spdk/log.h gates it on #ifdef DEBUG; see mk/spdk.common.mk).
      # Only the literal value "true" passes --enable-debug to configure,
      # which restores it and switches to -DDEBUG -g3 -O0
      # -fno-omit-frame-pointer -- useful for a stuck-dispatch or KV-fault
      # investigation, not for ordinary use: it is slower and far noisier.
      # See the debug variant below and its -L flag guidance in README.md.
      spdk_debug:
        value: "false"
        env: SPDK_DEBUG
    build_args:
      SPDK_REPO: "{spdk_repo}"
      SPDK_BRANCH: "{spdk_branch}"
      SPDK_COMMIT: "{spdk_commit}"
      SPDK_DEBUG: "{spdk_debug}"
    variant: "spdk.{spdk_commit|short}"
    labels:
      "{ns}.spdk.repo": "{spdk_repo}"
      "{ns}.spdk.branch": "{spdk_branch}"
      "{ns}.spdk.commit": "{spdk_commit}"
      "{ns}.spdk.debug": "{spdk_debug}"
    variants:
      debug:
        suffix: "-debug"
        description: >-
          SPDK built with --enable-debug, restoring SPDK_DEBUGLOG output
          (-L nvmf, -L nvmf_vfio, -L vfio_user_db, -L nvme, ...; component
          names come from each module's SPDK_LOG_REGISTER_COMPONENT call, not
          the transport name) that the release image compiles out. Also
          switches to -O0 -g3, no -DNDEBUG -- slower and much noisier, so
          this is for debugging, not ordinary use.
        vars:
          spdk_debug: "true"

  # The builder/runner toolchain, and only that: QEMU, the qemu-tool CLI,
  # ansible-core, libvfio-user. It builds no guest of its own -- ubuntu-qcow2-gen
  # below does that -- so it needs neither KVM, nor the insecure entitlement,
  # nor the cloud-image cache, and /output ships empty for a guest payload to be
  # mounted over.
  ubuntu-qemu-libvfio-user:
    job: matrix
    description: >-
      QEMU built with vfio-user, the qemu-tool CLI and ansible-core, but no
      guest; mount one at /output.
    base: ubuntu-libvfio-user
    artifact: true
    vars:
      qemu_repo: https://gitlab.com/qemu-project/qemu.git
      # A release tag (e.g. v11.1.1) or a commit hash; tags are typically
      # stable but not as strictly immutable as a full SHA.
      qemu_commit: v11.1.1
      # Where the qemu-tool CLI is installed from, and -- inherited by
      # ubuntu-qcow2-gen -- the ansible/ tree its guest builds are driven by, so
      # the CLI and the playbooks always come from one commit.
      qemu_minimal_repo: https://github.com/sbates130272/qemu-minimal.git
      qemu_minimal_commit: e73a1e636fecf2258968a01225c7425fb98d6aa2
      # Provenance only, and empty here: the default target builds a release
      # tag, which belongs to no branch. A fork variant fills it in and the
      # label appears only there.
      qemu_branch: ""
    build_args:
      QEMU_REPO: "{qemu_repo}"
      QEMU_COMMIT: "{qemu_commit}"
      QEMU_MINIMAL_REPO: "{qemu_minimal_repo}"
      QEMU_MINIMAL_COMMIT: "{qemu_minimal_commit}"
    # A release tag becomes qemu11.1.1; a fork branch or SHA is named rather
    # than dressed up as a version. Not expressible as a template.
    variant: "!qemu_variant"
    labels:
      "{ns}.qemu.repo": "{qemu_repo}"
      "{ns}.qemu.commit": "{qemu_commit}"
      "{ns}.qemu.branch": "{qemu_branch}"
      "{ns}.libvfio-user.commit": "{libvfio_user_commit}"
    variants:
      sbates-fork:
        suffix: "-sbates-fork"
        description: >-
          QEMU from the sbates130272 fork, not the pinned upstream tag, adding
          unmerged PCI MMIO bridge work.
        # A SHA, not the branch name: the branch is rebased and force-pushed as
        # the series is reworked upstream, so a branch pin silently rebuilds a
        # different QEMU and the tag it publishes never changes. This commit is
        # the head of dev/stephen/pci-mmio-bridge-submit as of 2026-09-22.
        # version-scrub.sh must not touch it -- it tracks QEMU releases, and
        # this is not one.
        vars:
          qemu_repo: https://github.com/sbates130272/qemu.git
          qemu_commit: d757fa6cb3072fe1f2fc5767e9a76a298d4c7635
          qemu_branch: dev/stephen/pci-mmio-bridge-submit

  # Guest qcow2 images. One parameterised Dockerfile, one repository per
  # flavour: adding a guest is packages/<name>.txt, checks/<name>.sh, an
  # upstream Ansible playbook name and a variants: entry below.
  #
  # publish: artifact makes the disk itself the published thing -- an ORAS
  # artifact a libvirt or bare-metal consumer can pull with no container
  # runtime -- and exports /output to the gitignored output/<scope>/ on every
  # build. A FROM scratch payload image carrying /output is still published
  # alongside it until the ORAS path has proven itself on a real release.
  #
  # The guest kernel is deliberately absent from the tag: it is not knowable
  # until the guest is built. It is recorded in vm-info.json instead.
  ubuntu-qcow2-gen:
    job: derived
    description: >-
      Ready-to-boot Ubuntu guest disk, cloud-init provisioned and published as
      a qcow2 ORAS artifact.
    base: ubuntu-qemu-libvfio-user
    publish: artifact
    entitlement: security.insecure
    # The Dockerfile bind-mounts this; it holds the gitignored cloud-image
    # downloads and, on the AMD network, amd-root-ca.crt.
    context_dirs:
      - common/cloud-image-cache
    vars:
      flavour: basic
      # Guest disk size in GB. The qcow2 is sparse, so this is a ceiling the
      # guest filesystem can grow into rather than an allocation: the published
      # payload is the size of what is actually written, not this number.
      vm_size: 512
      # Resources for the build-time boots only -- gen-vm's provisioning boot
      # and probe-guest's verification boot. Not a property of the artifact:
      # a consumer running the finished qcow2 picks its own. gen-vm defaults to
      # 2/4096; 4 is the vCPU count a standard GitHub-hosted runner has, and
      # going past it on CI only adds scheduling overhead.
      #
      # Override per-host with VM_VCPUS / VM_VMEM in the environment or .env --
      # a local box with more cores than a runner is the case that wants it.
      vm_vcpus: 4
      vm_vmem: 4096
      # ubuntu-qcow2-gen/packages/<file> and ubuntu-qcow2-gen/checks/<flavour>.sh
      vm_packages: base.txt
      # qemu-minimal ansible/playbooks/<file>; empty means cloud-init only.
      vm_playbook: ""
      # An Ubuntu mainline build tag (kernel.ubuntu.com/mainline/<ref>/), or
      # empty to keep the kernel the release ships. Set it when a flavour needs
      # a kernel no Ubuntu archive has: the mainline .debs depend only on a
      # handful of base packages and are built once per version rather than
      # per release, so this is orthogonal to the release var above.
      kernel_ref: ""
      # Only read by a flavour whose provision script installs the AMD kernel
      # driver, and inert for every other one. A directory under
      # repo.radeon.com/amdgpu/ -- an explicit version, or "latest" for the
      # rolling symlink. The amdgpu-dkms package version that actually landed
      # is read back out of the guest into /etc/rocjitsu-guest.json, because
      # this names a repository and not a driver build.
      #
      # "latest" is the rolling symlink the rocm_setup role defaults to, and it
      # publishes jammy and noble only. A flavour on a release that tree has no
      # suite for must name a version directory that does -- see the rocjitsu
      # variant, which pins 31.60 for resolute.
      amdgpu_driver_version: "latest"
      # Empty by default: only a flavour whose provision script cares which
      # rdma-core the release packages reads it, and the pin belongs with the
      # flavour that needs it.
      rdma_core_version: ""
      # An axboe/fio commit to build in the guest, or empty to install no fio
      # at all. Only a flavour whose provision script builds it reads this.
      #
      # It has to be a source build rather than the distro package, and it has
      # to be a pin rather than a branch, for the same reason
      # ubuntu-cuda-rocm-fio carries one: the libhipfile ioengine landed on fio
      # master (67256d4e) and is in no release tag, so Ubuntu's fio has no such
      # engine. Keep this equal to that image's FIO_COMMIT -- the point of
      # measuring hipFile in the guest is to compare against the container's
      # numbers, and two different fios make that comparison meaningless.
      fio_commit: ""
      username: batesste
      vm_name: ""
      password:
        value: changeme
        secret: true
    build_args:
      QEMU_MINIMAL_REPO: "{qemu_minimal_repo}"
      QEMU_MINIMAL_COMMIT: "{qemu_minimal_commit}"
      FLAVOUR: "{flavour}"
      USERNAME: "{username}"
      VM_NAME: "{vm_name}"
      PASSWORD: "{password}"
      RELEASE: "{release}"
      ARCH: "{arch}"
      VM_SIZE: "{vm_size}"
      VM_VCPUS: "{vm_vcpus}"
      VM_VMEM: "{vm_vmem}"
      VM_PACKAGES: "{vm_packages}"
      VM_PLAYBOOK: "{vm_playbook}"
      KERNEL_REF: "{kernel_ref}"
      AMDGPU_DRIVER_VERSION: "{amdgpu_driver_version}"
      RDMA_CORE_VERSION: "{rdma_core_version}"
      FIO_COMMIT: "{fio_commit}"
    # kernel_ref is deliberately not in the tag: the flavour name already
    # distinguishes the images, and the resolved kernel goes in vm-info.json
    # and the label below, where it can carry the full build stamp.
    variant: "vm.{release}-{flavour}-qm.{qemu_minimal_commit|short}"
    labels:
      "{ns}.vm.release": "{release}"
      "{ns}.vm.flavour": "{flavour}"
      "{ns}.vm.packages": "{vm_packages}"
      "{ns}.vm.playbook": "{vm_playbook}"
      "{ns}.vm.kernel-ref": "{kernel_ref}"
      "{ns}.vm.amdgpu-driver-version": "{amdgpu_driver_version}"
      "{ns}.vm.rdma-core-version": "{rdma_core_version}"
      "{ns}.vm.fio-commit": "{fio_commit}"
      "{ns}.qemu-minimal.commit": "{qemu_minimal_commit}"
    variants:
      # For ROCm/rocm-ernic's ionic RDMA jobs: drivers/infiniband/hw/ionic
      # merged in Linux 6.18. The toolchain and rdma-core build deps are
      # pre-installed to save the jobs wall-clock; the ionic-ernic DKMS modules
      # are deliberately *not* built here, since building them from pinned
      # upstream sources is what those jobs exist to test.
      #
      # The kernel is mainline v7.2.3, the build rocm-ernic's self-hosted
      # guests are already passing on, stamp 202609030700. No Ubuntu release
      # ships it -- resolute GA is 7.0.0-31 -- so kernel_ref installs it on top
      # and the release only decides how painful that is. resolute makes it a
      # plain dpkg operation; noble needs a run-parts shim, because its
      # debianutils 5.17 takes one directory and the mainline preinst passes
      # two, and a third-party PPA for gcc-15, which 7.x headers require and
      # noble's gcc-13 cannot provide. Both are hand-modifications invisible to
      # dpkg -V, and both are how the existing guests were built.
      #
      # Do not move either pin without a green ionic-ernic DKMS build against
      # it: v7.2.4 sources call ib_umem_get_va, which 7.0 does not have. The
      # two are pinned separately here and in rocm-ernic, with nothing
      # asserting they stay compatible beyond checks/ionic.sh.
      #
      # vm_playbook stays empty until vm-ionic.yml lands in qemu-minimal, and
      # the pre-seeded /opt/ionic-src checkout waits on it.
      #
      # rdma_core_version is not an install instruction -- resolute packages
      # rdma-core, and its ibverbs-providers already carries the ionic
      # provider, so nothing is built or overwritten. It is the version
      # provision/ionic.sh asserts the release actually shipped before writing
      # it into the stamp ernic_guest_setup reads, and it moves when the
      # release does. Bump it with release: above, never on its own.
      ionic:
        suffix: "-ionic"
        description: >-
          Ubuntu guest disk on a mainline 7.2.3 kernel with the ionic RDMA
          driver, for rocm-ernic DKMS jobs.
        vars:
          flavour: ionic
          vm_packages: ionic.txt
          kernel_ref: v7.2.3
          rdma_core_version: "61.0"
        # rocm-ernic's two-VM job still copies the scratch payload image with
        # skopeo rather than pulling the artifact, and pins a dated tag to do
        # it. Hold this flavour's history longer than the repo default until
        # that job moves; reclaiming a few hundred GB is not worth breaking it.
        prune:
          keep_days: 90
          keep_count: 20

      # For ROCm/rocm-xio's test-vm-nvme job: a guest that is booted against a
      # rocjitsu emulated gfx1250 over vfio-user plus an emulated NVMe
      # controller, then builds and tests rocm-xio inside itself. That job
      # installed ROCm and amdgpu-dkms over SSH at runtime, costing the better
      # part of an hour per run; this flavour bakes it in once.
      #
      # release: resolute, and amdgpu_driver_version: 31.60, which are one
      # decision. 31.50 was the first amdgpu driver tree to publish a resolute
      # suite; 31.60 is the first to ship gfx1250 firmware (see below), and its
      # amdgpu-dkms is 1:7.1.9.31600000 -- still a driver that builds against
      # the 7.0 kernel 26.04 boots, still carrying GC 12.1.0 plus the UMSCH HW
      # IP enumeration (4e07da515d1c) the emulated gfx1250 needs, and still
      # carrying the kfd_device.c line provision/rocjitsu.sh patches for
      # atomics. The noble build this replaces could install only a ~24.04
      # amdgpu-dkms whose kcl layer will not compile against 7.0 at all, so its
      # module had to be built against the cloud image's 6.8 and could never
      # load, leaving the in-tree 7.0 driver to reject the device with
      # "Failed to add vcn/jpeg ip block". Do not move this pin back to
      # "latest": that symlink is still jammy/noble only.
      #
      # Most gfx1250 firmware now comes with the driver. amdgpu-dkms depends on
      # amdgpu-dkms-firmware, and from 31.60 that package ships real
      # gc_12_1_0_mec{,_1}.bin, gc_12_1_0_rlc{,_1}.bin, gc_12_1_0_uni_mes.bin
      # and sdma_7_1_0.bin into /lib/firmware/updates/amdgpu, which is exactly
      # the "same public driver release as the guest's amdgpu.ko" pairing
      # upstream's qemu-vfio.md asks for. 31.50 shipped 683 files and not one
      # of them, which is why this flavour used to carry no firmware at all.
      #
      # Three things it still does not carry, all of which stay in rocm-xio's
      # runtime playbook because they belong to the consumer's rocjitsu pin
      # rather than to the disk:
      #
      #   * ip_discovery.bin -- generated per-config by "rj-ip-discovery
      #     gfx1250" from the rocjitsu image the consumer runs.
      #   * gc_12_1_0_imu.bin -- the one blob no driver release ships, and
      #     AMDGPU_UCODE_REQUIRED under the amdgpu.fw_load_type=0 the vfio
      #     guest boots with. It comes from ubuntu-rocm-rocjitsu's
      #     vfio_guest_firmware.py, whose default --set gap emits it and
      #     nothing that would overwrite the packaged blobs.
      #   * The CI user's passwordless sudo.
      #
      # The amdgpu-probe helper was on that list and is now in, from
      # assets/shared/ -- offered, not run.  Nothing in the image invokes it and
      # amdgpu stays blacklisted; it is there because the parameters belong with
      # the driver build, and because the perf lane calls it by name.
      #
      # The KFD atomics patch is applied to the DKMS source and the module is
      # rebuilt from it, which is what survives a later dkms autoinstall.
      rocjitsu:
        suffix: "-rocjitsu"
        description: >-
          Ubuntu guest disk with ROCm userspace and a KFD-atomics-patched
          amdgpu-dkms, for rocm-xio's rocjitsu emulated-GPU jobs.
        vars:
          flavour: rocjitsu
          vm_packages: rocjitsu.txt
          release: resolute
          amdgpu_driver_version: "31.60"
          fio_commit: "6bc57a931f04fa3f50348d8c8f087187f050c6e1"

      # Both devices in one guest, for hipObject's ernic-rocjitsu-gpu lane: an
      # emulated ionic RDMA NIC served by rocm-ernic *and* an emulated gfx1250
      # served by rocjitsu. That lane used to derive this image at the start of
      # every run -- boot the rocjitsu guest bare, install a kernel, patch and
      # rebuild amdgpu, shut down, boot again with both vfio-user functions
      # attached -- at about fifteen minutes a run. This bakes it in.
      #
      # It is a third flavour rather than a change to either of the two above,
      # because both of those are consumed today and neither wants what this
      # one needs. The kernel is the reason: mainline v7.2.4, where ionic ->
      # the 7.2 floor and rocjitsu -> the release kernel pull in opposite
      # directions.
      #
      #   kernel_ref: v7.2.4 is a floor, not a preference. ionic_rdma calls
      #     ib_umem_get_va, a static inline that exists in 7.2.4 and does not
      #     exist in 7.0 or 7.1.13. The ionic flavour stays on v7.2.3, the
      #     build rocm-ernic is passing on; the two pins move independently and
      #     nothing asserts they stay equal.
      #
      #   amdgpu_driver_version: 31.60 for the rocjitsu flavour's reasons --
      #     the first driver tree with both a resolute suite and real gfx1250
      #     firmware. But amdgpu-dkms 7.1.9 does not build against 7.2.4 as
      #     shipped: three patches in
      #     ubuntu-qcow2-gen/assets/ernic-rocjitsu/patches/amdgpu/ make it, and
      #     one of them changes a KFD security check and is carried unreviewed.
      #     Read that directory's README before moving either pin.
      #
      # Unlike the rocjitsu flavour, this one bakes in the generated firmware
      # gap set -- gc_12_1_0_imu.bin and the two mes aliases. They are static
      # fixtures from ubuntu-rocm-rocjitsu's vfio-guest-firmware.py and do not
      # depend on which rocjitsu build serves the socket, so they can live on
      # the disk. ip_discovery.bin still cannot: it comes from rj-ip-discovery
      # at the consumer's own rocjitsu pin.
      #
      # No fio: this flavour measures RDMA and HIP, not storage.
      ernic-rocjitsu:
        suffix: "-ernic-rocjitsu"
        description: >-
          Ubuntu guest disk on mainline 7.2.4 with the ionic RDMA driver and a
          patched amdgpu-dkms, for hipObject's two-device jobs.
        vars:
          flavour: ernic-rocjitsu
          vm_packages: ernic-rocjitsu.txt
          release: resolute
          kernel_ref: v7.2.4
          amdgpu_driver_version: "31.60"
          rdma_core_version: "61.0"

# The README's pinned-upstream shields, generated by `ci-images-tool.py badges`
# so that a pin and the badge advertising it cannot drift apart. CI runs
# `badges --check` on every PR, so a bump that forgets the README fails review
# rather than shipping a lying badge.
#
# Each entry names the target to resolve the var against -- a var declared in
# defaults: resolves against any of them -- and the row it belongs to.
#
#   short: true  abbreviates a SHA to 7 characters, as the image tags do.
#   link:        "{value}" interpolates the resolved pin, so a commit badge
#                can point at that exact commit upstream.
#
# Deleting an entry drops the badge; no code change is involved either way.
badges:
  rows:
    - title: Pinned versions
      entries:
        - label: ubuntu
          target: ubuntu-base
          var: ubuntu_version
          colour: E95420
          link: https://hub.docker.com/_/ubuntu
        - label: rocm
          target: ubuntu-cuda-rocm
          var: rocm_version
          colour: ED1C24
          link: https://rocm.docs.amd.com/
        - label: cuda
          target: ubuntu-cuda-rocm
          var: cuda_version
          dots: true
          colour: 76B900
          link: https://developer.nvidia.com/cuda-toolkit
        - label: qemu
          target: ubuntu-qemu-libvfio-user
          var: qemu_commit
          colour: FF6600
          link: https://gitlab.com/qemu-project/qemu/-/tags/{value}
        - label: nixl
          target: ubuntu-rocm-nixl
          var: nixl_tag
          colour: 76B900
          link: https://github.com/ai-dynamo/nixl/releases/tag/{value}
        - label: abseil
          target: ubuntu-rocm-nixl
          var: absl_tag
          colour: 4285F4
          link: https://github.com/abseil/abseil-cpp/releases/tag/{value}
        - label: grpc
          target: ubuntu-rocm-nixl
          var: grpc_tag
          colour: 244C5A
          link: https://github.com/grpc/grpc/releases/tag/{value}
        - label: libfabric
          target: ubuntu-rocm-nixl
          var: libfabric_tag
          colour: 0F4C81
          link: https://github.com/ofiwg/libfabric/releases/tag/{value}
        - label: guest
          target: ubuntu-qcow2-gen
          var: release
          colour: 772953
          link: https://cloud-images.ubuntu.com/
        # Two flavours install a kernel of their own, so these read the variant
        # rather than the default target. They are pinned separately on
        # purpose: ionic's is the build rocm-ernic is passing on, and
        # ernic-rocjitsu's is the floor ib_umem_get_va sets.
        - label: guest kernel (ionic)
          target: ubuntu-qcow2-gen@ionic
          var: kernel_ref
          colour: 772953
          link: https://kernel.ubuntu.com/mainline/{value}/
        - label: guest kernel (ernic-rocjitsu)
          target: ubuntu-qcow2-gen@ernic-rocjitsu
          var: kernel_ref
          colour: 772953
          link: https://kernel.ubuntu.com/mainline/{value}/
    - title: Pinned commits
      entries:
        - label: libvfio-user
          target: ubuntu-libvfio-user
          var: libvfio_user_commit
          short: true
          colour: FF6600
          link: https://gitlab.com/qemu-project/libvfio-user/-/commit/{value}
        - label: qemu-minimal
          target: ubuntu-qemu-libvfio-user
          var: qemu_minimal_commit
          short: true
          colour: FF6600
          link: https://github.com/sbates130272/qemu-minimal/commit/{value}
        - label: rocm-ernic
          target: ubuntu-rocm-ernic
          var: rocm_ernic_commit
          short: true
          colour: ED1C24
          link: https://github.com/ROCm/rocm-ernic/commit/{value}
        - label: rocjitsu
          target: ubuntu-rocm-rocjitsu
          var: rocjitsu_commit
          short: true
          colour: ED1C24
          link: https://github.com/ROCm/rocm-systems/commit/{value}
        # Links into the fork, not spdk/spdk: the commit only exists there.
        - label: spdk
          target: ubuntu-spdk-libvfio-user
          var: spdk_commit
          short: true
          colour: 00A3E0
          link: https://github.com/mmgaggle/spdk/commit/{value}
        - label: fio
          target: ubuntu-cuda-rocm-fio
          var: fio_commit
          short: true
          colour: 4B8BBE
          link: https://github.com/axboe/fio/commit/{value}
        - label: ucx
          target: ubuntu-rocm-nixl
          var: ucx_commit
          short: true
          colour: 4B8BBE
          link: https://github.com/openucx/ucx/commit/{value}
        - label: etcd-cpp-apiv3
          target: ubuntu-rocm-nixl
          var: etcd_commit
          short: true
          colour: 419EDA
          link: https://github.com/etcd-cpp-apiv3/etcd-cpp-apiv3/commit/{value}
