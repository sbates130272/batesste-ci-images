# Single source of truth for every image this repo publishes.
#
# ci-images-tool.py is a generic engine over this file: the pins, the build
# args, the tag variant, the OCI labels and the base each image layers on are
# all declared here and nowhere else. Adding an image means adding a Dockerfile
# and an entry below -- no Python change.
#
# A *target* is an image plus an optional variant: the same Dockerfile built
# with overlaid vars and published to its own suffixed repository. Refer to one
# on the command line as `<image>@<variant>`.
#
# vars
#   Each var is `name: value` or `name: {value: …, env: …, secret: true}`.
#   The environment can override a var (env name defaults to the var name
#   upper-cased) -- but never one a variant pins, so a stray .env cannot
#   rewrite what a variant is deliberately built against. An empty env value
#   means "unset"; `none` means "disabled".
#
# templates
#   "{var}" interpolates, with optional filters: |short (abbreviate a SHA or
#   branch), |ver (strip a leading v), |dots (13-3 -> 13.3), |sanitise.
#   A leading ! names a Python helper for the rare case a template cannot
#   express (see VARIANT_HELPERS in ci-images-tool.py).
#
#   A `variant:` names the upstream pins and is not asked to identify a build
#   on its own: the fully specified tag prefixes the release and a fingerprint
#   of this repo's commit, so a changed Dockerfile or provision script cannot
#   land on a tag that is already taken. Nothing to declare here -- see
#   source_fingerprint() -- but it is why a variant need not chase every pin.
#
# job
#   Which CI job builds this image: `bases` (built once, up front),
#   `matrix` (the flat parallel matrix), `derived` (built after the matrix,
#   on top of an image the matrix produced).
#
# description
#   One sentence saying what the image is for. A variant may override it.
#   This is the single source for the image's OCI
#   org.opencontainers.image.description label and the short description on
#   its Docker Hub page, so the two cannot drift. The long-form Hub overview
#   is the image directory's own README.md.
#
#   Docker Hub caps the short description at 100 *bytes*. Anything longer is
#   trimmed at a word boundary with an ellipsis rather than rejected, but the
#   page reads better if the sentence fits; `describe --dry-run` shows the
#   byte count. The OCI label carries the full text either way.
#
# overlay
#   An optional, gitignored images.local.yml beside this file is deep-merged
#   over it for local experiments -- it can reach anything here, including a
#   variant's pins. CI never reads it. See the README.
#
# badges
#   The README's pinned-upstream shields are generated from the badges: block
#   at the foot of this file, so a pin and the badge that advertises it cannot
#   disagree. `ci-images-tool.py badges --write` regenerates them and
#   `--check` fails if the README is stale; CI runs the latter on every PR.

defaults:
  registry: docker.io
  registry_image: batesste-ci-images
  image_tag: auto
  label_namespace: io.batesste.ci-images

  # Repo-wide provenance. Every image gets these as standard OCI labels, and
  # `ci-images-tool.py describe` pushes the same facts to the Docker Hub page,
  # so the registry, the image and the hub page cannot disagree.
  #
  # {image} interpolates the image directory. licenses is empty because this
  # repo carries no LICENSE file; add one and set an SPDX id here to stamp it.
  metadata:
    source: https://github.com/sbates130272/batesste-ci-images
    url: https://github.com/sbates130272/batesste-ci-images
    documentation: https://github.com/sbates130272/batesste-ci-images/blob/main/{image}/README.md
    vendor: sbates130272
    authors: Stephen Bates
    licenses: ""

  # Shared by more than one image, so they cannot be owned by any single one.
  vars:
    libvfio_user_repo: https://gitlab.com/qemu-project/libvfio-user.git
    libvfio_user_commit: 803924493a7c787b2ba358751f55f07d5dba64b2
    # The Ubuntu cloud image every guest qcow2 is built from. Ubuntu 26.04 LTS
    # "resolute" ships Linux 7.0. This chooses the *userspace* only: the guest
    # kernel is whatever the release ships unless the flavour sets kernel_ref,
    # and the Ubuntu mainline builds are one set of .debs for all releases, so
    # a newer kernel is not a reason to move off a release. A flavour that
    # needs different userspace pins its own release var.
    release: resolute
    arch: amd64

# Retention for `ci-images-tool.py prune`. Only the immutable, fingerprinted
# date tags are ever candidates: every rolling alias (latest, the bare variant,
# 1.1, sha-…) and every semver release tag is kept regardless of what is set
# here, because those are what consumers and BASE_IMAGE resolve through.
#
# A tag has to fall outside *both* limits to be proposed -- older than
# keep_days *and* past the keep_count newest -- so a repository that has been
# quiet for a month keeps its history, and a busy day does not reap last week.
#
# An image or a variant may override the block wholesale with its own `prune:`.
prune:
  keep_days: 30
  keep_count: 10
  # Globs, matched against the whole tag. Reach for this when something
  # outside this repo pins a dated tag rather than a rolling one.
  protect: []

# Which changed files rebuild which image, for `targets --changed-from`.
# The dockerfile-test workflow hands it the branch's changed paths and builds
# only the targets that come back, instead of rebuilding all thirteen because
# one Dockerfile moved.
#
# An image needs nothing here: the default is its own directory (plus any
# context_dirs), which is the honest answer for all of them. Declare `paths:`
# on an image or a variant only to *replace* that default -- it is not merged,
# because a list that is merged is a list nobody can narrow.
#
# Two things the globs do not have to express. A rebuilt base selects
# everything layered on it, so ubuntu-cuda-rocm-fio need not name
# ubuntu-cuda-rocm/; the closure runs over `base:`, which cannot go stale the
# way a hand-copied glob would. And anything under `always:` selects every
# target, because these are the files that decide what *any* image builds --
# a pin moving in images.yml is a rebuild of whatever image it belongs to, and
# working out which from a diff is not something a glob can do.
#
# `**` spans directory separators; a single `*` stops at one.
path_filter:
  always:
    - images.yml
    - ci-images-tool.py
    - requirements.txt
    - .github/workflows/batesste-ci-images-dockerfile-test.yml
    # compose/ belongs here rather than on an image, because the only job that
    # exercises the stack -- test-compose -- requires four targets to have been
    # selected, and a compose-only diff selects none of them. Leave it out and a
    # PR that edits the stack starts the workflow, skips every job and reports
    # green having validated nothing.
    - compose/**

images:

  ubuntu-base:
    job: bases
    description: >-
      Ubuntu 24.04 base layer every other image here inherits, with
      build-essential, cmake and ccache.
    variant: "ubuntu{ubuntu_version|ver}"
    # common/ holds the root CA this image bakes in, so a change there is a
    # change to the base layer. Declared here rather than in path_filter's
    # always: list precisely so it goes through the base closure -- every
    # image inherits from this one, so the effect is the same and the reason
    # stays attached to the image that actually reads the directory.
    paths:
      - ubuntu-base/**
      - common/**
    labels:
      org.opencontainers.image.base.name: "docker.io/library/ubuntu:{ubuntu_version}"
      "{ns}.ubuntu.version": "{ubuntu_version}"

  ubuntu-libvfio-user:
    job: bases
    description: >-
      Ubuntu with libvfio-user built from source, the vfio-user protocol
      library consumers link against.
    base: ubuntu-base
    build_args:
      LIBVFIO_USER_REPO: "{libvfio_user_repo}"
      LIBVFIO_USER_COMMIT: "{libvfio_user_commit}"
    variant: "vfu.{libvfio_user_commit|short}"
    labels:
      "{ns}.libvfio-user.repo": "{libvfio_user_repo}"
      "{ns}.libvfio-user.commit": "{libvfio_user_commit}"
    variants:
      # The fork every host-doorbell consumer layers on. It exists as a variant
      # of this image rather than as a bumped default so the qcow2 guests --
      # which reach this image only through ubuntu-qemu-libvfio-user's default
      # target -- keep building against upstream, and so version-scrub.sh can go
      # on tracking qemu-project master in the default.
      #
      # Downstream images pick it up with `base_variant: sbates-fork`; see
      # ubuntu-qemu-libvfio-user and ubuntu-rocm-ernic below.
      #
      # The pin is repeated in ubuntu-rocm-ernic@sbates-fork,
      # ubuntu-spdk-libvfio-user@sbates-fork and
      # ubuntu-rocm-rocjitsu@sbates-fork, because a variant may only override
      # `vars:` and those are taken literally -- build_args and labels are read
      # from the image, so there is no var indirection to share. All five
      # must agree: they exist to be built against the same libvfio-user
      # as the QEMU that talks to them. version-scrub.sh warns when they
      # diverge, the way it already does for the guest fio pin.
      sbates-fork:
        suffix: "-sbates-fork"
        description: >-
          libvfio-user from the sbates130272 fork, adding the host MMIO
          doorbell fd protocol (opcode 19) and vfu_mmio_write() on top of the
          pinned upstream commit.
        # feat/host-doorbell-fd, rebased onto the libvfio_user_commit above:
        # this is that tree plus four commits, not a divergent one. Two paths
        # for a server to reach host MMIO without a REGION_WRITE round trip:
        #
        #   VFIO_USER_HOST_DOORBELL_FD (opcode 19) and
        #   vfu_setup_host_doorbell_cb() -- the client pushes an eventfd per
        #   doorbell up front, and ringing one is a single eventfd_write().
        #
        #   vfu_mmio_write() -- DMA_WRITE to an MMIO GPA with no prior
        #   registration, for writes that have no dedicated doorbell fd.
        #
        # The QEMU side of both is the sbates-fork variant of
        # ubuntu-qemu-libvfio-user; the two move together.
        #
        # A SHA, not the branch: the branch is force-pushed as the series is
        # reworked. version-scrub.sh tracks libvfio_user_commit against
        # qemu-project master and skips variants, which is right -- this is not
        # an upstream ref. Move it by hand, and move the default to the new
        # rebase base in the same commit.
        vars:
          libvfio_user_repo: https://github.com/sbates130272/libvfio-user.git
          libvfio_user_commit: 3719c3a852820502a7adc9c0c363fd64d48addf0

  ubuntu-kernel-build:
    job: matrix
    description: >-
      Ubuntu 24.04 carrying bison, flex, libelf and linux-headers-generic for
      kernel and module builds.
    base: ubuntu-base
    # Adds no pinned payload of its own, so the Ubuntu release is the only
    # thing that can differ between two of its builds.
    variant: "ubuntu{ubuntu_version|ver}"

  ubuntu-cuda-rocm:
    job: matrix
    description: >-
      Ubuntu 24.04 carrying nvcc and hipcc, the CUDA and ROCm/HIP toolkits,
      with no GPU kernel drivers.
    base: ubuntu-base
    # No CI artifact: its only consumer wants a registry ref, so the build job
    # pushes it straight to GHCR instead of round-tripping a ~13 GB tarball.
    vars:
      cuda_version: "13-4"
      # Selective on both streams, and a real pin.
      #
      # The therock apt source is versionless ("stable"), but it carries
      # several component lines side by side -- core-10.0 and core-10.1 today
      # -- and /opt/rocm is a Debian alternatives symlink resolving to exactly
      # one of them. A bare package name follows whichever line is newest, so
      # it can install outside the root everything else resolves through: that
      # is how a 10.1 hipFile landed in /opt/rocm/core-10.1 on a 10.0 image and
      # broke the fio build with the headers present but unreachable. So the
      # Dockerfile appends this to the package names (amdrocm10.1,
      # amdrocm-runtime-dev10.1, ...) and asserts the resolved root matches.
      # The legacy stream builds it into a repo URL, as before.
      #
      # Not auto-bumped. version-scrub.sh warns when a newer line appears but
      # leaves the pin alone -- moving ROCm is a decision, and taking it
      # silently is the failure mode this replaced.
      rocm_version: "10.1"
      # 'therock' (repo.amd.com, ROCm 7.13+) or 'legacy' (repo.radeon.com, <=7.2)
      rocm_stream: therock
    build_args:
      CUDA_VERSION: "{cuda_version}"
      ROCM_VERSION: "{rocm_version}"
      ROCM_STREAM: "{rocm_stream}"
    # CUDA_VERSION carries the apt package form (13-4); publish it the way
    # NVIDIA versions it (13.4).
    variant: "rocm{rocm_version|ver}-cuda{cuda_version|dots|ver}"
    labels:
      "{ns}.rocm.version": "{rocm_version}"
      "{ns}.cuda.version": "{cuda_version|dots}"
      "{ns}.rocm.stream": "{rocm_stream}"

  ubuntu-cuda-rocm-fio:
    job: derived
    description: >-
      fio with AMD libhipfile and NVIDIA libcufile direct-to-GPU engines, on a
      CUDA + ROCm toolkit base.
    base: ubuntu-cuda-rocm
    vars:
      # The commit the latest upstream release tags, not master's head.
      #
      # This used to have to be a master commit: the libhipfile engine landed
      # on master (67256d4e, 2026-05-08) and was in no tag, so a release build
      # had no such ioengine. fio-3.43 (2026-09-23) ships it -- 67256d4e is an
      # ancestor, and engines/libhipfile.c is the same blob there as on master
      # -- so the reason for tracking master is gone and the pin follows
      # releases instead.
      #
      # Still a SHA rather than the tag string: the Dockerfile fetches this
      # ref, the image tag abbreviates it with |short, and the badge links a
      # commit. fio_branch below records which tag it came from.
      fio_repo: https://github.com/axboe/fio.git
      fio_commit: d2dcd7e053d1902d2420f151c83990e6acdd9f8c
      # Which ref fio_commit came from. The default target now names the
      # release tag it was cut at; a variant built from a fork branch names
      # that branch instead.
      fio_branch: "fio-3.43"
    build_args:
      FIO_REPO: "{fio_repo}"
      FIO_COMMIT: "{fio_commit}"
      # hipFile must come from the same therock component line the base was
      # built on; see the rocm_version note in defaults.
      ROCM_VERSION: "{rocm_version}"
    variant: "rocm{rocm_version|ver}-cuda{cuda_version|dots|ver}-fio.{fio_commit|short}"
    labels:
      "{ns}.rocm.version": "{rocm_version}"
      "{ns}.cuda.version": "{cuda_version|dots}"
      "{ns}.rocm.stream": "{rocm_stream}"
      "{ns}.fio.commit": "{fio_commit}"
      "{ns}.fio.repo": "{fio_repo}"
      "{ns}.fio.branch": "{fio_branch}"
    variants:
      async-hipfile:
        suffix: "-async-hipfile"
        description: >-
          fio from ROCm's unmerged async hipFile branch, adding
          hipfile_mode=sync|batch|stream to libhipfile.
        # AMD's asynchronous hipFile work: adds hipfile_mode=sync|batch|stream
        # to the libhipfile engine. Published alongside the master build rather
        # than replacing it, so the upstream image keeps tracking axboe HEAD.
        #
        # This commit is the head of a WIP fork branch as of 2026-09-02, two
        # commits ahead of and two behind the master pin. version-scrub.sh must
        # not touch it. The branch is recorded so build.json and the branch
        # label say where the commit came from; it is provenance only, since
        # the Dockerfile fetches the commit directly. The pin does not track
        # the branch, so the two will diverge once the branch moves.
        vars:
          fio_repo: https://github.com/ROCm/fio.git
          fio_commit: c32261752c88b3f7aadfde4d011a028ae954f869
          fio_branch: zbyrne/async_hipfile_engine

  ubuntu-rocm-nixl:
    job: derived
    description: >-
      NIXL, NIXLBench and libfabric built from source over a ROCm-enabled UCX,
      for AMD GPU transfers.
    base: ubuntu-cuda-rocm
    vars:
      nixl_repo: https://github.com/ai-dynamo/nixl.git
      # A NIXL release tag, not a SHA: this image tracks tagged releases so the
      # tag it publishes names a version a consumer can recognise. The build
      # still records the resolved commit in nixl-commit.txt for provenance.
      # version-scrub.sh advances this to the newest stable tag and ignores
      # -rc ones.
      nixl_tag: "v1.5.0"
      # UCX is built from source rather than apt: the packaged build has no
      # ROCm transport, so it cannot register HIP memory.
      #
      # v1.23.x is the release branch upstream NIXL builds against, so this
      # matches what NIXL is tested on rather than running ahead of it on
      # master. Upstream names the branch and takes whatever it points at;
      # this pins the commit instead, so a build stays reproducible when the
      # branch moves under it. version-scrub.sh advances the pin along
      # whichever branch ucx_branch names.
      ucx_repo: https://github.com/openucx/ucx.git
      ucx_branch: v1.23.x
      ucx_commit: 8094f699daa0d53ea84d11b6cefd7dffa9c9eb46
      etcd_repo: https://github.com/etcd-cpp-apiv3/etcd-cpp-apiv3.git
      etcd_commit: 7c6e714f188f9576e25e0350cac4181139eec23e
      # Abseil and gRPC are built from source because Ubuntu's libgrpc++-dev
      # drags in an Abseil too old for NIXL. These match the pins upstream
      # NIXL uses in .ci/dockerfiles/Dockerfile.rocm.
      absl_repo: https://github.com/abseil/abseil-cpp.git
      # Upstream NIXL writes this as lts_2025_08_14, which is a *branch*, not a
      # tag -- it moves as that LTS line takes patches, despite upstream's
      # comment calling it immutable. This is the release tag at that branch's
      # current head, so it is the same tree and actually immutable.
      # version-scrub.sh does that branch -> tag resolution on every run.
      absl_tag: "20250814.2"
      grpc_repo: https://github.com/grpc/grpc.git
      grpc_tag: v1.73.0
      # NIXL only uses HIP in its libfabric plugin, so libfabric is what makes
      # the ROCm support here NIXL's own and not just UCX's.
      libfabric_repo: https://github.com/ofiwg/libfabric.git
      libfabric_tag: v1.21.0
    build_args:
      NIXL_REPO: "{nixl_repo}"
      NIXL_TAG: "{nixl_tag}"
      UCX_REPO: "{ucx_repo}"
      UCX_COMMIT: "{ucx_commit}"
      ETCD_REPO: "{etcd_repo}"
      ETCD_COMMIT: "{etcd_commit}"
      ABSL_REPO: "{absl_repo}"
      ABSL_TAG: "{absl_tag}"
      GRPC_REPO: "{grpc_repo}"
      GRPC_TAG: "{grpc_tag}"
      LIBFABRIC_REPO: "{libfabric_repo}"
      LIBFABRIC_TAG: "{libfabric_tag}"
    # A release tag becomes nixl1.4.1, the same way the QEMU image names a tag,
    # rather than the nixl.<sha> a commit pin produced.
    variant: "nixl{nixl_tag|ver}-ucx.{ucx_commit|short}"
    labels:
      "{ns}.rocm.version": "{rocm_version}"
      "{ns}.cuda.version": "{cuda_version|dots}"
      "{ns}.rocm.stream": "{rocm_stream}"
      "{ns}.nixl.tag": "{nixl_tag}"
      "{ns}.ucx.branch": "{ucx_branch}"
      "{ns}.ucx.commit": "{ucx_commit}"

  ubuntu-rocm-ernic:
    job: matrix
    description: >-
      A source build of rocm-ernic, which emulates an RDMA NIC and serves it to
      a guest over vfio-user.
    base: ubuntu-libvfio-user
    artifact: true
    vars:
      rocm_ernic_commit: 151379b0184b917d18ce367c40942aa5d663e696
    build_args:
      ROCM_ERNIC_COMMIT: "{rocm_ernic_commit}"
    # This image links against libvfio-user, so that pin belongs in the tag:
    # without it two builds differing only in it would collide.
    variant: "ernic.{rocm_ernic_commit|short}-vfu.{libvfio_user_commit|short}"
    labels:
      "{ns}.ernic.commit": "{rocm_ernic_commit}"
      "{ns}.libvfio-user.commit": "{libvfio_user_commit}"
    variants:
      # Same rocm-ernic, built against the host-doorbell-fd libvfio-user, for
      # pairing with ubuntu-qemu-libvfio-user-sbates-fork. The ERNIC server can
      # then take host MMIO doorbell fds via vfu_setup_host_doorbell_cb()
      # instead of sending a REGION_WRITE per ring -- but nothing in this image
      # forces it to: adopting the callback is a change in rocm-ernic, and this
      # variant only makes the API available to a build that wants it.
      #
      # The tag already carries both pins, so the default and this one cannot
      # collide: ernic.<sha>-vfu.8039244 against ernic.<sha>-vfu.3719c3a.
      sbates-fork:
        suffix: "-sbates-fork"
        description: >-
          rocm-ernic built against the sbates130272 libvfio-user fork, with the
          host MMIO doorbell fd protocol available to the vfio-user server.
        base_variant: sbates-fork
        # Must equal ubuntu-libvfio-user@sbates-fork; see the note there.
        vars:
          libvfio_user_repo: https://github.com/sbates130272/libvfio-user.git
          libvfio_user_commit: 3719c3a852820502a7adc9c0c363fd64d48addf0

  ubuntu-rocm-rocjitsu:
    job: matrix
    description: >-
      An emulated gfx1250 GPU served by rocjitsu over vfio-user, so a guest
      needs no physical GPU.
    base: ubuntu-base
    artifact: true
    vars:
      rocjitsu_repo:
        value: https://github.com/ROCm/rocm-systems.git
        env: ROCM_ROCJITSU_REPO
      # develop, at last. The gfx1250 vfio-compute work this image was pinned
      # to a review branch for -- users/agutierr/gfx1250-vfio-compute-6, a
      # stack of PRs #11391 through #11397 -- was squashed onto develop as
      # bdc4aea25 and d5927b503 and the branch deleted, so the old pin is not
      # an ancestor of anything that still exists. version-scrub.sh tracks
      # whichever branch this names.
      rocjitsu_branch:
        value: develop
        env: ROCM_ROCJITSU_BRANCH
      # A deliberate pin, not the branch head. version-scrub.sh reports when
      # develop has moved and does not rewrite this -- the same treatment the
      # amdgpu tree and the therock lines get, and for the same reason.
      #
      # A bump is not free: the Dockerfile asserts the three upstream
      # behaviours that replaced the local patch series this image used to
      # carry, so a refactor that drops one fails the build rather than
      # shipping a guest that hangs. Those asserts are the only test of them
      # that exists -- no CI anywhere enables ROCJITSU_ENABLE_VFIO, so develop
      # can lose the vfio-user compute path with every upstream check green.
      # Taking develop's head automatically meant every scrub re-rolled that
      # dice and re-fingerprinted this image plus everything layered on it;
      # this pin moved six times in the life of one branch.
      #
      # It stays a develop SHA because there is nothing better to name.
      # rocm-systems does publish tags, and therock-10.1 would otherwise line
      # up neatly with the ROCm line these images carry -- but it is a release
      # branch that diverged from develop, and the two commits that squashed
      # the gfx1250 vfio-compute work onto develop (bdc4aea25, d5927b503) are
      # over a thousand commits ahead of it. Pinning the tag would drop the
      # capability this image exists for.
      rocjitsu_commit:
        value: 98f6a72dcc49a5f809593deacbe5c9df89cde3b3
        env: ROCM_ROCJITSU_COMMIT
      # Compile-time log groups (emulation/rocjitsu/cmake/rj_log.cmake): OFF,
      # ALL, a comma-separated subset of VM, CP, DBT_HOOKS, PLUGINS, DRIVER, or
      # a raw bitmask.
      #
      # There is no runtime gate: util/log.h reads this into a constexpr, so a
      # group compiled in prints unconditionally, mutex-serialised, for every
      # event. CP -- the command processor's doorbell, dispatch and completion
      # path -- was on while the patch series was being proven out, and it is
      # too noisy to leave on for ordinary use: it narrates every dispatch a
      # guest makes. Set it back to CP for a build you are debugging a stuck
      # dispatch on. Warnings and errors print either way, so the vfio-user
      # front end still says what it is serving and still says when it fails.
      # Quoted: bare OFF is a YAML 1.1 boolean and reaches cmake as "False".
      rocjitsu_log_groups:
        value: "OFF"
        env: ROCM_ROCJITSU_LOG_GROUPS
      # Only gfx_target_version 120500 has an IP discovery profile upstream, so
      # this is the only config the vfio-user front end can actually serve. It
      # is a var so a variant built against a different upstream ref can point
      # at a renamed or newly added profile without touching the Dockerfile.
      rocjitsu_config:
        value: gfx1250_mi455x.json
        env: ROCM_ROCJITSU_CONFIG
      # The BAR0 window the vfio-user front end advertises, written into the
      # served config at build time. Upstream ships 268435456 -- 256 MiB, the
      # small-BAR ceiling -- so without this a guest sees a 256 MiB window onto
      # a 432 GiB device and pages the rest through the GART.
      #
      # `max` resolves to the largest power of two within the modelled device's
      # own vm.gpu.device.local_mem_size, which is 256 GiB for this profile.
      # Those are rocjitsu's own two bounds and it only warns about them, so
      # the resolution and the assertions live in the Dockerfile rather than a
      # number being restated here -- a renamed profile with different memory
      # gets the right window without an edit. `keep` reproduces upstream's
      # small BAR; an explicit power-of-two byte count is also accepted.
      #
      # Nothing is needed on the QEMU side: q35 sizes its 64-bit PCI hole
      # around the BARs the device advertises, and a guest attached to a
      # default build maps the window at 0x4000000000 with no pci-hole64-size
      # set. Measured, not assumed -- see the README.
      rocjitsu_vram_aperture:
        value: max
        env: ROCM_ROCJITSU_VRAM_APERTURE
      # Empty means "whatever emulation/rocjitsu/cmake/rj_libvfio_user.cmake
      # pins", which is nutanix/libvfio-user at v0.8. The sbates-fork variant
      # below fills these in and the Dockerfile redirects the fetch through
      # FETCHCONTENT_SOURCE_DIR_LIBVFIO-USER.
      #
      # Named _override_ and deliberately *not* the shared libvfio_user_repo /
      # libvfio_user_commit: those always hold a real upstream SHA, so reusing
      # them would silently repoint every default rocjitsu build off the ref
      # upstream chose. An override has to be asked for by name. Same reasoning
      # as ubuntu-spdk-libvfio-user, which has the same shape for the same
      # reason -- neither image layers on ubuntu-libvfio-user.
      libvfio_user_override_repo:
        value: ""
        env: ROCM_ROCJITSU_LIBVFIO_USER_REPO
      libvfio_user_override_commit:
        value: ""
        env: ROCM_ROCJITSU_LIBVFIO_USER_COMMIT
    build_args:
      ROCJITSU_REPO: "{rocjitsu_repo}"
      ROCJITSU_BRANCH: "{rocjitsu_branch}"
      ROCJITSU_COMMIT: "{rocjitsu_commit}"
      ROCJITSU_CONFIG: "{rocjitsu_config}"
      ROCJITSU_VRAM_APERTURE_BYTES: "{rocjitsu_vram_aperture}"
      ROCJITSU_LOG_GROUPS: "{rocjitsu_log_groups}"
      LIBVFIO_USER_REPO: "{libvfio_user_override_repo}"
      LIBVFIO_USER_COMMIT: "{libvfio_user_override_commit}"
    variant: "rocjitsu.{rocjitsu_commit|short}"
    labels:
      "{ns}.rocjitsu.branch": "{rocjitsu_branch}"
      "{ns}.rocjitsu.commit": "{rocjitsu_commit}"
      "{ns}.rocjitsu.log-groups": "{rocjitsu_log_groups}"
      # What was asked for, not what it resolved to -- `max` depends on the
      # profile. The resolved byte count is in rocjitsu-build.json, which is
      # read off the image rather than off the tag.
      "{ns}.rocjitsu.vram-aperture": "{rocjitsu_vram_aperture}"
      # Empty label values are dropped, so the default image carries neither of
      # these and only the variant advertises a libvfio-user of its own.
      "{ns}.libvfio-user.repo": "{libvfio_user_override_repo}"
      "{ns}.libvfio-user.commit": "{libvfio_user_override_commit}"
    variants:
      # rocjitsu built against the host-doorbell-fd fork rather than the v0.8
      # its own cmake declares, completing the set: with this, all four
      # vfio-user servers and the QEMU that talks to them can be built against
      # one libvfio-user.
      #
      # Buildable because this is a short forward step on the very tree
      # rocjitsu already pins, not a cross-tree swap: nutanix v0.8 is commit
      # 37491ed, the fork base 8039244 is five commits later, and the fork adds
      # two more. The only public-header change is additive --
      # vfu_host_doorbell_cb_t and vfu_setup_host_doorbell_cb() -- so every
      # vfu_* symbol vfio_device_host.cpp uses is declared identically in both,
      # and lib/'s source list is unchanged, which matters because
      # rj_libvfio_user.cmake hand-lists those files.
      #
      # Unlike the ernic and spdk variants, this one is not just "the same
      # source against a newer library": it pins a different rocjitsu as well.
      # users/stebates/rocjitsu-vfio-doorbell is the first consumer of the
      # protocol anywhere -- vfio_device_host.cpp calls
      # vfu_setup_host_doorbell_cb() once and vfu_mmio_write() three times --
      # so this is the image where the doorbell path is actually exercised
      # rather than merely linkable.
      #
      # It is diverged from develop, not ahead: three commits on, fifteen
      # behind the rocjitsu_commit the default target carries. Only the top
      # commit is the doorbell work. The two below it are Tony Gutierrez's,
      # unmerged, and they are the reason this variant matters beyond the
      # doorbell: feb387ca36 "validate multi-GPU topology and NET launch" (PR
      # #13851) and 6eceac0e01 "model stock-driver peer fabric traffic" (PR
      # #13852). 6eceac0e01 is the head of users/agutierr/pod-peer-hardware-02
      # itself, so this image is where that stack gets built at all -- nothing
      # else here pins it, and no upstream CI enables ROCJITSU_ENABLE_VFIO.
      # The third PR on that stack, #13854 (users/agutierr/pod-qualification-03),
      # is docs only and deliberately not carried.
      #
      # So the variant is older than the default everywhere except those three
      # commits, and the two are not comparable builds. Repin it to a rebase,
      # or to develop once all three land, rather than letting the gap grow.
      # Watch both branches, not just this one: Tony rebases his stack, and a
      # force-push there strands this pin the way it stranded the c46f6fce937
      # SHA an earlier note recommended.
      #
      # The doorbell commit also carries a one-line fix to Tony's
      # vfio_target_grants.cpp, and one to his line in vfio_device_host.cpp:
      # both wrote (void)::read/::write to discard a warn_unused_result, which
      # clang accepts and gcc does not, so his stack does not compile under the
      # -Wall -Wextra -Wpedantic -Werror that rocjitsu's own CMakeLists sets
      # for the gcc-14 this image builds with. Reported upstream. When he fixes
      # it there, those two lines conflict on the next rebase -- take his.
      sbates-fork:
        suffix: "-sbates-fork"
        description: >-
          rocjitsu from the vfio-doorbell branch, built against the sbates130272
          libvfio-user fork, calling the host MMIO doorbell and vfu_mmio_write
          paths rather than only linking against them.
        vars:
          # A branch head, so a force-push rebuilds something different under
          # the same tag. Pinned by SHA for that reason, like every other fork
          # pin here. version-scrub.sh skips variants, so it will not move.
          rocjitsu_commit: 3141e64ee3b76a44c13726f0d08995c035f70f4e
          # This branch already points its own rj_libvfio_user.cmake at the
          # fork at exactly this SHA, so the override below is belt-and-braces
          # rather than the mechanism. Kept deliberately: it pins the library
          # from here even if the branch's cmake drifts, and it is what the
          # build-time assert checks. Must equal ubuntu-libvfio-user@sbates-fork;
          # see the note there.
          libvfio_user_override_repo: https://github.com/sbates130272/libvfio-user.git
          libvfio_user_override_commit: 3719c3a852820502a7adc9c0c363fd64d48addf0
        # The default tag names rocjitsu alone, because upstream's libvfio-user
        # pin is not a var here. This one must name both, or it collides with
        # the default on the same rocjitsu_commit.
        variant: "rocjitsu.{rocjitsu_commit|short}-vfu.{libvfio_user_override_commit|short}"

  # The storage device server, completing the set: rocm-ernic serves a NIC,
  # rocjitsu serves a GPU, this serves an NVMe controller.
  #
  # base: ubuntu-base, not ubuntu-libvfio-user, and libvfio_user_commit is
  # deliberately absent from both the vars and the tag. SPDK's vfio-user target
  # only builds against libvfio-user's own spdk branch, which its submodule
  # carries; the shared pin in defaults.vars tracks the qemu-project tree that
  # QEMU and rocm-ernic build against. Pinning both from here would mean one
  # bump breaking the other, so this image takes the submodule and the
  # Dockerfile reads the resolved SHA back out for the label below. That is why
  # the tag is spdk.<sha> alone rather than the two-pin form ernic uses.
  ubuntu-spdk-libvfio-user:
    job: matrix
    description: >-
      SPDK's NVMe-oF target serving an NVMe controller with LBA and KV
      namespaces over vfio-user.
    base: ubuntu-base
    artifact: true
    vars:
      # A fork, and not a temporary embarrassment: upstream SPDK v26.05 added
      # the Key Value command set to the NVMe *initiator* only
      # (include/spdk/nvme_kv.h). The target-side kvdev layer, module/kvdev/
      # and nvmf_subsystem_add_kv_ns exist nowhere upstream, so no spdk/spdk ref
      # can serve a KV namespace to a guest and there is no upstream variant to
      # offer. This is the tree ROCm/rocm-xio PR #183 proved the KV path on.
      #
      # version-scrub.sh follows whichever branch spdk_branch names, so expect
      # the pin to move while the work is out of tree. Retire the fork -- repo,
      # branch and this comment -- when the kvdev series lands upstream.
      spdk_repo:
        value: https://github.com/mmgaggle/spdk.git
        env: SPDK_REPO
      spdk_branch:
        value: rados-nkv
        env: SPDK_BRANCH
      spdk_commit:
        value: 18d1d8dab4f2020e10349009e69f94d47de100f9
        env: SPDK_COMMIT
      # Empty means "use the submodule", which is the default and the whole
      # reason this image does not layer on ubuntu-libvfio-user. The
      # sbates-fork variant below fills these in to check the submodule out at
      # a different ref after `submodule update --init`.
      #
      # Deliberately *not* the shared libvfio_user_repo/libvfio_user_commit:
      # those always hold a real upstream SHA, so reusing them here would make
      # every default build silently override the submodule. An override has to
      # be asked for by name.
      libvfio_user_override_repo:
        value: ""
        env: SPDK_LIBVFIO_USER_REPO
      libvfio_user_override_commit:
        value: ""
        env: SPDK_LIBVFIO_USER_COMMIT
    build_args:
      SPDK_REPO: "{spdk_repo}"
      SPDK_BRANCH: "{spdk_branch}"
      SPDK_COMMIT: "{spdk_commit}"
      LIBVFIO_USER_REPO: "{libvfio_user_override_repo}"
      LIBVFIO_USER_COMMIT: "{libvfio_user_override_commit}"
    variant: "spdk.{spdk_commit|short}"
    labels:
      "{ns}.spdk.repo": "{spdk_repo}"
      "{ns}.spdk.branch": "{spdk_branch}"
      "{ns}.spdk.commit": "{spdk_commit}"
    variants:
      # SPDK's NVMe-oF target built against the host-doorbell-fd fork instead of
      # the submodule, so its vfio-user server can call
      # vfu_setup_host_doorbell_cb() and ring a host MMIO doorbell with one
      # eventfd_write() rather than a REGION_WRITE per doorbell. As with the
      # ernic variant, this only makes the API reachable; calling it is a change
      # in SPDK's target.
      #
      # This is a forward move on the submodule's own tree, not a cross-tree
      # swap -- which is what makes it buildable at all. The submodule is plain
      # nutanix/libvfio-user (.gitmodules), pinned at f922ada, and the fork
      # branch is 35 commits further along the same master plus the doorbell
      # series. The header comment above says SPDK builds only against
      # libvfio-user's spdk branch; that is why this is a variant and not a bump
      # of the default, and why the variant is allowed to fail on its own.
      sbates-fork:
        suffix: "-sbates-fork"
        description: >-
          SPDK's NVMe-oF target built against the sbates130272 libvfio-user
          fork, with the host MMIO doorbell fd protocol available to the target.
        # Must equal ubuntu-libvfio-user@sbates-fork; see the note there.
        vars:
          libvfio_user_override_repo: https://github.com/sbates130272/libvfio-user.git
          libvfio_user_override_commit: 3719c3a852820502a7adc9c0c363fd64d48addf0
        # The submodule SHA is not knowable until build time, so the default
        # tag names SPDK alone. This one can name both, and must: otherwise it
        # collides with the default on the same spdk_commit.
        variant: "spdk.{spdk_commit|short}-vfu.{libvfio_user_override_commit|short}"

  # The builder/runner toolchain, and only that: QEMU, the qemu-tool CLI,
  # ansible-core, libvfio-user. It builds no guest of its own -- ubuntu-qcow2-gen
  # below does that -- so it needs neither KVM, nor the insecure entitlement,
  # nor the cloud-image cache, and /output ships empty for a guest payload to be
  # mounted over.
  ubuntu-qemu-libvfio-user:
    job: matrix
    description: >-
      QEMU built with vfio-user, the qemu-tool CLI and ansible-core, but no
      guest; mount one at /output.
    base: ubuntu-libvfio-user
    artifact: true
    vars:
      qemu_repo: https://gitlab.com/qemu-project/qemu.git
      # A release tag (e.g. v11.1.2) or a commit hash; tags are typically
      # stable but not as strictly immutable as a full SHA.
      qemu_commit: v11.1.2
      # Where the qemu-tool CLI is installed from, and -- inherited by
      # ubuntu-qcow2-gen -- the ansible/ tree its guest builds are driven by, so
      # the CLI and the playbooks always come from one commit.
      qemu_minimal_repo: https://github.com/sbates130272/qemu-minimal.git
      qemu_minimal_commit: c0791954aec508bfd3f26d11d6960f279d4b175a
      # Provenance only, and empty here: the default target builds a release
      # tag, which belongs to no branch. A fork variant fills it in and the
      # label appears only there.
      qemu_branch: ""
    build_args:
      QEMU_REPO: "{qemu_repo}"
      QEMU_COMMIT: "{qemu_commit}"
      QEMU_MINIMAL_REPO: "{qemu_minimal_repo}"
      QEMU_MINIMAL_COMMIT: "{qemu_minimal_commit}"
    # A release tag becomes qemu11.1.1; a fork branch or SHA is named rather
    # than dressed up as a version. Not expressible as a template.
    variant: "!qemu_variant"
    labels:
      "{ns}.qemu.repo": "{qemu_repo}"
      "{ns}.qemu.commit": "{qemu_commit}"
      "{ns}.qemu.branch": "{qemu_branch}"
      "{ns}.libvfio-user.commit": "{libvfio_user_commit}"
    variants:
      sbates-fork:
        suffix: "-sbates-fork"
        description: >-
          QEMU from the sbates130272 fork, not the pinned upstream tag, adding
          unmerged PCI MMIO bridge work.
        # Layered on the matching libvfio-user fork, not the default base: this
        # QEMU speaks VFIO_USER_HOST_DOORBELL_FD (opcode 19) and serves the
        # DMA_WRITE-to-MMIO path behind vfu_mmio_write(), neither of which the
        # pinned upstream libvfio-user implements. The two move together or the
        # negotiation fails at connect.
        base_variant: sbates-fork
        # A SHA, not the branch name: the branch is rebased and force-pushed as
        # the series is reworked upstream, so a branch pin silently rebuilds a
        # different QEMU and the tag it publishes never changes. This commit is
        # the head of dev/stephen/pci-mmio-bridge-submit as of 2026-10-22,
        # "docs/vfio-user: document vfu_mmio_write and Option A DMA_WRITE
        # extension". It carries the pci-mmio-bridge device (a shared ring for
        # peer-device -> host MMIO writes, with a memfd-backed shadow_gpa and
        # E820 reservation), assigns the region fd to the RAMBlock so vfio-user
        # P2P DMA carries it in DMA_MAP, and adds the host doorbell fd opcode.
        # Over the previous pin it extends DMA_WRITE to dispatch MMIO GPAs --
        # the server side of vfu_mmio_write() -- and fixes an invalid-pointer
        # free() in doorbell teardown.
        # version-scrub.sh must not touch it -- it tracks QEMU releases, and
        # this is not one.
        vars:
          qemu_repo: https://github.com/sbates130272/qemu.git
          qemu_commit: f91f12068854848cdb248f2a4636ddfe41f3283b
          qemu_branch: dev/stephen/pci-mmio-bridge-submit
          # Restated so the tag and the labels name what the image actually
          # carries; base_variant alone only changes which base it builds FROM.
          libvfio_user_repo: https://github.com/sbates130272/libvfio-user.git
          libvfio_user_commit: 3719c3a852820502a7adc9c0c363fd64d48addf0

  # Guest qcow2 images. One parameterised Dockerfile, one repository per
  # flavour: adding a guest is packages/<name>.txt, checks/<name>.sh, an
  # upstream Ansible playbook name and a variants: entry below.
  #
  # publish: artifact makes the disk itself the published thing -- an ORAS
  # artifact a libvirt or bare-metal consumer can pull with no container
  # runtime -- and exports /output to the gitignored output/<scope>/ on every
  # build. A FROM scratch payload image carrying /output is still published
  # alongside it until the ORAS path has proven itself on a real release.
  #
  # The guest kernel is deliberately absent from the tag: it is not knowable
  # until the guest is built. It is recorded in vm-info.json instead.
  ubuntu-qcow2-gen:
    job: derived
    description: >-
      Ready-to-boot Ubuntu guest disk, cloud-init provisioned and published as
      a qcow2 ORAS artifact.
    base: ubuntu-qemu-libvfio-user
    publish: artifact
    entitlement: security.insecure
    # The Dockerfile bind-mounts this; it holds the gitignored cloud-image
    # downloads and, on the AMD network, amd-root-ca.crt.
    context_dirs:
      - common/cloud-image-cache
      # The mainline kernel .debs, keyed by kernel_ref/arch. Same shape as the
      # cloud image above and for a sharper reason: kernel.ubuntu.com is the
      # one upstream a pinned-kernel flavour cannot build without, and it 503s
      # in bursts -- one CI run had all three kernel-pinned flavours meet the
      # same burst and one of them lose the build to it. Read-only here;
      # populated by actions/cache in CI, or by hand locally. On the cluster
      # common/ is shared home, so this cache survives changing node, which no
      # --mount=type=cache in this repo does.
      - common/kernel-cache
    # The stand-in for the `parentguest` build context, which the Dockerfile's
    # stage phase bind-mounts at /parent. A flavour that names a
    # guest_parent_variant gets that flavour's payload there instead; one that
    # does not gets this empty directory, because a --mount=from= naming a
    # context that does not exist fails the build. See noparent/README.md.
    parent_context: ubuntu-qcow2-gen/noparent
    # A variant may set `guest_parent_variant:` beside its `suffix:` to start
    # from another variant's finished qcow2 instead of building one. It is a
    # structural field rather than a var, for the same reason `base_variant`
    # is: it changes which targets this one depends on, and nothing renders it
    # into a template. See the ernic-rocjitsu-slim variant.
    vars:
      flavour: basic
      # Guest disk size in GB. The qcow2 is sparse, so this is a ceiling the
      # guest filesystem can grow into rather than an allocation: the published
      # payload is the size of what is actually written, not this number.
      vm_size: 512
      # Resources for the build-time boots only -- gen-vm's provisioning boot
      # and probe-guest's verification boot. Not a property of the artifact:
      # a consumer running the finished qcow2 picks its own. gen-vm defaults to
      # 2/4096; 4 is the vCPU count a standard GitHub-hosted runner has, and
      # going past it on CI only adds scheduling overhead.
      #
      # Override per-host with VM_VCPUS / VM_VMEM in the environment or .env --
      # a local box with more cores than a runner is the case that wants it.
      vm_vcpus: 4
      vm_vmem: 4096
      # ubuntu-qcow2-gen/packages/<file> and ubuntu-qcow2-gen/checks/<flavour>.sh
      vm_packages: base.txt
      # Whose ubuntu-qcow2-gen/provision/<name>.sh and assets/<name>/ this
      # flavour uses. Empty means its own, which is every flavour but a slim
      # one: those are another flavour's guest with things removed, and a
      # second copy of a 600-line provision script carrying unreviewed kernel
      # patches is precisely what should not exist twice.
      provision_flavour: ""
      # ubuntu-qcow2-gen/trim/<file>, run in a boot of its own after
      # provisioning and before the verification boot. Empty means the flavour
      # ships what it provisioned. A flavour that sets this also gets the
      # package-presence assertion skipped -- it installs a manifest in order
      # to build with it and then purges most of it -- so its checks file is
      # what asserts the guest's contents, negatives included.
      trim: ""
      # qemu-minimal ansible/playbooks/<file>; empty means cloud-init only.
      vm_playbook: ""
      # A second qemu-minimal ansible/playbooks/<file>, run against the guest
      # *after* the kernel layer and provision/<flavour>.sh, in a boot of its
      # own. Empty for a flavour that needs none.
      #
      # Separate from vm_playbook because of when each one runs, not because
      # of what it contains: gen-vm runs vm_playbook while it is creating the
      # VM, which is before a pinned kernel is installed, so a playbook that
      # compiles anything against the guest's kernel builds it against the
      # release's instead and installs it for a kernel the guest never boots.
      #
      # It is also how a flavour reaches a pin this repo deliberately does not
      # hold: the qemu-minimal checkout's requirements.yml pins rocm-ernic's
      # ansible collection to a SHA, and the ionic SRQ series is reached
      # through that collection rather than copied here. One nine-patch kernel
      # series, in one repository.
      post_playbook: ""
      # An Ubuntu mainline build tag (kernel.ubuntu.com/mainline/<ref>/), or
      # empty to keep the kernel the release ships. Set it when a flavour needs
      # a kernel no Ubuntu archive has: the mainline .debs depend only on a
      # handful of base packages and are built once per version rather than
      # per release, so this is orthogonal to the release var above.
      #
      # The mainline .debs are not configured like Ubuntu's release kernels,
      # and the difference is not a version gap: CONFIG_DMABUF_MOVE_NOTIFY is
      # =y on both 6.8 and the release 7.0, and absent entirely -- not "is not
      # set" -- from the mainline build (seen on 7.2.4, 2026-10-23). A consumer
      # that probes kernel config rather than capability can therefore conclude
      # a feature is missing when it works: rdma-perftest gates its ROCm
      # dma-buf path on that symbol and refuses to start, while the same
      # transfer runs fine under PERFTEST_ASSUME_DMABUF=1, because move_notify
      # is only needed for movable exporters and the path used is pinned.
      # Prefer fixing the probe; flipping the symbol means giving up the
      # prebuilt .debs and building the kernel here.
      kernel_ref: ""
      # Only read by a flavour whose provision script installs the AMD kernel
      # driver, and inert for every other one. A directory under
      # repo.radeon.com/amdgpu/ -- an explicit version, or "latest" for the
      # rolling symlink. The amdgpu-dkms package version that actually landed
      # is read back out of the guest into /etc/rocjitsu-guest.json, because
      # this names a repository and not a driver build.
      #
      # "latest" is the rolling symlink the rocm_setup role defaults to, and it
      # publishes jammy and noble only. A flavour on a release that tree has no
      # suite for must name a version directory that does -- see the rocjitsu
      # variant, which pins 31.60 for resolute. A directory can stop serving
      # without notice and come back days later (31.60 did, 2026-10-02 to
      # -10-05), so scripts/version-scrub.sh checks the pinned one still serves
      # the release and warns rather than bumping it.
      amdgpu_driver_version: "latest"
      # The TheRock ROCm component version the guest's userspace installs under
      # -- the packages land in /opt/rocm/core-<version>/, not /opt/rocm/, so
      # the path has to be named rather than assumed. Empty by default and only
      # read by a flavour that installs ROCm; those pin it, and provisioning
      # asserts the directory exists so a stale pin fails the build rather than
      # baking a dead PATH entry into the guest.
      #
      # Named guest_rocm_version rather than rocm_version because
      # ubuntu-cuda-rocm already declares the latter, and version-scrub.sh's
      # replace_yaml_var rewrites only the first match outside a variants:
      # block -- two keys of one name would have it silently rewrite the wrong
      # image's pin.
      guest_rocm_version: ""
      # Empty by default: only a flavour whose provision script cares which
      # rdma-core the release packages reads it, and the pin belongs with the
      # flavour that needs it.
      rdma_core_version: ""
      # An axboe/fio commit to build in the guest, or empty to install no fio
      # at all. Only a flavour whose provision script builds it reads this.
      #
      # It has to be a source build rather than the distro package, and it has
      # to be a pin rather than a branch, for the same reason
      # ubuntu-cuda-rocm-fio carries one: the libhipfile ioengine landed on fio
      # master (67256d4e) and is in no release tag, so Ubuntu's fio has no such
      # engine. Keep this equal to that image's FIO_COMMIT -- the point of
      # measuring hipFile in the guest is to compare against the container's
      # numbers, and two different fios make that comparison meaningless.
      fio_commit: ""
      # The login the guest is provisioned with. "ubuntu" is also the name of
      # the default user Ubuntu's own cloud images ship, so gen-vm is creating
      # a user cloud-init already knows about rather than a fresh one -- see
      # the note in the README before changing it back and forth.
      username: ubuntu
      vm_name: ""
      # The host port probe-guest forwards the guest's SSH to during the
      # verification boot. Per-flavour because a --security=insecure build step
      # shares the host network namespace, so two flavours building
      # concurrently -- which is what bake does, and what one job per CI runner
      # never did -- collide on it and the second fails to boot at all.
      #
      # Only ever bound on 127.0.0.1 inside the build, and only while the
      # verification boot runs. A flavour added below needs its own number.
      probe_ssh_port: 2222
      # Marked secret so it stays out of build-args output, the config table
      # and the generated bake spec -- but it is written verbatim into the
      # guest's vm-info.json, which ships inside the published artifact. These
      # are disposable CI guests and the password is deliberately well known;
      # do not treat one as anything else.
      password:
        value: ubuntu
        secret: true
    build_args:
      QEMU_MINIMAL_REPO: "{qemu_minimal_repo}"
      QEMU_MINIMAL_COMMIT: "{qemu_minimal_commit}"
      FLAVOUR: "{flavour}"
      USERNAME: "{username}"
      VM_NAME: "{vm_name}"
      PASSWORD: "{password}"
      RELEASE: "{release}"
      ARCH: "{arch}"
      VM_SIZE: "{vm_size}"
      VM_VCPUS: "{vm_vcpus}"
      VM_VMEM: "{vm_vmem}"
      VM_PACKAGES: "{vm_packages}"
      VM_PLAYBOOK: "{vm_playbook}"
      POST_PLAYBOOK: "{post_playbook}"
      PROVISION_FLAVOUR: "{provision_flavour}"
      TRIM: "{trim}"
      KERNEL_REF: "{kernel_ref}"
      AMDGPU_DRIVER_VERSION: "{amdgpu_driver_version}"
      # Composed here rather than stored as a var, so the version number lives
      # in exactly one place. A flavour that pins no guest_rocm_version renders
      # this as the bare "/opt/rocm/core-", which its provision script never
      # reads.
      ROCM_PATH: "/opt/rocm/core-{guest_rocm_version}"
      # The same line, unadorned: the provision scripts append it to the
      # therock package names so a guest cannot install one line's packages
      # under another line's root. See the rocm_version note in defaults.
      ROCM_VERSION: "{guest_rocm_version}"
      RDMA_CORE_VERSION: "{rdma_core_version}"
      FIO_COMMIT: "{fio_commit}"
      PROBE_SSH_PORT: "{probe_ssh_port}"
    # kernel_ref is deliberately not in the tag: the flavour name already
    # distinguishes the images, and the resolved kernel goes in vm-info.json
    # and the label below, where it can carry the full build stamp.
    variant: "vm.{release}-{flavour}-qm.{qemu_minimal_commit|short}"
    labels:
      "{ns}.vm.release": "{release}"
      "{ns}.vm.flavour": "{flavour}"
      "{ns}.vm.packages": "{vm_packages}"
      "{ns}.vm.playbook": "{vm_playbook}"
      "{ns}.vm.trim": "{trim}"
      "{ns}.vm.kernel-ref": "{kernel_ref}"
      "{ns}.vm.amdgpu-driver-version": "{amdgpu_driver_version}"
      "{ns}.vm.rocm-path": "/opt/rocm/core-{guest_rocm_version}"
      "{ns}.vm.rdma-core-version": "{rdma_core_version}"
      "{ns}.vm.fio-commit": "{fio_commit}"
      "{ns}.qemu-minimal.commit": "{qemu_minimal_commit}"
    variants:
      # For ROCm/rocm-ernic's ionic RDMA jobs: drivers/infiniband/hw/ionic
      # merged in Linux 6.18. The toolchain and rdma-core build deps are
      # pre-installed to save the jobs wall-clock; the ionic-ernic DKMS modules
      # are deliberately *not* built here, since building them from pinned
      # upstream sources is what those jobs exist to test.
      #
      # The kernel is mainline v7.2.6, stamp 202609141300 -- the same pin every
      # other mainline flavour here carries, and the top of the series: the
      # mainline PPA built v7.2.1 through v7.2.6 and then stopped, so v7.2.7
      # and up do not exist there however far upstream stable has run. Probe
      # kernel.ubuntu.com/mainline/<tag>/amd64/ before believing a newer one.
      #
      # This was v7.2.3 -- the build rocm-ernic's self-hosted guests pass on --
      # and moving it had been tried and reverted twice before, because nothing
      # downstream had been rebuilt against the newer pin. That is still the
      # risk and it has simply been accepted: the three mainline flavours are
      # now on one kernel deliberately. No Ubuntu release
      # ships it -- resolute GA is 7.0.0-31 -- so kernel_ref installs it on top
      # and the release only decides how painful that is. resolute makes it a
      # plain dpkg operation; noble needs a run-parts shim, because its
      # debianutils 5.17 takes one directory and the mainline preinst passes
      # two, and a third-party PPA for gcc-15, which 7.x headers require and
      # noble's gcc-13 cannot provide. Both are hand-modifications invisible to
      # dpkg -V, and both are how the existing guests were built.
      #
      # Do not move this below 7.2.4 whatever else changes: ionic_rdma calls
      # ib_umem_get_va, which exists from 7.2.4 and not in 7.0 or 7.1.13. That
      # floor is a compile-time fact and is not the same as being tested
      # -- this pin and rocm-ernic's IONIC_KERNEL_REF are still separate, with
      # nothing asserting they stay compatible beyond checks/ionic.sh.
      #
      # vm_playbook stays empty until vm-ionic.yml lands in qemu-minimal, and
      # the pre-seeded /opt/ionic-src checkout waits on it.
      #
      # rdma_core_version is not an install instruction -- resolute packages
      # rdma-core, and its ibverbs-providers already carries the ionic
      # provider, so nothing is built or overwritten. It is the version
      # provision/ionic.sh asserts the release actually shipped before writing
      # it into the stamp ernic_guest_setup reads, and it moves when the
      # release does. Bump it with release: above, never on its own.
      ionic:
        suffix: "-ionic"
        description: >-
          Ubuntu guest disk on a mainline 7.2.6 kernel with the ionic RDMA
          driver, for rocm-ernic DKMS jobs.
        vars:
          flavour: ionic
          vm_packages: ionic.txt
          probe_ssh_port: 2223
          kernel_ref: v7.2.6
          rdma_core_version: "61.0"
        # rocm-ernic's two-VM job still copies the scratch payload image with
        # skopeo rather than pulling the artifact, and pins a dated tag to do
        # it. Hold this flavour's history longer than the repo default until
        # that job moves; reclaiming a few hundred GB is not worth breaking it.
        prune:
          keep_days: 90
          keep_count: 20

      # For ROCm/rocm-xio's test-vm-nvme job: a guest that is booted against a
      # rocjitsu emulated gfx1250 over vfio-user plus an emulated NVMe
      # controller, then builds and tests rocm-xio inside itself. That job
      # installed ROCm and amdgpu-dkms over SSH at runtime, costing the better
      # part of an hour per run; this flavour bakes it in once.
      #
      # release: resolute, and amdgpu_driver_version: 31.60, which are one
      # decision. 31.50 was the first amdgpu driver tree to publish a resolute
      # suite; 31.60 is the first to ship gfx1250 firmware (see below), and its
      # amdgpu-dkms is 1:7.1.9.31600000 -- still a driver that builds against
      # the 7.0 kernel 26.04 boots, still carrying GC 12.1.0 plus the UMSCH HW
      # IP enumeration (4e07da515d1c) the emulated gfx1250 needs, and still
      # carrying the kfd_device.c line provision/rocjitsu.sh patches for
      # atomics. The noble build this replaces could install only a ~24.04
      # amdgpu-dkms whose kcl layer will not compile against 7.0 at all, so its
      # module had to be built against the cloud image's 6.8 and could never
      # load, leaving the in-tree 7.0 driver to reject the device with
      # "Failed to add vcn/jpeg ip block". Do not move this pin back to
      # "latest": that symlink is still jammy/noble only.
      #
      # This tree can vanish and come back. Between 2026-10-02 and 2026-10-05
      # repo.radeon.com stopped serving 31.60 entirely -- the directory itself
      # 404'd and it left the index listing, while 31.50 served normally -- and
      # then it returned intact. The repin to 31.50 made in the meantime broke
      # the ernic-rocjitsu flavour outright, because that tree's amdgpu-dkms is
      # 7.1.3 and the patches below are written against 7.1.9. So do not chase
      # availability: scripts/version-scrub.sh warns when this tree stops
      # serving resolute, and a warning is a prompt to look, not to repin.
      #
      # Most gfx1250 firmware now comes with the driver. amdgpu-dkms depends on
      # amdgpu-dkms-firmware, and from 31.60 that package ships real
      # gc_12_1_0_mec{,_1}.bin, gc_12_1_0_rlc{,_1}.bin, gc_12_1_0_uni_mes.bin
      # and sdma_7_1_0.bin into /lib/firmware/updates/amdgpu, which is exactly
      # the "same public driver release as the guest's amdgpu.ko" pairing
      # upstream's qemu-vfio.md asks for. 31.50 shipped 683 files and not one
      # of them, which is why this flavour used to carry no firmware at all.
      #
      # Three things it still does not carry, all of which stay in rocm-xio's
      # runtime playbook because they belong to the consumer's rocjitsu pin
      # rather than to the disk:
      #
      #   * ip_discovery.bin -- generated per-config by "rj-ip-discovery
      #     gfx1250" from the rocjitsu image the consumer runs.
      #   * gc_12_1_0_imu.bin -- the one blob no driver release ships, and
      #     AMDGPU_UCODE_REQUIRED under the amdgpu.fw_load_type=0 the vfio
      #     guest boots with. It comes from ubuntu-rocm-rocjitsu's
      #     vfio_guest_firmware.py, whose default --set gap emits it and
      #     nothing that would overwrite the packaged blobs.
      #   * The CI user's passwordless sudo.
      #
      # The amdgpu-probe helper was on that list and is now in, from
      # assets/shared/ -- offered, not run.  Nothing in the image invokes it and
      # amdgpu stays blacklisted; it is there because the parameters belong with
      # the driver build, and because the perf lane calls it by name.
      #
      # The KFD atomics patch is applied to the DKMS source and the module is
      # rebuilt from it, which is what survives a later dkms autoinstall.
      rocjitsu:
        suffix: "-rocjitsu"
        # Kept under Docker Hub's 100-byte short-description cap, which
        # trims at a word boundary and would otherwise cut the clause saying
        # what the image is for. `describe --dry-run` reports the byte count.
        description: >-
          Ubuntu guest disk with ROCm and a KFD-atomics-patched amdgpu-dkms,
          for rocm-xio's rocjitsu jobs.
        vars:
          flavour: rocjitsu
          vm_packages: rocjitsu.txt
          probe_ssh_port: 2224
          release: resolute
          # No kernel_ref: this flavour runs the release's own 7.0 kernel,
          # which is what amdgpu-dkms 7.1.9 builds against unaided. Pinning it
          # to mainline 7.2.x was tried and reverted -- it needs the 7.2 amdgpu
          # patch series, and with that in place the build still ended with
          # amdgpu.ko in the initramfs, which the assert in provisioning
          # correctly refuses to ship. Reinstating it means solving that first;
          # see the note beside the exclude hook.
          amdgpu_driver_version: "31.60"
          guest_rocm_version: "10.1"
          fio_commit: "d2dcd7e053d1902d2420f151c83990e6acdd9f8c"

      # Both devices in one guest, for hipObject's ernic-rocjitsu-gpu lane: an
      # emulated ionic RDMA NIC served by rocm-ernic *and* an emulated gfx1250
      # served by rocjitsu. That lane used to derive this image at the start of
      # every run -- boot the rocjitsu guest bare, install a kernel, patch and
      # rebuild amdgpu, shut down, boot again with both vfio-user functions
      # attached -- at about fifteen minutes a run. This bakes it in.
      #
      # It is a third flavour rather than a change to either of the two above,
      # because both of those are consumed today and neither wants what this
      # one needs -- though the kernel is no longer one of those reasons.
      # The kernel is the reason: mainline v7.2.6, where ionic -> the 7.2
      # floor and rocjitsu -> the release kernel pull in opposite directions.
      #
      #   kernel_ref: v7.2.4 is a floor, not a preference. ionic_rdma calls
      #     ib_umem_get_va, a static inline that exists in 7.2.4 and does not
      #     exist in 7.0 or 7.1.13. v7.2.6 is the top of the mainline PPA's
      #     7.2 series and clears that floor; the ionic flavour sits on it
      #     too, but the two pins move independently and nothing asserts they
      #     stay equal.
      #
      #   amdgpu_driver_version: 31.60 for the rocjitsu flavour's reasons --
      #     the first driver tree with both a resolute suite and real gfx1250
      #     firmware. It is also the only one that still ships an amdgpu-dkms
      #     the patches below apply to: they are written against 7.1.9, and
      #     31.50 -- the next tree down -- carries 7.1.3, where the ptrace
      #     patch fails both its hunks and the image build with it. But
      #     amdgpu-dkms 7.1.9 does not build against 7.2.4 as shipped: three
      #     patches in
      #     ubuntu-qcow2-gen/assets/ernic-rocjitsu/patches/amdgpu/ make it, and
      #     one of them changes a KFD security check and is carried unreviewed.
      #     Read that directory's README before moving either pin.
      #
      # Unlike the rocjitsu flavour, this one bakes in the generated firmware
      # gap set -- gc_12_1_0_imu.bin and the two mes aliases. They are static
      # fixtures from ubuntu-rocm-rocjitsu's vfio-guest-firmware.py and do not
      # depend on which rocjitsu build serves the socket, so they can live on
      # the disk. ip_discovery.bin still cannot: it comes from rj-ip-discovery
      # at the consumer's own rocjitsu pin.
      #
      # No fio: this flavour measures RDMA and HIP, not storage.
      ernic-rocjitsu:
        suffix: "-ernic-rocjitsu"
        # Under Hub's 100-byte cap; see the rocjitsu note above.
        description: >-
          Ubuntu guest on mainline 7.2.6 with ionic RDMA and a patched
          amdgpu-dkms, for hipObject jobs.
        vars:
          flavour: ernic-rocjitsu
          vm_packages: ernic-rocjitsu.txt
          # The ionic SRQ series, built into the guest after the kernel layer
          # and the provision script. Without it the in-tree ionic_rdma from
          # 7.2.4 reports max_srq = 0, UCX declines rc_verbs and offers only
          # ud_verbs, and NIXL runs about 5.5x slower on a device where RC is
          # available and much faster -- with nothing in the failure naming
          # SRQ. Both halves are built: the kernel modules and the rdma-core
          # provider, because the kernel half alone advertises an SRQ that
          # ibv_create_srq() then refuses with EOPNOTSUPP.
          post_playbook: vm-ernic-srq.yml
          probe_ssh_port: 2225
          release: resolute
          kernel_ref: v7.2.6
          amdgpu_driver_version: "31.60"
          guest_rocm_version: "10.1"
          rdma_core_version: "61.0"

      # The same guest as above, with everything a *runtime* consumer cannot
      # use taken back out: 9.7 GB and a cloud-image boot become something in
      # the 2-3 GB range that comes up in seconds. For a lane that boots a
      # prebuilt binary against the two emulated devices, not one that builds
      # inside the guest.
      #
      # Every pin here is deliberately equal to the ernic-rocjitsu variant's.
      # They are one recipe -- provision_flavour points at that flavour's
      # script and assets, so the amdgpu patches, the firmware gap set and the
      # DKMS build exist in exactly one place and this variant cannot drift
      # from them. Move the pins together or not at all.
      #
      # What the trim removes, and what that costs:
      #
      #   * The toolchain, the kernel headers and the /usr/src/amdgpu-* DKMS
      #     source. The patched module is kept and is still what modprobe
      #     picks, but **nothing can be compiled in this guest** and a kernel
      #     installed inside it would have no driver. A lane that builds
      #     ionic-ernic (which is what rocm-ernic's jobs exist to test) wants
      #     the fat flavour.
      #   * The release's own kernel, which this guest never boots, and
      #     linux-firmware, which is microcode for hardware a virtio guest
      #     does not have. The gfx1250 blobs come from amdgpu-dkms-firmware
      #     and stay.
      #   * ROCm's LLVM and headers. The HIP runtime stays; hipcc goes.
      #   * cloud-init, disabled rather than purged -- so no seed ISO, no
      #     userdata and no key injection at launch. The baked-in ubuntu login
      #     and the keypair published beside the image are the way in.
      #
      # vm_packages stays ernic-rocjitsu.txt: the shared provision script needs
      # that toolchain to build amdgpu, and the trim is what removes it
      # afterwards. build-vm.sh skips its package-presence assertion for any
      # flavour with a trim, and checks/ernic-rocjitsu-slim.sh asserts both
      # what survived and what did not.
      #
      # vm_size stays 512: the ceiling is virtual and costs nothing in the
      # payload, and a consumer's build tree has somewhere to go.
      ernic-rocjitsu-slim:
        suffix: "-ernic-rocjitsu-slim"
        # Start from the fat flavour's finished disk rather than rebuilding it.
        #
        # Everything in this variant's vars down to trim: is identical to
        # ernic-rocjitsu's by construction -- same release, same packages, same
        # kernel pin, same provision script, same post playbook -- so building
        # it from the cloud image re-ran ~1250s of byte-identical work purely
        # in order to subtract from the result. On the longest target in the
        # bake, that was wall-clock on the critical path, not just wasted CPU.
        # Naming the parent here makes the build adopt that disk and run only
        # the trim, the compacting convert and the checks.
        #
        # Not `base`: a base is what the Dockerfile's FROM resolves to, and for
        # every guest flavour alike that is the QEMU toolchain. A derived
        # flavour needs the toolchain *and* a payload, so the payload arrives
        # as the `parentguest` build context instead -- see parent_context on
        # the image above, and noparent/README.md.
        #
        # The provisioning facts in vm-info.json are copied out of the parent's
        # manifest rather than recomputed, so this guest still reports which
        # provision script and playbook actually built it.
        guest_parent_variant: ernic-rocjitsu
        # Under Hub's 100-byte cap; see the rocjitsu note above.
        description: >-
          Runtime-only ernic-rocjitsu guest: same drivers, no toolchain, fast
          to boot.
        vars:
          flavour: ernic-rocjitsu-slim
          provision_flavour: ernic-rocjitsu
          # Kept rather than deleted now that guest_parent_variant means they
          # are never acted on here: they are what the parent is built with, so
          # a reader can check the two recipes still agree, `validate` renders
          # them, and the labels below continue to describe the guest honestly.
          trim: slim.sh
          vm_packages: ernic-rocjitsu.txt
          # Equal to the fat flavour's, and load-bearing here in a way it is
          # not there: this guest has no toolchain, so a consumer cannot build
          # the SRQ stack itself afterwards. The playbook runs before the
          # trim, while the compiler it needs is still installed.
          post_playbook: vm-ernic-srq.yml
          probe_ssh_port: 2226
          release: resolute
          kernel_ref: v7.2.6
          amdgpu_driver_version: "31.60"
          guest_rocm_version: "10.1"
          rdma_core_version: "61.0"

# The README's pinned-upstream shields, generated by `ci-images-tool.py badges`
# so that a pin and the badge advertising it cannot drift apart. CI runs
# `badges --check` on every PR, so a bump that forgets the README fails review
# rather than shipping a lying badge.
#
# Each entry names the target to resolve the var against -- a var declared in
# defaults: resolves against any of them -- and the row it belongs to.
#
#   short: true  abbreviates a SHA to 7 characters, as the image tags do.
#   link:        "{value}" interpolates the resolved pin, so a commit badge
#                can point at that exact commit upstream.
#
# Deleting an entry drops the badge; no code change is involved either way.
badges:
  rows:
    - title: Pinned versions
      entries:
        - label: ubuntu
          target: ubuntu-base
          var: ubuntu_version
          colour: E95420
          link: https://hub.docker.com/_/ubuntu
        - label: rocm
          target: ubuntu-cuda-rocm
          var: rocm_version
          colour: ED1C24
          link: https://rocm.docs.amd.com/
        - label: cuda
          target: ubuntu-cuda-rocm
          var: cuda_version
          dots: true
          colour: 76B900
          link: https://developer.nvidia.com/cuda-toolkit
        - label: qemu
          target: ubuntu-qemu-libvfio-user
          var: qemu_commit
          colour: FF6600
          link: https://gitlab.com/qemu-project/qemu/-/tags/{value}
        - label: nixl
          target: ubuntu-rocm-nixl
          var: nixl_tag
          colour: 76B900
          link: https://github.com/ai-dynamo/nixl/releases/tag/{value}
        - label: abseil
          target: ubuntu-rocm-nixl
          var: absl_tag
          colour: 4285F4
          link: https://github.com/abseil/abseil-cpp/releases/tag/{value}
        - label: grpc
          target: ubuntu-rocm-nixl
          var: grpc_tag
          colour: 244C5A
          link: https://github.com/grpc/grpc/releases/tag/{value}
        - label: libfabric
          target: ubuntu-rocm-nixl
          var: libfabric_tag
          colour: 0F4C81
          link: https://github.com/ofiwg/libfabric/releases/tag/{value}
        - label: guest
          target: ubuntu-qcow2-gen
          var: release
          colour: 772953
          link: https://cloud-images.ubuntu.com/
        # Two flavours install a kernel of their own, so these read the variant
        # rather than the default target. They are pinned separately on
        # purpose -- they are equal today only because all three were moved
        # to v7.2.6 together, and nothing asserts they stay that way.
        - label: guest kernel (ionic)
          target: ubuntu-qcow2-gen@ionic
          var: kernel_ref
          colour: 772953
          link: https://kernel.ubuntu.com/mainline/{value}/
        - label: guest kernel (ernic-rocjitsu)
          target: ubuntu-qcow2-gen@ernic-rocjitsu
          var: kernel_ref
          colour: 772953
          link: https://kernel.ubuntu.com/mainline/{value}/
    - title: Pinned commits
      entries:
        - label: libvfio-user
          target: ubuntu-libvfio-user
          var: libvfio_user_commit
          short: true
          colour: FF6600
          link: https://gitlab.com/qemu-project/libvfio-user/-/commit/{value}
        - label: qemu-minimal
          target: ubuntu-qemu-libvfio-user
          var: qemu_minimal_commit
          short: true
          colour: FF6600
          link: https://github.com/sbates130272/qemu-minimal/commit/{value}
        - label: rocm-ernic
          target: ubuntu-rocm-ernic
          var: rocm_ernic_commit
          short: true
          colour: ED1C24
          link: https://github.com/ROCm/rocm-ernic/commit/{value}
        - label: rocjitsu
          target: ubuntu-rocm-rocjitsu
          var: rocjitsu_commit
          short: true
          colour: ED1C24
          link: https://github.com/ROCm/rocm-systems/commit/{value}
        # Links into the fork, not spdk/spdk: the commit only exists there.
        - label: spdk
          target: ubuntu-spdk-libvfio-user
          var: spdk_commit
          short: true
          colour: 00A3E0
          link: https://github.com/mmgaggle/spdk/commit/{value}
        - label: fio
          target: ubuntu-cuda-rocm-fio
          var: fio_commit
          short: true
          colour: 4B8BBE
          link: https://github.com/axboe/fio/commit/{value}
        - label: ucx
          target: ubuntu-rocm-nixl
          var: ucx_commit
          short: true
          colour: 4B8BBE
          link: https://github.com/openucx/ucx/commit/{value}
        - label: etcd-cpp-apiv3
          target: ubuntu-rocm-nixl
          var: etcd_commit
          short: true
          colour: 419EDA
          link: https://github.com/etcd-cpp-apiv3/etcd-cpp-apiv3/commit/{value}
