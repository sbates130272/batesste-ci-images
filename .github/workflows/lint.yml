name: Lint

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  shellcheck:
    name: Shell Script Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: '.'
          format: gcc
          severity: warning
          ignore: SC2046

  python-lint:
    name: Python Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff check
        run: ruff check .
      - name: Run ruff format check
        run: ruff format --check .

  readme-structure:
    name: README Project Structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check all image directories are documented
        run: bash scripts/check-readme-structure.sh

  dockerfile-lint:
    name: Dockerfile Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run Hadolint on all Dockerfiles
        run: |
          find . -maxdepth 2 -name "Dockerfile" -type f | \
            while read -r dockerfile; do
              echo "Linting $dockerfile"
              docker run --rm -i \
                hadolint/hadolint:latest \
                hadolint --ignore DL3008 --ignore DL3009 \
                --failure-threshold error - < "$dockerfile"
            done
