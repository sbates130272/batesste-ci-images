name: Lint

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  shellcheck:
    name: Shell Script Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: '.'
          format: gcc
          severity: warning
          ignore: SC2046

  python-lint:
    name: Python Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff check
        run: ruff check .
      - name: Run ruff format check
        run: ruff format --check .

  images-config:
    name: Image Config Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install tool dependencies
        run: pip install -r requirements.txt
      # Every target must render: a typo in a template or a variant pinning a
      # var no image declares fails here rather than mid-release.
      - name: Validate images.yml
        run: ./ci-images-tool.py validate

  readme-structure:
    name: README Project Structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check all image directories are documented
        run: bash scripts/check-readme-structure.sh

  qemu-tool-only:
    name: qemu-tool CLI Only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The standalone gen-vm / run-vm scripts are being removed upstream, so
      # a call to one breaks on the next qemu_minimal_commit bump rather than
      # when it is written. Catch it at review time instead.
      - name: Check nothing calls gen-vm / run-vm directly
        run: bash scripts/check-qemu-tool.sh

  dockerfile-lint:
    name: Dockerfile Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run Hadolint on all Dockerfiles
        run: |
          find . -maxdepth 2 -name "Dockerfile" -type f | \
            while read -r dockerfile; do
              echo "Linting $dockerfile"
              docker run --rm -i \
                hadolint/hadolint:latest \
                hadolint --ignore DL3008 --ignore DL3009 \
                --failure-threshold error - < "$dockerfile"
            done
