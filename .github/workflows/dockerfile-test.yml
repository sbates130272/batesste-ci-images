name: Dockerfile Test

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main, master ]
    paths:
      - '**/Dockerfile'
      - '**/entrypoint.sh'
      - '**/packages.txt'
      - 'compose/**'
      - 'common/**'
      - '.github/workflows/dockerfile-test.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - '**/Dockerfile'
      - '**/entrypoint.sh'
      - '**/packages.txt'
      - 'compose/**'
      - 'common/**'
      - '.github/workflows/dockerfile-test.yml'

jobs:
  discover-images:
    name: Discover Images
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.find-images.outputs.images }}
    steps:
      - uses: actions/checkout@v7
      - name: Find all Dockerfiles
        id: find-images
        run: |
          # ubuntu-cuda-rocm-fio layers on ubuntu-cuda-rocm, so it cannot
          # run in the flat parallel matrix -- see the build-derived job.
          IMAGES=$(find . -maxdepth 2 \
            -name "Dockerfile" -type f | \
            sed 's|^\./||' | \
            sed 's|/Dockerfile$||' | sort | \
            jq -R -s -c 'split("\n")[:-1]
              | map(select(. != "ubuntu-cuda-rocm-fio"))')
          echo "images=$IMAGES" >> $GITHUB_OUTPUT
          echo "Found images: $IMAGES"

  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: discover-images
    strategy:
      matrix:
        image: >-
          ${{
            fromJson(
              needs.discover-images.outputs.images
            )
          }}
        variant: ['']
        include:
          - image: ubuntu-qemu-libvfio-user
            variant: '-sbates-fork'
            qemu_repo: >-
              https://github.com/sbates130272/qemu.git
            qemu_commit: >-
              dev/stephen/pci-mmio-bridge-submit
          - image: ubuntu-rocm-ernic
            variant: ''
            rocm_ernic_commit: >-
              e3ef00c2a0c1ba1df95e6cbbe9362c2a1ad1d2fb
          - image: ubuntu-rocm-rocjitsu
            variant: ''
            rocjitsu_repo: >-
              https://github.com/ROCm/rocm-systems.git
            rocjitsu_branch: >-
              develop
            rocjitsu_commit: >-
              5e9cc7c57d372c0198fd8decb1fe5ceb07038a2b
    steps:
      - uses: actions/checkout@v7

      - name: Ensure cloud image cache dir exists
        run: mkdir -p common/cloud-image-cache

      - name: Cache Ubuntu cloud image
        if: >-
          matrix.image ==
          'ubuntu-qemu-libvfio-user'
        uses: actions/cache@v6
        with:
          path: common/cloud-image-cache
          key: cloud-image-noble-amd64
          restore-keys: cloud-image-noble-

      - name: Pre-download cloud image
        if: >-
          matrix.image ==
          'ubuntu-qemu-libvfio-user'
        run: |
          DIR="common/cloud-image-cache"
          IMG="${DIR}/noble-server-cloudimg-amd64.img"
          if [ ! -f "$IMG" ]; then
            wget --progress=dot:giga --timeout=30 --tries=5 \
              --retry-connrefused -O "$IMG" \
              "https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # The VM build stage needs /dev/kvm, reachable only
          # from a RUN --security=insecure step.
          buildkitd-flags: >-
            --allow-insecure-entitlement security.insecure
            --allow-insecure-entitlement network.host

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.image }}/Dockerfile
          allow: security.insecure
          push: false
          load: true
          tags: >-
            batesste-ci-images-${{
              matrix.image
            }}${{
              matrix.variant
            }}:test
          cache-from: >-
            type=gha,scope=${{
              matrix.image
            }}${{
              matrix.variant
            }}
          cache-to: >-
            type=gha,mode=max,scope=${{
              matrix.image
            }}${{
              matrix.variant
            }}
          build-args: |
            QEMU_REPO=${{ matrix.qemu_repo || 'https://gitlab.com/qemu-project/qemu.git' }}
            QEMU_COMMIT=${{ matrix.qemu_commit || 'v11.1.1' }}
            ${{ (matrix.image == 'ubuntu-qemu-libvfio-user' || matrix.image == 'ubuntu-rocm-ernic') && 'LIBVFIO_USER_COMMIT=323f4cb6cddc3713fb7aebe44436f28b28b5413a' || '' }}
            ${{ matrix.image == 'ubuntu-qemu-libvfio-user' && 'QEMU_MINIMAL_REPO=https://github.com/sbates130272/qemu-minimal.git' || '' }}
            ${{ matrix.image == 'ubuntu-qemu-libvfio-user' && 'QEMU_MINIMAL_COMMIT=225a81766b87ad2adb4e93d71bb8ed5e4e996466' || '' }}
            ${{ matrix.image == 'ubuntu-rocm-ernic' && format('ROCM_ERNIC_COMMIT={0}', matrix.rocm_ernic_commit) || '' }}
            ${{ matrix.image == 'ubuntu-rocm-rocjitsu' && format('ROCJITSU_REPO={0}', matrix.rocjitsu_repo) || '' }}
            ${{ matrix.image == 'ubuntu-rocm-rocjitsu' && format('ROCJITSU_BRANCH={0}', matrix.rocjitsu_branch) || '' }}
            ${{ matrix.image == 'ubuntu-rocm-rocjitsu' && format('ROCJITSU_COMMIT={0}', matrix.rocjitsu_commit) || '' }}

      - name: Export Docker image
        run: |
          docker save \
            "batesste-ci-images-${{ matrix.image }}${{ matrix.variant }}:test" \
            | gzip \
            > "/tmp/${{ matrix.image }}${{ matrix.variant }}.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: >-
            docker-image-${{
              matrix.image
            }}${{
              matrix.variant
            }}
          path: >-
            /tmp/${{
              matrix.image
            }}${{
              matrix.variant
            }}.tar.gz
          retention-days: 1

  test-entrypoint:
    name: Test Container Entrypoint
    runs-on: ubuntu-latest
    needs: [discover-images, build]
    strategy:
      matrix:
        image: >-
          ${{
            fromJson(
              needs.discover-images.outputs.images
            )
          }}
        variant: ['']
        include:
          - image: ubuntu-qemu-libvfio-user
            variant: '-sbates-fork'
    steps:
      - uses: actions/checkout@v7

      - name: Check if entrypoint.sh exists
        id: check-entrypoint
        run: |
          if [ -f \
            "${{ matrix.image }}/entrypoint.sh" \
          ]; then
            echo "exists=true" \
              >> $GITHUB_OUTPUT
          else
            echo "exists=false" \
              >> $GITHUB_OUTPUT
          fi

      - name: Download Docker image artifact
        if: >-
          steps.check-entrypoint.outputs.exists
          == 'true'
        uses: actions/download-artifact@v4
        with:
          name: >-
            docker-image-${{
              matrix.image
            }}${{
              matrix.variant
            }}

      - name: Load Docker image
        if: >-
          steps.check-entrypoint.outputs.exists
          == 'true'
        run: |
          gunzip -c \
            "${{ matrix.image }}${{ matrix.variant }}.tar.gz" \
            | docker load

      - name: Test entrypoint script syntax
        if: >-
          steps.check-entrypoint.outputs.exists
          == 'true'
        run: |
          docker run --rm --entrypoint /bin/bash \
            "batesste-ci-images-${{ matrix.image }}${{ matrix.variant }}:test" \
            -c "bash -n /build/entrypoint.sh && \
                echo 'Entrypoint syntax OK'"

      - name: Test entrypoint help
        if: >-
          steps.check-entrypoint.outputs.exists
          == 'true'
        run: |
          timeout 10 docker run --rm \
            --cap-add NET_ADMIN \
            -e USERNAME=testuser \
            -e VM_NAME=test-vm \
            -e SSH_PORT=2222 \
            "batesste-ci-images-${{ matrix.image }}${{ matrix.variant }}:test" \
            || true

      - name: Skip entrypoint test
        if: >-
          steps.check-entrypoint.outputs.exists
          == 'false'
        run: |
          echo "No entrypoint.sh found, skipping"

  test-vm-packages:
    name: Test VM Packages
    runs-on: ubuntu-latest
    needs: [discover-images, build]
    if: >-
      contains(
        fromJson(needs.discover-images.outputs.images),
        'ubuntu-qemu-libvfio-user'
      )
    steps:
      - uses: actions/checkout@v7

      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image-ubuntu-qemu-libvfio-user

      - name: Load Docker image
        run: |
          gunzip -c ubuntu-qemu-libvfio-user.tar.gz \
            | docker load

      - name: Check packages.txt exists
        run: |
          if [ ! -f "ubuntu-qemu-libvfio-user/packages.txt" ]; then
            echo "packages.txt not found, skipping"
            exit 0
          fi

      - name: Start VM and wait for boot
        id: start-vm
        run: |
          docker run -d --name test-vm-packages \
            --cap-add NET_ADMIN \
            batesste-ci-images-ubuntu-qemu-libvfio-user:test
          echo "Waiting for VM to boot..."
          for i in $(seq 1 90); do
            if docker exec test-vm-packages bash -c \
              "chmod 600 /output/id_rsa && \
               timeout 5 ssh \
               -o StrictHostKeyChecking=no \
               -o UserKnownHostsFile=/dev/null \
               -o ConnectTimeout=3 \
               -p 2222 -i /output/id_rsa \
               batesste@localhost \
               'echo OK' 2>&1" \
              | grep -q "OK"; then
              echo "VM booted after ~$((i * 2))s"
              break
            fi
            if [ "$i" -eq 90 ]; then
              echo "ERROR: VM failed to boot in 180s"
              docker logs test-vm-packages
              exit 1
            fi
            sleep 2
          done

      - name: Verify packages are installed in VM
        run: |
          KERNEL_VERSION=$(docker exec \
            test-vm-packages uname -r \
            2>/dev/null || echo "")
          echo "Container kernel: ${KERNEL_VERSION}"
          MISSING_PACKAGES=""
          for PKG in build-essential rdma-core ibverbs-utils libibverbs-dev cmake ninja-build pkg-config; do
            echo "Checking for ${PKG}..."
            if docker exec test-vm-packages bash -c \
              "chmod 600 /output/id_rsa && \
               timeout 10 ssh \
               -o StrictHostKeyChecking=no \
               -o UserKnownHostsFile=/dev/null \
               -o ConnectTimeout=10 \
               -p 2222 -i /output/id_rsa \
               batesste@localhost \
               'dpkg -l | grep -E \"^ii.*${PKG}\"' \
               2>&1" | \
              grep -q "^ii"; then
              echo "OK ${PKG} is installed"
            else
              echo "FAIL ${PKG} is NOT installed"
              MISSING_PACKAGES="${MISSING_PACKAGES} ${PKG}"
            fi
          done
          if [ -n "${KERNEL_VERSION}" ]; then
            KERNEL_MAJOR=$(echo "${KERNEL_VERSION}" \
              | cut -d. -f1-2)
            echo "Checking linux-headers ~${KERNEL_MAJOR}"
            if docker exec test-vm-packages bash -c \
              "chmod 600 /output/id_rsa && \
               timeout 10 ssh \
               -o StrictHostKeyChecking=no \
               -o UserKnownHostsFile=/dev/null \
               -o ConnectTimeout=10 \
               -p 2222 -i /output/id_rsa \
               batesste@localhost \
               'dpkg -l | grep linux-headers' \
               2>&1" | \
              grep -q "linux-headers"; then
              echo "OK linux-headers is installed"
            else
              echo "FAIL linux-headers is NOT installed"
              MISSING_PACKAGES="${MISSING_PACKAGES} linux-headers"
            fi
          fi
          if [ -n "${MISSING_PACKAGES}" ]; then
            echo "ERROR: Missing:${MISSING_PACKAGES}"
            exit 1
          else
            echo "All expected packages are installed!"
          fi

      - name: Cleanup
        if: always()
        run: |
          docker stop test-vm-packages 2>/dev/null \
            || true
          docker rm test-vm-packages 2>/dev/null \
            || true

  test-gpu-toolchains:
    name: Test GPU Toolchains (CUDA + ROCm)
    runs-on: ubuntu-latest
    needs: [discover-images, build]
    if: >-
      contains(
        fromJson(needs.discover-images.outputs.images),
        'ubuntu-cuda-rocm'
      )
    steps:
      - uses: actions/checkout@v7

      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image-ubuntu-cuda-rocm

      - name: Load Docker image
        run: |
          gunzip -c ubuntu-cuda-rocm.tar.gz \
            | docker load

      - name: Verify toolkit binaries and install paths
        run: |
          docker run --rm \
            "batesste-ci-images-ubuntu-cuda-rocm:test" \
            bash -lc '
              set -e
              echo "CUDA version file:"; cat /etc/cuda-version
              echo "ROCm version file:"; cat /etc/rocm-version
              echo "CUDA path file:"; cat /etc/cuda-path
              echo "ROCm path file:"; cat /etc/rocm-path

              echo "CUDA nvcc:"; which nvcc; nvcc --version
              echo "ROCm hipcc:"; which hipcc; hipcc --version

              test -x "$(cat /etc/rocm-path)/bin/hipcc"
              test -f "$(cat /etc/rocm-path)/include/hip/hip_runtime.h"
              test -d "$(cat /etc/cuda-path)/lib64"

              echo "cuda-compat:"; cat /etc/cuda-compat-installed
              test "$(cat /etc/cuda-compat-installed)" = "yes"
              test -e "$(cat /etc/cuda-path)/compat/libcuda.so.1"
              ldconfig -p | grep "libcuda.so.1"
            '

  build-derived:
    name: Build Derived Images
    runs-on: ubuntu-latest
    needs: [discover-images, build]
    steps:
      - uses: actions/checkout@v7

      - name: Download cuda-rocm image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image-ubuntu-cuda-rocm

      - name: Load base image
        run: |
          gunzip -c ubuntu-cuda-rocm.tar.gz | docker load

      # Built on the default docker driver rather than via
      # setup-buildx-action: the docker-container driver keeps its own image
      # store and cannot resolve a BASE_IMAGE that only exists in the local
      # daemon.  That rules out the gha layer cache for this job.
      - name: Build ubuntu-cuda-rocm-fio
        run: |
          docker build \
            -f ubuntu-cuda-rocm-fio/Dockerfile \
            --build-arg BASE_IMAGE=batesste-ci-images-ubuntu-cuda-rocm:test \
            --build-arg FIO_REPO=https://github.com/axboe/fio.git \
            --build-arg FIO_COMMIT=975ea1856fee9f4c0f01f6f19ba3c61ce24f9bc8 \
            -t batesste-ci-images-ubuntu-cuda-rocm-fio:test \
            .

      - name: Export Docker image
        run: |
          docker save \
            "batesste-ci-images-ubuntu-cuda-rocm-fio:test" \
            | gzip > /tmp/ubuntu-cuda-rocm-fio.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: docker-image-ubuntu-cuda-rocm-fio
          path: /tmp/ubuntu-cuda-rocm-fio.tar.gz
          retention-days: 1

  test-fio:
    name: Test fio GPU Engines
    runs-on: ubuntu-latest
    needs: build-derived
    steps:
      - uses: actions/checkout@v7

      - name: Download fio image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image-ubuntu-cuda-rocm-fio

      - name: Load Docker image
        run: |
          gunzip -c ubuntu-cuda-rocm-fio.tar.gz | docker load

      # Runners have no NVIDIA driver. fio starts anyway because the base
      # image ships cuda-compat, so no LD_LIBRARY_PATH juggling is needed.
      - name: Verify both GPU engines are compiled in
        run: |
          docker run --rm \
            "batesste-ci-images-ubuntu-cuda-rocm-fio:test" \
            bash -lc '
              set -e
              fio --version
              cat /usr/local/share/fio-commit.txt
              fio --enghelp | grep -qE "^[[:space:]]*libhipfile$"
              fio --enghelp | grep -qE "^[[:space:]]*libcufile$"
              echo "libhipfile and libcufile both present"
            '

      - name: Verify libcuda resolves to cuda-compat, not a stub
        run: |
          docker run --rm \
            "batesste-ci-images-ubuntu-cuda-rocm-fio:test" \
            bash -lc '
              set -e
              # compat must be last in ld.so.conf.d so a host-injected
              # driver takes precedence over it
              test -f /etc/ld.so.conf.d/zz-cuda-compat.conf
              RESOLVED=$(ldd "$(command -v fio)" \
                | awk "/libcuda\.so\.1/ {print \$3}")
              echo "libcuda.so.1 -> ${RESOLVED}"
              case "${RESOLVED}" in
                */compat/*) echo "resolves to cuda-compat, as expected" ;;
                *) echo "ERROR: unexpected libcuda source"; exit 1 ;;
              esac
              # the hand-rolled stub directory must never come back
              test ! -e /opt/fio/cuda-stubs
            '

      - name: Verify pinned fio commit
        run: |
          ACTUAL=$(docker run --rm \
            "batesste-ci-images-ubuntu-cuda-rocm-fio:test" \
            cat /usr/local/share/fio-commit.txt)
          EXPECTED=975ea1856fee9f4c0f01f6f19ba3c61ce24f9bc8
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "ERROR: fio commit $ACTUAL != $EXPECTED"
            exit 1
          fi

      - name: Run fio smoke job
        run: |
          docker run --rm \
            "batesste-ci-images-ubuntu-cuda-rocm-fio:test" \
            fio --name=smoke --ioengine=psync --rw=write \
                --bs=64k --size=4m --directory=/tmp --minimal

  test-rocm-ernic:
    name: Test rocm-ernic Binary
    runs-on: ubuntu-latest
    needs: [discover-images, build]
    if: >-
      contains(
        fromJson(needs.discover-images.outputs.images),
        'ubuntu-rocm-ernic'
      )
    steps:
      - uses: actions/checkout@v7

      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image-ubuntu-rocm-ernic

      - name: Load Docker image
        run: |
          gunzip -c ubuntu-rocm-ernic.tar.gz \
            | docker load

      - name: Verify rocm-ernic binary exists
        run: |
          docker run --rm \
            "batesste-ci-images-ubuntu-rocm-ernic:test" \
            which rocm-ernic

      - name: Verify rocm-ernic commit metadata
        run: |
          docker run --rm \
            "batesste-ci-images-ubuntu-rocm-ernic:test" \
            cat /usr/local/share/rocm-ernic-commit.txt

      - name: Run rocm-ernic loopback smoke test
        run: |
          docker run --rm --name rocm-ernic-test \
            --cap-add NET_ADMIN \
            "batesste-ci-images-ubuntu-rocm-ernic:test" \
            bash -c "
              mkdir -p /tmp/vfio-sockets
              rocm-ernic \
                --socket /tmp/vfio-sockets/rocm-ernic.sock \
                --backend loopback \
                --verbose &
              SERVER_PID=\$!
              sleep 3
              if ! kill -0 \${SERVER_PID} 2>/dev/null; then
                echo 'ERROR: rocm-ernic exited prematurely'
                exit 1
              fi
              echo \"rocm-ernic is running (PID \${SERVER_PID})\"
              kill \${SERVER_PID}
            "

  test-rocm-rocjitsu:
    name: Test rocm-rocjitsu Binary
    runs-on: ubuntu-latest
    needs: [discover-images, build]
    if: >-
      contains(
        fromJson(needs.discover-images.outputs.images),
        'ubuntu-rocm-rocjitsu'
      )
    steps:
      - uses: actions/checkout@v7

      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image-ubuntu-rocm-rocjitsu

      - name: Load Docker image
        run: |
          gunzip -c ubuntu-rocm-rocjitsu.tar.gz \
            | docker load

      - name: Verify rocjitsu binary exists
        run: |
          docker run --rm \
            "batesste-ci-images-ubuntu-rocm-rocjitsu:test" \
            which rocjitsu

      - name: Verify rocjitsu commit metadata
        run: |
          docker run --rm \
            "batesste-ci-images-ubuntu-rocm-rocjitsu:test" \
            cat /usr/local/share/rocjitsu-commit.txt

      - name: Run rocjitsu vfio-socket smoke test
        run: |
          docker run --rm --name rocjitsu-test \
            --cap-add NET_ADMIN \
            "batesste-ci-images-ubuntu-rocm-rocjitsu:test" \
            bash -c "
              mkdir -p /tmp/vfio-sockets
              rocjitsu \
                --config \${ROCJITSU_CONFIG_DIR}/gfx1250_mi455x.json \
                --vfio-socket /tmp/vfio-sockets/rocjitsu.sock &
              SERVER_PID=\$!
              sleep 3
              if ! kill -0 \${SERVER_PID} 2>/dev/null; then
                echo 'ERROR: rocjitsu exited prematurely'
                exit 1
              fi
              test -S /tmp/vfio-sockets/rocjitsu.sock
              echo \"rocjitsu is running (PID \${SERVER_PID})\"
              kill \${SERVER_PID}
            "

  test-compose:
    name: Test Docker Compose Stack
    runs-on: ubuntu-latest
    needs: [discover-images, build]
    if: >-
      contains(
        fromJson(needs.discover-images.outputs.images),
        'ubuntu-qemu-libvfio-user'
      ) &&
      contains(
        fromJson(needs.discover-images.outputs.images),
        'ubuntu-rocm-ernic'
      ) &&
      contains(
        fromJson(needs.discover-images.outputs.images),
        'ubuntu-rocm-rocjitsu'
      )
    steps:
      - uses: actions/checkout@v7

      - name: Download qemu image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image-ubuntu-qemu-libvfio-user

      - name: Download rocm-ernic image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image-ubuntu-rocm-ernic

      - name: Download rocm-rocjitsu image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image-ubuntu-rocm-rocjitsu

      - name: Load Docker images
        run: |
          gunzip -c ubuntu-qemu-libvfio-user.tar.gz \
            | docker load
          gunzip -c ubuntu-rocm-ernic.tar.gz \
            | docker load
          gunzip -c ubuntu-rocm-rocjitsu.tar.gz \
            | docker load
          docker tag \
            batesste-ci-images-ubuntu-qemu-libvfio-user:test \
            batesste-ci-images-ubuntu-qemu-libvfio-user:latest
          docker tag \
            batesste-ci-images-ubuntu-rocm-ernic:test \
            batesste-ci-images-ubuntu-rocm-ernic:latest
          docker tag \
            batesste-ci-images-ubuntu-rocm-rocjitsu:test \
            batesste-ci-images-ubuntu-rocm-rocjitsu:latest

      - name: Start compose stack
        run: |
          docker compose \
            -f compose/docker-compose.yml \
            up -d

      - name: Wait for rocm-ernic to start
        run: |
          for i in $(seq 1 30); do
            if docker compose \
              -f compose/docker-compose.yml \
              ps rocm-ernic \
              | grep -q "Up\|running"; then
              echo "rocm-ernic running after ~${i}s"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "ERROR: rocm-ernic not running"
              docker compose \
                -f compose/docker-compose.yml \
                logs rocm-ernic
              exit 1
            fi
            sleep 1
          done

      - name: Verify rocm-ernic socket is present
        run: |
          docker compose \
            -f compose/docker-compose.yml \
            exec rocm-ernic \
            test -S \
            /tmp/vfio-sockets/rocm-ernic.sock

      - name: Wait for rocm-rocjitsu to start
        run: |
          for i in $(seq 1 30); do
            if docker compose \
              -f compose/docker-compose.yml \
              ps rocm-rocjitsu \
              | grep -q "Up\|running"; then
              echo "rocm-rocjitsu running after ~${i}s"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "ERROR: rocm-rocjitsu not running"
              docker compose \
                -f compose/docker-compose.yml \
                logs rocm-rocjitsu
              exit 1
            fi
            sleep 1
          done

      - name: Verify rocjitsu socket is present
        run: |
          docker compose \
            -f compose/docker-compose.yml \
            exec rocm-rocjitsu \
            test -S \
            /tmp/vfio-sockets/rocjitsu.sock

      - name: Show compose logs
        if: always()
        run: |
          docker compose \
            -f compose/docker-compose.yml \
            logs

      - name: Teardown
        if: always()
        run: |
          docker compose \
            -f compose/docker-compose.yml \
            down -v
