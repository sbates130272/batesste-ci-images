name: Dockerfile Test

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main, master ]
    paths:
      - '**/Dockerfile'
      - '**/entrypoint.sh'
      - '**/packages.txt'
      - '.github/workflows/dockerfile-test.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - '**/Dockerfile'
      - '**/entrypoint.sh'
      - '**/packages.txt'
      - '.github/workflows/dockerfile-test.yml'

jobs:
  discover-images:
    name: Discover Images
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.find-images.outputs.images }}
    steps:
      - uses: actions/checkout@v4
      - name: Find all Dockerfiles
        id: find-images
        run: |
          IMAGES=$(find . -maxdepth 2 \
            -name "Dockerfile" -type f | \
            sed 's|^\./||' | \
            sed 's|/Dockerfile$||' | sort | \
            jq -R -s -c 'split("\n")[:-1]')
          echo "images=$IMAGES" >> $GITHUB_OUTPUT
          echo "Found images: $IMAGES"

  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: discover-images
    strategy:
      matrix:
        image: ${{ fromJson(needs.discover-images.outputs.images) }}
    steps:
      - uses: actions/checkout@v4

      - name: Ensure cloud image cache dir exists
        run: |
          mkdir -p "${{ matrix.image }}/cloud-image-cache"

      - name: Cache Ubuntu cloud image
        if: matrix.image == 'ubuntu-qemu-libvfio-user'
        uses: actions/cache@v4
        with:
          path: ${{ matrix.image }}/cloud-image-cache
          key: cloud-image-noble-amd64
          restore-keys: cloud-image-noble-

      - name: Pre-download cloud image
        if: matrix.image == 'ubuntu-qemu-libvfio-user'
        run: |
          DIR="${{ matrix.image }}/cloud-image-cache"
          IMG="${DIR}/noble-server-cloudimg-amd64.img"
          if [ ! -f "$IMG" ]; then
            wget -q -O "$IMG" \
              "https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.image }}
          file: ${{ matrix.image }}/Dockerfile
          push: false
          load: true
          tags: batesste-ci-images-${{ matrix.image }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            QEMU_COMMIT=v10.2.2
            ${{ matrix.image == 'ubuntu-qemu-libvfio-user' && 'LIBVFIO_USER_COMMIT=082925c65d98021af5c0f36f60a98e0bb6ddb329' || '' }}
            ${{ matrix.image == 'ubuntu-qemu-libvfio-user' && 'QEMU_MINIMAL_REPO=https://github.com/sbates130272/qemu-minimal.git' || '' }}
            ${{ matrix.image == 'ubuntu-qemu-libvfio-user' && 'QEMU_MINIMAL_COMMIT=30c6d09265db2817f82e495aa5609e03fd0194a9' || '' }}

      - name: Export Docker image
        run: |
          docker save \
            "batesste-ci-images-${{ matrix.image }}:test" \
            | gzip > "/tmp/${{ matrix.image }}.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ matrix.image }}
          path: /tmp/${{ matrix.image }}.tar.gz
          retention-days: 1

  test-entrypoint:
    name: Test Container Entrypoint
    runs-on: ubuntu-latest
    needs: [discover-images, build]
    strategy:
      matrix:
        image: ${{ fromJson(needs.discover-images.outputs.images) }}
    steps:
      - uses: actions/checkout@v4

      - name: Check if entrypoint.sh exists
        id: check-entrypoint
        run: |
          if [ -f "${{ matrix.image }}/entrypoint.sh" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Download Docker image artifact
        if: steps.check-entrypoint.outputs.exists == 'true'
        uses: actions/download-artifact@v4
        with:
          name: docker-image-${{ matrix.image }}

      - name: Load Docker image
        if: steps.check-entrypoint.outputs.exists == 'true'
        run: |
          gunzip -c "${{ matrix.image }}.tar.gz" \
            | docker load

      - name: Test entrypoint script syntax
        if: steps.check-entrypoint.outputs.exists == 'true'
        run: |
          docker run --rm --entrypoint /bin/bash \
            "batesste-ci-images-${{ matrix.image }}:test" \
            -c "bash -n /build/entrypoint.sh && \
                echo 'Entrypoint syntax OK'"

      - name: Test entrypoint help (should show usage)
        if: steps.check-entrypoint.outputs.exists == 'true'
        run: |
          timeout 10 docker run --rm \
            --cap-add NET_ADMIN \
            -e USERNAME=testuser \
            -e VM_NAME=test-vm \
            -e SSH_PORT=2222 \
            "batesste-ci-images-${{ matrix.image }}:test" \
            || true

      - name: Skip entrypoint test
        if: steps.check-entrypoint.outputs.exists == 'false'
        run: |
          echo "No entrypoint.sh found, skipping"

  test-vm-packages:
    name: Test VM Packages
    runs-on: ubuntu-latest
    needs: [discover-images, build]
    if: >-
      contains(
        fromJson(needs.discover-images.outputs.images),
        'ubuntu-qemu-libvfio-user'
      )
    steps:
      - uses: actions/checkout@v4

      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image-ubuntu-qemu-libvfio-user

      - name: Load Docker image
        run: |
          gunzip -c ubuntu-qemu-libvfio-user.tar.gz \
            | docker load

      - name: Check packages.txt exists
        run: |
          if [ ! -f "ubuntu-qemu-libvfio-user/packages.txt" ]; then
            echo "packages.txt not found, skipping"
            exit 0
          fi

      - name: Start VM and wait for boot
        id: start-vm
        run: |
          docker run -d --name test-vm-packages \
            --cap-add NET_ADMIN \
            batesste-ci-images-ubuntu-qemu-libvfio-user:test
          echo "Waiting for VM to boot..."
          for i in $(seq 1 90); do
            if docker exec test-vm-packages bash -c \
              "chmod 600 /output/id_rsa && \
               timeout 5 ssh \
               -o StrictHostKeyChecking=no \
               -o UserKnownHostsFile=/dev/null \
               -o ConnectTimeout=3 \
               -p 2222 -i /output/id_rsa \
               batesste@localhost \
               'echo OK' 2>&1" \
              | grep -q "OK"; then
              echo "VM booted after ~$((i * 2))s"
              break
            fi
            if [ "$i" -eq 90 ]; then
              echo "ERROR: VM failed to boot in 180s"
              docker logs test-vm-packages
              exit 1
            fi
            sleep 2
          done

      - name: Verify packages are installed in VM
        run: |
          KERNEL_VERSION=$(docker exec \
            test-vm-packages uname -r \
            2>/dev/null || echo "")
          echo "Container kernel: ${KERNEL_VERSION}"
          MISSING_PACKAGES=""
          for PKG in build-essential rdma-core; do
            echo "Checking for ${PKG}..."
            if docker exec test-vm-packages bash -c \
              "chmod 600 /output/id_rsa && \
               timeout 10 ssh \
               -o StrictHostKeyChecking=no \
               -o UserKnownHostsFile=/dev/null \
               -o ConnectTimeout=10 \
               -p 2222 -i /output/id_rsa \
               batesste@localhost \
               'dpkg -l | grep -E \"^ii.*${PKG}\"' \
               2>&1" | \
              grep -q "^ii"; then
              echo "OK ${PKG} is installed"
            else
              echo "FAIL ${PKG} is NOT installed"
              MISSING_PACKAGES="${MISSING_PACKAGES} ${PKG}"
            fi
          done
          if [ -n "${KERNEL_VERSION}" ]; then
            KERNEL_MAJOR=$(echo "${KERNEL_VERSION}" \
              | cut -d. -f1-2)
            echo "Checking linux-headers ~${KERNEL_MAJOR}"
            if docker exec test-vm-packages bash -c \
              "chmod 600 /output/id_rsa && \
               timeout 10 ssh \
               -o StrictHostKeyChecking=no \
               -o UserKnownHostsFile=/dev/null \
               -o ConnectTimeout=10 \
               -p 2222 -i /output/id_rsa \
               batesste@localhost \
               'dpkg -l | grep linux-headers' \
               2>&1" | \
              grep -q "linux-headers"; then
              echo "OK linux-headers is installed"
            else
              echo "FAIL linux-headers is NOT installed"
              MISSING_PACKAGES="${MISSING_PACKAGES} linux-headers"
            fi
          fi
          if [ -n "${MISSING_PACKAGES}" ]; then
            echo "ERROR: Missing:${MISSING_PACKAGES}"
            exit 1
          else
            echo "All expected packages are installed!"
          fi

      - name: Cleanup
        if: always()
        run: |
          docker stop test-vm-packages 2>/dev/null \
            || true
          docker rm test-vm-packages 2>/dev/null \
            || true
