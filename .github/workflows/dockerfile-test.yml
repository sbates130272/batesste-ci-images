name: Dockerfile Test

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main, master ]
    paths:
      - '**/Dockerfile'
      - '**/entrypoint.sh'
      - '**/packages/**'
      - '**/checks/**'
      - '**/patches/**'
      - 'ci-images-tool.py'
      - 'images.yml'
      - 'requirements.txt'
      - 'compose/**'
      - 'common/**'
      - '.github/workflows/dockerfile-test.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - '**/Dockerfile'
      - '**/entrypoint.sh'
      - '**/packages/**'
      - '**/checks/**'
      - '**/patches/**'
      - 'ci-images-tool.py'
      - 'images.yml'
      - 'requirements.txt'
      - 'compose/**'
      - 'common/**'
      - '.github/workflows/dockerfile-test.yml'

# Layer cache and the intermediate base images both live in GHCR. The GitHub
# Actions cache is capped at 10 GB per repository with LRU eviction, and
# mode=max on ubuntu-cuda-rocm alone exceeds a large fraction of that, so the
# per-image scopes used to evict each other and every "warm" build was cold.
# A registry cache has no such cap.
env:
  CACHE_REGISTRY: ghcr.io/${{ github.repository }}/buildcache
  BASE_REGISTRY: ghcr.io/${{ github.repository }}/ci-base

jobs:
  discover-images:
    name: Discover Images
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.find-images.outputs.targets }}
      keys: ${{ steps.find-images.outputs.keys }}
      derived: ${{ steps.find-images.outputs.derived }}
      derived_bases: ${{ steps.find-images.outputs.derived_bases }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install tool dependencies
        run: pip install -r requirements.txt

      # images.yml says which job builds what, so this no longer globs for
      # Dockerfiles and carries its own exclusion list. One image can declare
      # several variants, each a separate target built from the same Dockerfile.
      - name: Enumerate matrix targets
        id: find-images
        run: |
          ./ci-images-tool.py validate
          TARGETS=$(./ci-images-tool.py targets --job matrix --json)
          echo "targets=$TARGETS" >> $GITHUB_OUTPUT
          echo "keys=$(echo "$TARGETS" | jq -c 'map(.key)')" >> $GITHUB_OUTPUT
          echo "$TARGETS" | jq .
          DERIVED=$(./ci-images-tool.py targets --job derived --json)
          echo "derived=$DERIVED" >> $GITHUB_OUTPUT
          echo "$DERIVED" | jq .
          # Which matrix images build-derived needs to resolve from GHCR. Derived
          # from the catalogue rather than named here, so adding a derived entry
          # whose base is not cuda-rocm does not silently fail to find its base.
          echo "derived_bases=$(echo "$DERIVED" \
            | jq -c '[.[].base_scope] | unique')" >> $GITHUB_OUTPUT

  # ubuntu-base holds the apt preamble and root CA every image shares;
  # ubuntu-libvfio-user adds the libvfio-user build that qemu and rocm-ernic
  # used to do twice. Pushing them to a scratch GHCR repo is what lets the
  # matrix keep the docker-container driver (and therefore the layer cache)
  # while still resolving a base built in this same run.
  build-bases:
    name: Build Base Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      base: ${{ steps.refs.outputs.base }}
      vfu: ${{ steps.refs.outputs.vfu }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Compute base refs
        id: refs
        run: |
          echo "base=${BASE_REGISTRY}:ubuntu-base-${GITHUB_SHA}" \
            >> "$GITHUB_OUTPUT"
          echo "vfu=${BASE_REGISTRY}:ubuntu-libvfio-user-${GITHUB_SHA}" \
            >> "$GITHUB_OUTPUT"

      - name: Build and push ubuntu-base
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ubuntu-base/Dockerfile
          push: true
          tags: ${{ steps.refs.outputs.base }}
          cache-from: type=registry,ref=${{ env.CACHE_REGISTRY }}:ubuntu-base
          cache-to: >-
            type=registry,mode=max,image-manifest=true,oci-mediatypes=true,ref=${{
              env.CACHE_REGISTRY
            }}:ubuntu-base

      - name: Build and push ubuntu-libvfio-user
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ubuntu-libvfio-user/Dockerfile
          push: true
          tags: ${{ steps.refs.outputs.vfu }}
          build-args: |
            BASE_IMAGE=${{ steps.refs.outputs.base }}
          cache-from: >-
            type=registry,ref=${{ env.CACHE_REGISTRY }}:ubuntu-libvfio-user
          cache-to: >-
            type=registry,mode=max,image-manifest=true,oci-mediatypes=true,ref=${{
              env.CACHE_REGISTRY
            }}:ubuntu-libvfio-user

      - name: Verify libvfio-user commit
        run: |
          docker run --rm "${{ steps.refs.outputs.vfu }}" \
            cat /usr/local/share/libvfio-user-commit.txt

  build:
    name: Build ${{ matrix.target.key }}
    runs-on: ubuntu-latest
    needs: [discover-images, build-bases]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # Each entry is a whole target object from ci-images-tool.py: image
        # directory, variant, and the flat `scope` name used for the cache ref,
        # the artifact and the local :test tag. Variants (e.g. the QEMU fork)
        # are declared in images.yml, not spliced in here.
        target: >-
          ${{
            fromJson(
              needs.discover-images.outputs.targets
            )
          }}
    env:
      # ci-images-tool.py owns the pins; these point its BASE_IMAGE
      # resolution at the images build-bases just published.
      BASE_IMAGE_FOR_UBUNTU_BASE: ${{ needs.build-bases.outputs.base }}
      BASE_IMAGE_FOR_UBUNTU_LIBVFIO_USER: ${{ needs.build-bases.outputs.vfu }}
    steps:
      - uses: actions/checkout@v7

      # ubuntu-cuda-rocm downloads ~10 GB of .deb files, which ubuntu-base's
      # apt cache mounts now keep for the whole build instead of letting
      # docker-clean discard them. On top of a 28 GB image that overruns the
      # runner. CI gets nothing from those mounts anyway -- BuildKit never
      # exports them -- so buy the headroom back off the preinstalled
      # toolchains we never use rather than give up the local-rebuild win.
      - name: Free up disk space
        if: matrix.target.image == 'ubuntu-cuda-rocm'
        run: |
          df -h /
          sudo rm -rf \
            /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/local/share/powershell \
            /usr/share/swift
          df -h /

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install tool dependencies
        run: pip install -r requirements.txt

      - name: Ensure cloud image cache dir exists
        run: mkdir -p common/cloud-image-cache

      # The guest release is pinned in images.yml, not here, so bumping it
      # there moves the cache key and the download URL with it.
      - name: Resolve guest Ubuntu release
        id: guest
        if: matrix.target.entitlement != ''
        run: |
          RELEASE=$(./ci-images-tool.py build-args "${{ matrix.target.key }}" \
            | sed -n 's/^RELEASE=//p')
          [ -n "$RELEASE" ] || { echo "::error::no RELEASE build arg"; exit 1; }
          echo "release=${RELEASE}" >> "$GITHUB_OUTPUT"

      - name: Cache Ubuntu cloud image
        if: matrix.target.entitlement != ''
        uses: actions/cache@v6
        with:
          path: common/cloud-image-cache
          key: cloud-image-${{ steps.guest.outputs.release }}-amd64
          restore-keys: cloud-image-${{ steps.guest.outputs.release }}-

      - name: Pre-download cloud image
        if: matrix.target.entitlement != ''
        run: |
          DIR="common/cloud-image-cache"
          REL="${{ steps.guest.outputs.release }}"
          IMG="${DIR}/${REL}-server-cloudimg-amd64.img"
          if [ ! -f "$IMG" ]; then
            wget --progress=dot:giga --timeout=30 --tries=5 \
              --retry-connrefused -O "$IMG" \
              "https://cloud-images.ubuntu.com/${REL}/current/${REL}-server-cloudimg-amd64.img"
          fi

      # x86 GitHub-hosted runners do expose /dev/kvm, but as root:kvm 0660,
      # and BuildKit's RUN step is not in the kvm group, so widen it. There is
      # no TCG fallback: a runner without /dev/kvm (ARM Linux, macOS, Windows,
      # ubuntu-slim) cannot build guest images and fails here rather than
      # spending an hour emulating one.
      - name: Enable KVM for guest image builds
        if: matrix.target.entitlement != ''
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "::error::no /dev/kvm on this runner; guest images need KVM"
            exit 1
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          # Guest builds reach /dev/kvm only from a RUN --security=insecure
          # step. No matrix-tier target needs this today -- the guests are all
          # `job: derived` -- but the gating below is on the entitlement, not on
          # an image name, so a matrix guest would work without a workflow edit.
          buildkitd-flags: >-
            --allow-insecure-entitlement security.insecure
            --allow-insecure-entitlement network.host

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Pins live only in ci-images-tool.py; the workflow asks for them
      # rather than repeating them, so the two cannot drift.
      - name: Compute build args
        id: buildargs
        run: |
          {
            echo 'args<<ARGS_EOF'
            ./ci-images-tool.py build-args "${{ matrix.target.key }}"
            echo ARGS_EOF
          } >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.target.image }}/Dockerfile
          allow: security.insecure
          push: false
          load: true
          tags: >-
            batesste-ci-images-${{ matrix.target.scope }}:test
          cache-from: >-
            type=registry,ref=${{ env.CACHE_REGISTRY }}:${{ matrix.target.scope }}
          cache-to: >-
            type=registry,mode=max,image-manifest=true,oci-mediatypes=true,ref=${{
              env.CACHE_REGISTRY
            }}:${{ matrix.target.scope }}
          build-args: ${{ steps.buildargs.outputs.args }}

      # ── per-image checks, run here rather than in a downstream job:
      # the image is already in the daemon, so a save/upload/download
      # round-trip of a multi-GB image is pure overhead.

      - name: Test entrypoint script syntax
        if: hashFiles(format('{0}/entrypoint.sh', matrix.target.image)) != ''
        run: |
          docker run --rm --entrypoint /bin/bash \
            "batesste-ci-images-${{ matrix.target.scope }}:test" \
            -c "bash -n /build/entrypoint.sh && \
                echo 'Entrypoint syntax OK'"

      - name: Test entrypoint help
        if: hashFiles(format('{0}/entrypoint.sh', matrix.target.image)) != ''
        run: |
          timeout 10 docker run --rm \
            --cap-add NET_ADMIN \
            -e USERNAME=testuser \
            -e VM_NAME=test-vm \
            -e SSH_PORT=2222 \
            "batesste-ci-images-${{ matrix.target.scope }}:test" \
            || true

      - name: Verify toolkit binaries and install paths
        if: matrix.target.image == 'ubuntu-cuda-rocm'
        run: |
          docker run --rm \
            "batesste-ci-images-${{ matrix.target.scope }}:test" \
            bash -lc '
              set -e
              echo "CUDA version file:"; cat /etc/cuda-version
              echo "ROCm version file:"; cat /etc/rocm-version
              echo "CUDA path file:"; cat /etc/cuda-path
              echo "ROCm path file:"; cat /etc/rocm-path

              echo "CUDA nvcc:"; which nvcc; nvcc --version
              echo "ROCm hipcc:"; which hipcc; hipcc --version

              test -x "$(cat /etc/rocm-path)/bin/hipcc"
              test -f "$(cat /etc/rocm-path)/include/hip/hip_runtime.h"
              test -d "$(cat /etc/cuda-path)/lib64"

              echo "cuda-compat:"; cat /etc/cuda-compat-installed
              test "$(cat /etc/cuda-compat-installed)" = "yes"
              test -e "$(cat /etc/cuda-path)/compat/libcuda.so.1"
              ldconfig -p | grep "libcuda.so.1"
            '

      - name: Verify rocm-ernic binary and commit metadata
        if: matrix.target.image == 'ubuntu-rocm-ernic'
        run: |
          docker run --rm \
            "batesste-ci-images-${{ matrix.target.scope }}:test" \
            bash -lc '
              set -e
              which rocm-ernic
              cat /usr/local/share/rocm-ernic-commit.txt
              cat /usr/local/share/libvfio-user-commit.txt
            '

      - name: Run rocm-ernic loopback smoke test
        if: matrix.target.image == 'ubuntu-rocm-ernic'
        run: |
          docker run --rm --name rocm-ernic-test \
            --cap-add NET_ADMIN \
            "batesste-ci-images-${{ matrix.target.scope }}:test" \
            bash -c "
              mkdir -p /tmp/vfio-sockets
              rocm-ernic \
                --socket /tmp/vfio-sockets/rocm-ernic.sock \
                --backend loopback \
                --verbose &
              SERVER_PID=\$!
              sleep 3
              if ! kill -0 \${SERVER_PID} 2>/dev/null; then
                echo 'ERROR: rocm-ernic exited prematurely'
                exit 1
              fi
              echo \"rocm-ernic is running (PID \${SERVER_PID})\"
              kill \${SERVER_PID}
            "

      - name: Verify rocjitsu binary and commit metadata
        if: matrix.target.image == 'ubuntu-rocm-rocjitsu'
        run: |
          docker run --rm \
            "batesste-ci-images-${{ matrix.target.scope }}:test" \
            bash -lc '
              set -e
              which rocjitsu
              cat /usr/local/share/rocjitsu-commit.txt
            '

      - name: Run rocjitsu vfio-socket smoke test
        if: matrix.target.image == 'ubuntu-rocm-rocjitsu'
        run: |
          docker run --rm --name rocjitsu-test \
            --cap-add NET_ADMIN \
            "batesste-ci-images-${{ matrix.target.scope }}:test" \
            bash -c "
              mkdir -p /tmp/vfio-sockets
              rocjitsu \
                --config \${ROCJITSU_CONFIG_PATH} \
                --vfio-socket /tmp/vfio-sockets/rocjitsu.sock &
              SERVER_PID=\$!
              sleep 3
              if ! kill -0 \${SERVER_PID} 2>/dev/null; then
                echo 'ERROR: rocjitsu exited prematurely'
                exit 1
              fi
              test -S /tmp/vfio-sockets/rocjitsu.sock
              echo \"rocjitsu is running (PID \${SERVER_PID})\"
              kill \${SERVER_PID}
            "

      # What build-derived wants from its base is a registry ref, not a local
      # image -- it used to load an artifact purely to push it straight back
      # out again. Pushing here skips a multi-GB tarball in each direction, and
      # skips writing it to a disk the image and its retained debs have already
      # largely filled.
      # Gated on the scope, not the image or a hardcoded key: REF names one
      # base, so an image with variants must not have two jobs racing to push
      # different content to the same ref.
      - name: Push base to GHCR for build-derived
        if: >-
          contains(
            fromJson(needs.discover-images.outputs.derived_bases),
            matrix.target.scope
          )
        run: |
          REF="${BASE_REGISTRY}:${{ matrix.target.scope }}-${GITHUB_SHA}"
          docker tag "batesste-ci-images-${{ matrix.target.scope }}:test" "$REF"
          docker push "$REF"

      # Only the jobs that genuinely need an image built by a *different*
      # job still pay the artifact round-trip. zstd rather than gzip: these
      # images are multi-GB and gzip is the slowest part of the hop.
      - name: Export Docker image
        if: matrix.target.artifact
        run: |
          docker save \
            "batesste-ci-images-${{ matrix.target.scope }}:test" \
            | zstd -T0 -3 \
            > "/tmp/${{ matrix.target.scope }}.tar.zst"

      - uses: actions/upload-artifact@v7
        if: matrix.target.artifact
        with:
          name: >-
            docker-image-${{ matrix.target.scope }}
          path: >-
            /tmp/${{ matrix.target.scope }}.tar.zst
          compression-level: 0
          retention-days: 1

  build-derived:
    name: Build ${{ matrix.target.key }}
    runs-on: ubuntu-latest
    needs: [discover-images, build-bases, build]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: >-
          ${{
            fromJson(
              needs.discover-images.outputs.derived
            )
          }}
    steps:
      - uses: actions/checkout@v7

      # This job loads the 28 GB cuda-rocm image into the daemon and then
      # builds on top of it, so it is tighter for space than the job that
      # produced the base. See the matching step in the build job above.
      - name: Free up disk space
        run: |
          df -h /
          sudo rm -rf \
            /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/local/share/powershell \
            /usr/share/swift
          df -h /

      # Same flags as the matrix job: a derived target that builds a guest
      # qcow2 needs security.insecure to reach /dev/kvm. Granting the
      # entitlement to the builder is not the same as using it -- the build
      # step still has to ask for it via `allow:`.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          buildkitd-flags: >-
            --allow-insecure-entitlement security.insecure
            --allow-insecure-entitlement network.host

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # The base used to be loaded from an artifact into the local daemon,
      # which forced this build onto the plain docker driver and cost it the
      # layer cache entirely. The build job now pushes it to GHCR directly,
      # so there is nothing to fetch: buildx pulls what it needs from the ref.
      - name: Resolve base ref
        id: base
        run: |
          echo "ref=${BASE_REGISTRY}:${{ matrix.target.base_scope }}-${GITHUB_SHA}" \
            >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install tool dependencies
        run: pip install -r requirements.txt

      # ── guest-image support, gated on the entitlement rather than on an
      # image name, so a new `job: derived` guest flavour picks all of this up
      # from its images.yml entry alone. Mirrors the matrix job's steps.

      - name: Ensure cloud image cache dir exists
        run: mkdir -p common/cloud-image-cache

      - name: Resolve guest Ubuntu release
        id: guest
        if: matrix.target.entitlement != ''
        run: |
          RELEASE=$(./ci-images-tool.py build-args "${{ matrix.target.key }}" \
            | sed -n 's/^RELEASE=//p')
          [ -n "$RELEASE" ] || { echo "::error::no RELEASE build arg"; exit 1; }
          echo "release=${RELEASE}" >> "$GITHUB_OUTPUT"

      - name: Cache Ubuntu cloud image
        if: matrix.target.entitlement != ''
        uses: actions/cache@v6
        with:
          path: common/cloud-image-cache
          key: cloud-image-${{ steps.guest.outputs.release }}-amd64
          restore-keys: cloud-image-${{ steps.guest.outputs.release }}-

      - name: Pre-download cloud image
        if: matrix.target.entitlement != ''
        run: |
          DIR="common/cloud-image-cache"
          REL="${{ steps.guest.outputs.release }}"
          IMG="${DIR}/${REL}-server-cloudimg-amd64.img"
          if [ ! -f "$IMG" ]; then
            wget --progress=dot:giga --timeout=30 --tries=5 \
              --retry-connrefused -O "$IMG" \
              "https://cloud-images.ubuntu.com/${REL}/current/${REL}-server-cloudimg-amd64.img"
          fi

      - name: Enable KVM for guest image builds
        if: matrix.target.entitlement != ''
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "::error::no /dev/kvm on this runner; guest images need KVM"
            exit 1
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      # BASE_IMAGE_<SCOPE> is the dependant-keyed override, so the env var
      # name has to be built from the target rather than written out. That
      # keeps this job generic: a new `job: derived` entry in images.yml is
      # picked up by the matrix without touching the workflow.
      - name: Compute build args
        id: buildargs
        run: |
          VAR="BASE_IMAGE_$(echo '${{ matrix.target.scope }}' \
            | tr '[:lower:]-' '[:upper:]_')"
          export "${VAR}=${{ steps.base.outputs.ref }}"
          {
            echo 'args<<ARGS_EOF'
            ./ci-images-tool.py build-args "${{ matrix.target.key }}"
            echo ARGS_EOF
          } >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.target.image }}/Dockerfile
          allow: security.insecure
          push: false
          load: true
          # Guest targets export /output to the host as well as loading the
          # payload image, so the verification below and the artifact upload
          # read files rather than shelling out to docker create.
          outputs: >-
            ${{ matrix.target.publish == 'artifact'
              && format('type=local,dest=output/{0}', matrix.target.scope)
              || '' }}
          tags: >-
            batesste-ci-images-${{ matrix.target.scope }}:test
          build-args: ${{ steps.buildargs.outputs.args }}
          cache-from: >-
            type=registry,ref=${{ env.CACHE_REGISTRY }}:${{ matrix.target.scope }}
          cache-to: >-
            type=registry,mode=max,image-manifest=true,oci-mediatypes=true,ref=${{
              env.CACHE_REGISTRY
            }}:${{ matrix.target.scope }}

      # The in-guest assertions already ran during the build (build-vm.sh boots
      # the finished qcow2 and runs checks/<flavour>.sh), so what is left is to
      # prove the payload is complete and self-describing -- the only interface
      # consumers have to this target.
      #
      # The extra output/ level is the payload stage still nesting under
      # /output, which it must while the scratch image is published too.
      - name: Verify guest image payload
        if: matrix.target.publish == 'artifact'
        run: |
          DIR="output/${{ matrix.target.scope }}/output"
          ls -l "$DIR"
          jq . "$DIR/vm-info.json"
          IMG=$(jq -r .image_path "$DIR/vm-info.json" | xargs basename)
          test -s "$DIR/${IMG}"
          test -s "$DIR/id_rsa"
          test -s "$DIR/id_rsa.pub"
          jq -e '.kernel_release | test("^[0-9]")' \
            "$DIR/vm-info.json" > /dev/null

      # test-compose bind-mounts a guest rather than pulling one: the qemu
      # image is toolchain-only now. zstd for the same reason as the image
      # tarballs above -- the qcow2 is multi-GB and upload is the bottleneck.
      - name: Export guest image payload
        if: matrix.target.publish == 'artifact'
        run: |
          tar -C "output/${{ matrix.target.scope }}/output" -cf - . \
            | zstd -T0 -3 \
            > "/tmp/vm-payload-${{ matrix.target.scope }}.tar.zst"

      - uses: actions/upload-artifact@v7
        if: matrix.target.publish == 'artifact'
        with:
          name: >-
            vm-payload-${{ matrix.target.scope }}
          path: >-
            /tmp/vm-payload-${{ matrix.target.scope }}.tar.zst
          compression-level: 0
          retention-days: 1

      # ── per-image checks, gated by scope so a variant of one of these
      # images does not silently inherit another's assertions.

      # Runners have no NVIDIA driver. fio starts anyway because the base
      # image ships cuda-compat, so no LD_LIBRARY_PATH juggling is needed.
      - name: Verify both GPU engines are compiled in
        if: matrix.target.image == 'ubuntu-cuda-rocm-fio'
        run: |
          docker run --rm \
            "batesste-ci-images-${{ matrix.target.scope }}:test" \
            bash -lc '
              set -e
              fio --version
              cat /usr/local/share/fio-commit.txt
              fio --enghelp | grep -qE "^[[:space:]]*libhipfile$"
              fio --enghelp | grep -qE "^[[:space:]]*libcufile$"
              echo "libhipfile and libcufile both present"
            '

      - name: Verify libcuda resolves to cuda-compat, not a stub
        if: matrix.target.image == 'ubuntu-cuda-rocm-fio'
        run: |
          docker run --rm \
            "batesste-ci-images-${{ matrix.target.scope }}:test" \
            bash -lc '
              set -e
              # compat must be last in ld.so.conf.d so a host-injected
              # driver takes precedence over it
              test -f /etc/ld.so.conf.d/zz-cuda-compat.conf
              RESOLVED=$(ldd "$(command -v fio)" \
                | awk "/libcuda\.so\.1/ {print \$3}")
              echo "libcuda.so.1 -> ${RESOLVED}"
              case "${RESOLVED}" in
                */compat/*) echo "resolves to cuda-compat, as expected" ;;
                *) echo "ERROR: unexpected libcuda source"; exit 1 ;;
              esac
              # the hand-rolled stub directory must never come back
              test ! -e /opt/fio/cuda-stubs
            '

      - name: Verify pinned fio commit
        if: matrix.target.image == 'ubuntu-cuda-rocm-fio'
        run: |
          ACTUAL=$(docker run --rm \
            "batesste-ci-images-${{ matrix.target.scope }}:test" \
            cat /usr/local/share/fio-commit.txt)
          EXPECTED=$(./ci-images-tool.py build-args "${{ matrix.target.key }}" \
            | sed -n 's/^FIO_COMMIT=//p')
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "ERROR: fio commit $ACTUAL != $EXPECTED"
            exit 1
          fi

      - name: Run fio smoke job
        if: matrix.target.image == 'ubuntu-cuda-rocm-fio'
        run: |
          docker run --rm \
            "batesste-ci-images-${{ matrix.target.scope }}:test" \
            fio --name=smoke --ioengine=psync --rw=write \
                --bs=64k --size=4m --directory=/tmp --minimal

      # Gated on the target key, not the image: the default target builds
      # upstream fio, which legitimately has no asynchronous submission.
      - name: Verify async hipfile submission modes
        if: matrix.target.key == 'ubuntu-cuda-rocm-fio@async-hipfile'
        run: |
          docker run --rm \
            "batesste-ci-images-${{ matrix.target.scope }}:test" \
            bash -lc '
              set -e
              grep -qx yes /usr/local/share/fio-hipfile-async.txt
              for mode in sync batch stream; do
                grep -q "$mode" /usr/local/share/fio-libhipfile-help.txt
              done
              test -s /usr/local/share/fio/examples/libhipfile-stream.fio
              test -s /usr/local/share/fio/examples/libhipfile-batch.fio
              test -x /usr/local/bin/fio-sweep
              hipfile-smoke.sh --help
            '

      # The upstream build must stay honest about not having the async modes:
      # a marker stuck at "yes" would make hipfile-smoke.sh promise them.
      - name: Verify upstream fio reports no async support
        if: matrix.target.key == 'ubuntu-cuda-rocm-fio'
        run: |
          docker run --rm \
            "batesste-ci-images-${{ matrix.target.scope }}:test" \
            bash -lc '
              set -e
              grep -qx no /usr/local/share/fio-hipfile-async.txt
              hipfile-smoke.sh --help
            '

      # Runners have no AMD GPU, so nothing here can move data. What is worth
      # asserting is that the ROCm-aware build actually happened: an apt UCX,
      # or a NIXL that fell back to its CPU-only path, would still install and
      # still print --help, and the image would be quietly useless.
      - name: Verify UCX was built with ROCm support
        if: matrix.target.image == 'ubuntu-rocm-nixl'
        run: |
          docker run --rm \
            "batesste-ci-images-${{ matrix.target.scope }}:test" \
            bash -lc '
              set -e
              ucx_info -v
              cat /usr/local/share/ucx-commit.txt
              # The rocm UCT module is only produced by a --with-rocm build,
              # so its presence is the assertion. Probing the transport at
              # runtime is not: the runner has no /dev/kfd, so the module
              # may decline to load even when it is correctly built.
              find /usr/local/lib -name "libuct_rocm*" | grep . \
                || { echo "ERROR: UCX has no ROCm module"; exit 1; }
            '

      - name: Verify NIXL was built against ROCm
        if: matrix.target.image == 'ubuntu-rocm-nixl'
        run: |
          docker run --rm \
            "batesste-ci-images-${{ matrix.target.scope }}:test" \
            bash -lc '
              set -e
              cat /usr/local/share/nixl-commit.txt
              command -v nixlbench
              # Which object carries the HIP dependency is up to NIXL and
              # has moved between releases, so search the whole install tree
              # rather than pinning a filename. A CPU-only fallback build
              # would still install and still answer --help; this is what
              # tells the two apart.
              FOUND=$(find /usr/local/nixl /usr/local/bin /usr/local/lib \
                        -type f 2>/dev/null \
                | xargs -r -n1 ldd 2>/dev/null \
                | grep -c "libamdhip64" || true)
              echo "objects linking libamdhip64: ${FOUND}"
              [ "${FOUND}" -gt 0 ] \
                || { echo "ERROR: nothing links ROCm"; exit 1; }
            '

      - name: Run nixlbench help
        if: matrix.target.image == 'ubuntu-rocm-nixl'
        # gflags exits 1 from every help flag, so the exit status says nothing
        # about whether the binary works. Assert on the banner instead: it is
        # printed only once nixlbench has loaded and resolved its shared
        # libraries, which is the thing this step exists to catch.
        run: |
          OUT=$(docker run --rm \
            "batesste-ci-images-${{ matrix.target.scope }}:test" \
            nixlbench --help 2>&1 || true)
          echo "${OUT}"
          echo "${OUT}" | grep -q "NIXL Benchmark" \
            || { echo "ERROR: nixlbench printed no help banner"; exit 1; }

      - name: Verify pinned NIXL and UCX commits
        if: matrix.target.image == 'ubuntu-rocm-nixl'
        run: |
          ARGS=$(./ci-images-tool.py build-args "${{ matrix.target.key }}")
          for pair in \
            "nixl-commit.txt:NIXL_COMMIT" \
            "ucx-commit.txt:UCX_COMMIT"; do
            FILE="${pair%%:*}"
            ARG="${pair##*:}"
            ACTUAL=$(docker run --rm \
              "batesste-ci-images-${{ matrix.target.scope }}:test" \
              cat "/usr/local/share/${FILE}")
            EXPECTED=$(echo "$ARGS" | sed -n "s/^${ARG}=//p")
            if [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "ERROR: ${ARG} $ACTUAL != $EXPECTED"
              exit 1
            fi
            echo "${ARG} ${ACTUAL} matches"
          done

  test-compose:
    name: Test Docker Compose Stack
    runs-on: ubuntu-latest
    needs: [discover-images, build, build-derived]
    if: >-
      contains(
        fromJson(needs.discover-images.outputs.keys),
        'ubuntu-qemu-libvfio-user'
      ) &&
      contains(
        fromJson(needs.discover-images.outputs.keys),
        'ubuntu-qcow2-gen'
      ) &&
      contains(
        fromJson(needs.discover-images.outputs.keys),
        'ubuntu-rocm-ernic'
      ) &&
      contains(
        fromJson(needs.discover-images.outputs.keys),
        'ubuntu-rocm-rocjitsu'
      )
    steps:
      - uses: actions/checkout@v7

      - name: Download qemu image artifact
        uses: actions/download-artifact@v8
        with:
          name: docker-image-ubuntu-qemu-libvfio-user

      - name: Download rocm-ernic image artifact
        uses: actions/download-artifact@v8
        with:
          name: docker-image-ubuntu-rocm-ernic

      - name: Download rocm-rocjitsu image artifact
        uses: actions/download-artifact@v8
        with:
          name: docker-image-ubuntu-rocm-rocjitsu

      - name: Load Docker images
        run: |
          zstd -dc ubuntu-qemu-libvfio-user.tar.zst \
            | docker load
          zstd -dc ubuntu-rocm-ernic.tar.zst \
            | docker load
          zstd -dc ubuntu-rocm-rocjitsu.tar.zst \
            | docker load
          docker tag \
            batesste-ci-images-ubuntu-qemu-libvfio-user:test \
            batesste-ci-images-ubuntu-qemu-libvfio-user:latest
          docker tag \
            batesste-ci-images-ubuntu-rocm-ernic:test \
            batesste-ci-images-ubuntu-rocm-ernic:latest
          docker tag \
            batesste-ci-images-ubuntu-rocm-rocjitsu:test \
            batesste-ci-images-ubuntu-rocm-rocjitsu:latest

      # The qemu service carries no guest of its own; compose/docker-compose.yml
      # bind-mounts ./vm over /output, so the stack cannot boot without this.
      - name: Download guest image payload
        uses: actions/download-artifact@v8
        with:
          name: vm-payload-ubuntu-qcow2-gen

      - name: Unpack guest image payload
        run: |
          mkdir -p compose/vm
          zstd -dc vm-payload-ubuntu-qcow2-gen.tar.zst \
            | tar -C compose/vm -xf -
          ls -l compose/vm
          jq -r .vm_name compose/vm/vm-info.json

      - name: Start compose stack
        run: |
          docker compose \
            -f compose/docker-compose.yml \
            up -d

      # The bind mount is the only thing that puts a guest in front of QEMU
      # now, so assert entrypoint.sh actually found one -- a VM_NAME that does
      # not match the payload would otherwise just show up as a dead service.
      - name: Verify qemu found the mounted guest
        run: |
          for i in $(seq 1 30); do
            if docker compose -f compose/docker-compose.yml logs qemu \
              | grep -q "VM image found at /output/"; then
              echo "qemu picked up the mounted guest after ~${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::qemu never reported a VM image under /output"
          docker compose -f compose/docker-compose.yml logs qemu
          exit 1

      - name: Wait for rocm-ernic to start
        run: |
          for i in $(seq 1 30); do
            if docker compose \
              -f compose/docker-compose.yml \
              ps rocm-ernic \
              | grep -q "Up\|running"; then
              echo "rocm-ernic running after ~${i}s"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "ERROR: rocm-ernic not running"
              docker compose \
                -f compose/docker-compose.yml \
                logs rocm-ernic
              exit 1
            fi
            sleep 1
          done

      - name: Verify rocm-ernic socket is present
        run: |
          docker compose \
            -f compose/docker-compose.yml \
            exec rocm-ernic \
            test -S \
            /tmp/vfio-sockets/rocm-ernic.sock

      - name: Wait for rocm-rocjitsu to start
        run: |
          for i in $(seq 1 30); do
            if docker compose \
              -f compose/docker-compose.yml \
              ps rocm-rocjitsu \
              | grep -q "Up\|running"; then
              echo "rocm-rocjitsu running after ~${i}s"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "ERROR: rocm-rocjitsu not running"
              docker compose \
                -f compose/docker-compose.yml \
                logs rocm-rocjitsu
              exit 1
            fi
            sleep 1
          done

      - name: Verify rocjitsu socket is present
        run: |
          docker compose \
            -f compose/docker-compose.yml \
            exec rocm-rocjitsu \
            test -S \
            /tmp/vfio-sockets/rocjitsu.sock

      - name: Show compose logs
        if: always()
        run: |
          docker compose \
            -f compose/docker-compose.yml \
            logs

      - name: Teardown
        if: always()
        run: |
          docker compose \
            -f compose/docker-compose.yml \
            down -v
