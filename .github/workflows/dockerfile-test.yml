name: Dockerfile Test

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main, master ]
    paths:
      - '**/Dockerfile'
      - '**/entrypoint.sh'
      - '**/packages.txt'
      - 'ci-images-tool.py'
      - 'compose/**'
      - 'common/**'
      - '.github/workflows/dockerfile-test.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - '**/Dockerfile'
      - '**/entrypoint.sh'
      - '**/packages.txt'
      - 'ci-images-tool.py'
      - 'compose/**'
      - 'common/**'
      - '.github/workflows/dockerfile-test.yml'

# Layer cache and the intermediate base images both live in GHCR. The GitHub
# Actions cache is capped at 10 GB per repository with LRU eviction, and
# mode=max on ubuntu-cuda-rocm alone exceeds a large fraction of that, so the
# per-image scopes used to evict each other and every "warm" build was cold.
# A registry cache has no such cap.
env:
  CACHE_REGISTRY: ghcr.io/${{ github.repository }}/buildcache
  BASE_REGISTRY: ghcr.io/${{ github.repository }}/ci-base

jobs:
  discover-images:
    name: Discover Images
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.find-images.outputs.images }}
    steps:
      - uses: actions/checkout@v7
      - name: Find all Dockerfiles
        id: find-images
        run: |
          # ubuntu-base and ubuntu-libvfio-user are built by build-bases, and
          # ubuntu-cuda-rocm-fio layers on ubuntu-cuda-rocm, so none of the
          # three belongs in the flat parallel matrix.
          IMAGES=$(find . -maxdepth 2 \
            -name "Dockerfile" -type f | \
            sed 's|^\./||' | \
            sed 's|/Dockerfile$||' | sort | \
            jq -R -s -c 'split("\n")[:-1]
              | map(select(. != "ubuntu-cuda-rocm-fio"
                        and . != "ubuntu-base"
                        and . != "ubuntu-libvfio-user"))')
          echo "images=$IMAGES" >> $GITHUB_OUTPUT
          echo "Found images: $IMAGES"

  # ubuntu-base holds the apt preamble and root CA every image shares;
  # ubuntu-libvfio-user adds the libvfio-user build that qemu and rocm-ernic
  # used to do twice. Pushing them to a scratch GHCR repo is what lets the
  # matrix keep the docker-container driver (and therefore the layer cache)
  # while still resolving a base built in this same run.
  build-bases:
    name: Build Base Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      base: ${{ steps.refs.outputs.base }}
      vfu: ${{ steps.refs.outputs.vfu }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Compute base refs
        id: refs
        run: |
          echo "base=${BASE_REGISTRY}:ubuntu-base-${GITHUB_SHA}" \
            >> "$GITHUB_OUTPUT"
          echo "vfu=${BASE_REGISTRY}:ubuntu-libvfio-user-${GITHUB_SHA}" \
            >> "$GITHUB_OUTPUT"

      - name: Build and push ubuntu-base
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ubuntu-base/Dockerfile
          push: true
          tags: ${{ steps.refs.outputs.base }}
          cache-from: type=registry,ref=${{ env.CACHE_REGISTRY }}:ubuntu-base
          cache-to: >-
            type=registry,mode=max,image-manifest=true,oci-mediatypes=true,ref=${{
              env.CACHE_REGISTRY
            }}:ubuntu-base

      - name: Build and push ubuntu-libvfio-user
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ubuntu-libvfio-user/Dockerfile
          push: true
          tags: ${{ steps.refs.outputs.vfu }}
          build-args: |
            BASE_IMAGE=${{ steps.refs.outputs.base }}
          cache-from: >-
            type=registry,ref=${{ env.CACHE_REGISTRY }}:ubuntu-libvfio-user
          cache-to: >-
            type=registry,mode=max,image-manifest=true,oci-mediatypes=true,ref=${{
              env.CACHE_REGISTRY
            }}:ubuntu-libvfio-user

      - name: Verify libvfio-user commit
        run: |
          docker run --rm "${{ steps.refs.outputs.vfu }}" \
            cat /usr/local/share/libvfio-user-commit.txt

  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [discover-images, build-bases]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: >-
          ${{
            fromJson(
              needs.discover-images.outputs.images
            )
          }}
        variant: ['']
        include:
          - image: ubuntu-qemu-libvfio-user
            variant: '-sbates-fork'
            qemu_repo: >-
              https://github.com/sbates130272/qemu.git
            qemu_commit: >-
              dev/stephen/pci-mmio-bridge-submit
    env:
      # ci-images-tool.py owns the pins; these point its BASE_IMAGE
      # resolution at the images build-bases just published.
      BASE_IMAGE_FOR_UBUNTU_BASE: ${{ needs.build-bases.outputs.base }}
      BASE_IMAGE_FOR_UBUNTU_LIBVFIO_USER: ${{ needs.build-bases.outputs.vfu }}
      QEMU_REPO: ${{ matrix.qemu_repo }}
      QEMU_COMMIT: ${{ matrix.qemu_commit }}
    steps:
      - uses: actions/checkout@v7

      # ubuntu-cuda-rocm downloads ~10 GB of .deb files, which ubuntu-base's
      # apt cache mounts now keep for the whole build instead of letting
      # docker-clean discard them. On top of a 28 GB image that overruns the
      # runner. CI gets nothing from those mounts anyway -- BuildKit never
      # exports them -- so buy the headroom back off the preinstalled
      # toolchains we never use rather than give up the local-rebuild win.
      - name: Free up disk space
        if: matrix.image == 'ubuntu-cuda-rocm'
        run: |
          df -h /
          sudo rm -rf \
            /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/local/share/powershell \
            /usr/share/swift
          df -h /

      - name: Ensure cloud image cache dir exists
        run: mkdir -p common/cloud-image-cache

      - name: Cache Ubuntu cloud image
        if: >-
          matrix.image ==
          'ubuntu-qemu-libvfio-user'
        uses: actions/cache@v6
        with:
          path: common/cloud-image-cache
          key: cloud-image-noble-amd64
          restore-keys: cloud-image-noble-

      - name: Pre-download cloud image
        if: >-
          matrix.image ==
          'ubuntu-qemu-libvfio-user'
        run: |
          DIR="common/cloud-image-cache"
          IMG="${DIR}/noble-server-cloudimg-amd64.img"
          if [ ! -f "$IMG" ]; then
            wget --progress=dot:giga --timeout=30 --tries=5 \
              --retry-connrefused -O "$IMG" \
              "https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img"
          fi

      # x86 GitHub-hosted runners do expose /dev/kvm, but as root:kvm 0660,
      # and BuildKit's RUN step is not in the kvm group. Widen it rather than
      # fall back to TCG, which turns a minutes-long VM boot into an hour.
      # ARM Linux, macOS, Windows and ubuntu-slim runners have no /dev/kvm at
      # all; the build-args step below detects that and selects vm-tcg.
      - name: Enable KVM for the VM build
        if: >-
          matrix.image ==
          'ubuntu-qemu-libvfio-user'
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi
          ls -l /dev/kvm || echo "no /dev/kvm on this runner"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # The VM build stage needs /dev/kvm, reachable only
          # from a RUN --security=insecure step.
          buildkitd-flags: >-
            --allow-insecure-entitlement security.insecure
            --allow-insecure-entitlement network.host

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install tool dependencies
        run: pip install -r requirements.txt

      # Pins live only in ci-images-tool.py; the workflow asks for them
      # rather than repeating them, so the two cannot drift.
      - name: Compute build args
        id: buildargs
        run: |
          # --kvm only means anything to ubuntu-qemu-libvfio-user, so gate it
          # on the device rather than on the image name.
          KVM_FLAG=
          [ -w /dev/kvm ] && KVM_FLAG=--kvm
          {
            echo 'args<<ARGS_EOF'
            ./ci-images-tool.py build-args "${{ matrix.image }}" ${KVM_FLAG}
            echo ARGS_EOF
          } >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.image }}/Dockerfile
          allow: security.insecure
          push: false
          load: true
          tags: >-
            batesste-ci-images-${{
              matrix.image
            }}${{
              matrix.variant
            }}:test
          cache-from: >-
            type=registry,ref=${{ env.CACHE_REGISTRY }}:${{
              matrix.image
            }}${{
              matrix.variant
            }}
          cache-to: >-
            type=registry,mode=max,image-manifest=true,oci-mediatypes=true,ref=${{
              env.CACHE_REGISTRY
            }}:${{
              matrix.image
            }}${{
              matrix.variant
            }}
          build-args: ${{ steps.buildargs.outputs.args }}

      # ── per-image checks, run here rather than in a downstream job:
      # the image is already in the daemon, so a save/upload/download
      # round-trip of a multi-GB image is pure overhead.

      - name: Test entrypoint script syntax
        if: hashFiles(format('{0}/entrypoint.sh', matrix.image)) != ''
        run: |
          docker run --rm --entrypoint /bin/bash \
            "batesste-ci-images-${{ matrix.image }}${{ matrix.variant }}:test" \
            -c "bash -n /build/entrypoint.sh && \
                echo 'Entrypoint syntax OK'"

      - name: Test entrypoint help
        if: hashFiles(format('{0}/entrypoint.sh', matrix.image)) != ''
        run: |
          timeout 10 docker run --rm \
            --cap-add NET_ADMIN \
            -e USERNAME=testuser \
            -e VM_NAME=test-vm \
            -e SSH_PORT=2222 \
            "batesste-ci-images-${{ matrix.image }}${{ matrix.variant }}:test" \
            || true

      - name: Verify toolkit binaries and install paths
        if: matrix.image == 'ubuntu-cuda-rocm'
        run: |
          docker run --rm \
            "batesste-ci-images-ubuntu-cuda-rocm:test" \
            bash -lc '
              set -e
              echo "CUDA version file:"; cat /etc/cuda-version
              echo "ROCm version file:"; cat /etc/rocm-version
              echo "CUDA path file:"; cat /etc/cuda-path
              echo "ROCm path file:"; cat /etc/rocm-path

              echo "CUDA nvcc:"; which nvcc; nvcc --version
              echo "ROCm hipcc:"; which hipcc; hipcc --version

              test -x "$(cat /etc/rocm-path)/bin/hipcc"
              test -f "$(cat /etc/rocm-path)/include/hip/hip_runtime.h"
              test -d "$(cat /etc/cuda-path)/lib64"

              echo "cuda-compat:"; cat /etc/cuda-compat-installed
              test "$(cat /etc/cuda-compat-installed)" = "yes"
              test -e "$(cat /etc/cuda-path)/compat/libcuda.so.1"
              ldconfig -p | grep "libcuda.so.1"
            '

      - name: Verify rocm-ernic binary and commit metadata
        if: matrix.image == 'ubuntu-rocm-ernic'
        run: |
          docker run --rm \
            "batesste-ci-images-ubuntu-rocm-ernic:test" \
            bash -lc '
              set -e
              which rocm-ernic
              cat /usr/local/share/rocm-ernic-commit.txt
              cat /usr/local/share/libvfio-user-commit.txt
            '

      - name: Run rocm-ernic loopback smoke test
        if: matrix.image == 'ubuntu-rocm-ernic'
        run: |
          docker run --rm --name rocm-ernic-test \
            --cap-add NET_ADMIN \
            "batesste-ci-images-ubuntu-rocm-ernic:test" \
            bash -c "
              mkdir -p /tmp/vfio-sockets
              rocm-ernic \
                --socket /tmp/vfio-sockets/rocm-ernic.sock \
                --backend loopback \
                --verbose &
              SERVER_PID=\$!
              sleep 3
              if ! kill -0 \${SERVER_PID} 2>/dev/null; then
                echo 'ERROR: rocm-ernic exited prematurely'
                exit 1
              fi
              echo \"rocm-ernic is running (PID \${SERVER_PID})\"
              kill \${SERVER_PID}
            "

      - name: Verify rocjitsu binary and commit metadata
        if: matrix.image == 'ubuntu-rocm-rocjitsu'
        run: |
          docker run --rm \
            "batesste-ci-images-ubuntu-rocm-rocjitsu:test" \
            bash -lc '
              set -e
              which rocjitsu
              cat /usr/local/share/rocjitsu-commit.txt
            '

      - name: Run rocjitsu vfio-socket smoke test
        if: matrix.image == 'ubuntu-rocm-rocjitsu'
        run: |
          docker run --rm --name rocjitsu-test \
            --cap-add NET_ADMIN \
            "batesste-ci-images-ubuntu-rocm-rocjitsu:test" \
            bash -c "
              mkdir -p /tmp/vfio-sockets
              rocjitsu \
                --config \${ROCJITSU_CONFIG_DIR}/gfx1250_mi455x.json \
                --vfio-socket /tmp/vfio-sockets/rocjitsu.sock &
              SERVER_PID=\$!
              sleep 3
              if ! kill -0 \${SERVER_PID} 2>/dev/null; then
                echo 'ERROR: rocjitsu exited prematurely'
                exit 1
              fi
              test -S /tmp/vfio-sockets/rocjitsu.sock
              echo \"rocjitsu is running (PID \${SERVER_PID})\"
              kill \${SERVER_PID}
            "

      # cuda-rocm's only consumer is build-derived, and what it wants is a
      # registry ref, not a local image -- it used to load the artifact purely
      # to push it straight back out again. Pushing here skips a ~13 GB
      # tarball in each direction, and skips writing it to a disk that the
      # image and its retained debs have already largely filled.
      - name: Push cuda-rocm to GHCR for build-derived
        if: matrix.image == 'ubuntu-cuda-rocm'
        run: |
          REF="${BASE_REGISTRY}:ubuntu-cuda-rocm-${GITHUB_SHA}"
          docker tag batesste-ci-images-ubuntu-cuda-rocm:test "$REF"
          docker push "$REF"

      # Only the jobs that genuinely need an image built by a *different*
      # job still pay the artifact round-trip. zstd rather than gzip: these
      # images are multi-GB and gzip is the slowest part of the hop.
      - name: Export Docker image
        if: >-
          matrix.image == 'ubuntu-qemu-libvfio-user' ||
          matrix.image == 'ubuntu-rocm-ernic' ||
          matrix.image == 'ubuntu-rocm-rocjitsu'
        run: |
          docker save \
            "batesste-ci-images-${{ matrix.image }}${{ matrix.variant }}:test" \
            | zstd -T0 -3 \
            > "/tmp/${{ matrix.image }}${{ matrix.variant }}.tar.zst"

      - uses: actions/upload-artifact@v4
        if: >-
          matrix.image == 'ubuntu-qemu-libvfio-user' ||
          matrix.image == 'ubuntu-rocm-ernic' ||
          matrix.image == 'ubuntu-rocm-rocjitsu'
        with:
          name: >-
            docker-image-${{
              matrix.image
            }}${{
              matrix.variant
            }}
          path: >-
            /tmp/${{
              matrix.image
            }}${{
              matrix.variant
            }}.tar.zst
          compression-level: 0
          retention-days: 1

  test-vm-packages:
    name: Test VM Packages
    runs-on: ubuntu-latest
    needs: [discover-images, build]
    if: >-
      contains(
        fromJson(needs.discover-images.outputs.images),
        'ubuntu-qemu-libvfio-user'
      )
    steps:
      - uses: actions/checkout@v7

      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image-ubuntu-qemu-libvfio-user

      - name: Load Docker image
        run: |
          zstd -dc ubuntu-qemu-libvfio-user.tar.zst \
            | docker load

      - name: Check packages.txt exists
        run: |
          if [ ! -f "ubuntu-qemu-libvfio-user/packages.txt" ]; then
            echo "packages.txt not found, skipping"
            exit 0
          fi

      - name: Start VM and wait for boot
        id: start-vm
        run: |
          docker run -d --name test-vm-packages \
            --cap-add NET_ADMIN \
            batesste-ci-images-ubuntu-qemu-libvfio-user:test
          echo "Waiting for VM to boot..."
          for i in $(seq 1 90); do
            if docker exec test-vm-packages bash -c \
              "chmod 600 /output/id_rsa && \
               timeout 5 ssh \
               -o StrictHostKeyChecking=no \
               -o UserKnownHostsFile=/dev/null \
               -o ConnectTimeout=3 \
               -p 2222 -i /output/id_rsa \
               batesste@localhost \
               'echo OK' 2>&1" \
              | grep -q "OK"; then
              echo "VM booted after ~$((i * 2))s"
              break
            fi
            if [ "$i" -eq 90 ]; then
              echo "ERROR: VM failed to boot in 180s"
              docker logs test-vm-packages
              exit 1
            fi
            sleep 2
          done

      - name: Verify packages are installed in VM
        run: |
          KERNEL_VERSION=$(docker exec \
            test-vm-packages uname -r \
            2>/dev/null || echo "")
          echo "Container kernel: ${KERNEL_VERSION}"
          MISSING_PACKAGES=""
          for PKG in build-essential rdma-core ibverbs-utils libibverbs-dev cmake ninja-build pkg-config; do
            echo "Checking for ${PKG}..."
            if docker exec test-vm-packages bash -c \
              "chmod 600 /output/id_rsa && \
               timeout 10 ssh \
               -o StrictHostKeyChecking=no \
               -o UserKnownHostsFile=/dev/null \
               -o ConnectTimeout=10 \
               -p 2222 -i /output/id_rsa \
               batesste@localhost \
               'dpkg -l | grep -E \"^ii.*${PKG}\"' \
               2>&1" | \
              grep -q "^ii"; then
              echo "OK ${PKG} is installed"
            else
              echo "FAIL ${PKG} is NOT installed"
              MISSING_PACKAGES="${MISSING_PACKAGES} ${PKG}"
            fi
          done
          if [ -n "${KERNEL_VERSION}" ]; then
            KERNEL_MAJOR=$(echo "${KERNEL_VERSION}" \
              | cut -d. -f1-2)
            echo "Checking linux-headers ~${KERNEL_MAJOR}"
            if docker exec test-vm-packages bash -c \
              "chmod 600 /output/id_rsa && \
               timeout 10 ssh \
               -o StrictHostKeyChecking=no \
               -o UserKnownHostsFile=/dev/null \
               -o ConnectTimeout=10 \
               -p 2222 -i /output/id_rsa \
               batesste@localhost \
               'dpkg -l | grep linux-headers' \
               2>&1" | \
              grep -q "linux-headers"; then
              echo "OK linux-headers is installed"
            else
              echo "FAIL linux-headers is NOT installed"
              MISSING_PACKAGES="${MISSING_PACKAGES} linux-headers"
            fi
          fi
          if [ -n "${MISSING_PACKAGES}" ]; then
            echo "ERROR: Missing:${MISSING_PACKAGES}"
            exit 1
          else
            echo "All expected packages are installed!"
          fi

      - name: Cleanup
        if: always()
        run: |
          docker stop test-vm-packages 2>/dev/null \
            || true
          docker rm test-vm-packages 2>/dev/null \
            || true

  build-derived:
    name: Build Derived Images
    runs-on: ubuntu-latest
    needs: [build-bases, build]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # This job loads the 28 GB cuda-rocm image into the daemon and then
      # builds fio on top of it, so it is tighter for space than the job that
      # produced the base. See the matching step in the build job above.
      - name: Free up disk space
        run: |
          df -h /
          sudo rm -rf \
            /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/local/share/powershell \
            /usr/share/swift
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # The base used to be loaded from an artifact into the local daemon,
      # which forced this build onto the plain docker driver and cost it the
      # layer cache entirely. The build job now pushes it to GHCR directly,
      # so there is nothing to fetch: buildx pulls what it needs from the ref.
      - name: Resolve base ref
        id: base
        run: |
          echo "ref=${BASE_REGISTRY}:ubuntu-cuda-rocm-${GITHUB_SHA}" \
            >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install tool dependencies
        run: pip install -r requirements.txt

      - name: Compute build args
        id: buildargs
        env:
          BASE_IMAGE_FOR_UBUNTU_CUDA_ROCM: ${{ steps.base.outputs.ref }}
        run: |
          {
            echo 'args<<ARGS_EOF'
            ./ci-images-tool.py build-args ubuntu-cuda-rocm-fio
            echo ARGS_EOF
          } >> "$GITHUB_OUTPUT"

      - name: Build ubuntu-cuda-rocm-fio
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ubuntu-cuda-rocm-fio/Dockerfile
          push: false
          load: true
          tags: batesste-ci-images-ubuntu-cuda-rocm-fio:test
          build-args: ${{ steps.buildargs.outputs.args }}
          cache-from: >-
            type=registry,ref=${{ env.CACHE_REGISTRY }}:ubuntu-cuda-rocm-fio
          cache-to: >-
            type=registry,mode=max,image-manifest=true,oci-mediatypes=true,ref=${{
              env.CACHE_REGISTRY
            }}:ubuntu-cuda-rocm-fio

      # Runners have no NVIDIA driver. fio starts anyway because the base
      # image ships cuda-compat, so no LD_LIBRARY_PATH juggling is needed.
      - name: Verify both GPU engines are compiled in
        run: |
          docker run --rm \
            "batesste-ci-images-ubuntu-cuda-rocm-fio:test" \
            bash -lc '
              set -e
              fio --version
              cat /usr/local/share/fio-commit.txt
              fio --enghelp | grep -qE "^[[:space:]]*libhipfile$"
              fio --enghelp | grep -qE "^[[:space:]]*libcufile$"
              echo "libhipfile and libcufile both present"
            '

      - name: Verify libcuda resolves to cuda-compat, not a stub
        run: |
          docker run --rm \
            "batesste-ci-images-ubuntu-cuda-rocm-fio:test" \
            bash -lc '
              set -e
              # compat must be last in ld.so.conf.d so a host-injected
              # driver takes precedence over it
              test -f /etc/ld.so.conf.d/zz-cuda-compat.conf
              RESOLVED=$(ldd "$(command -v fio)" \
                | awk "/libcuda\.so\.1/ {print \$3}")
              echo "libcuda.so.1 -> ${RESOLVED}"
              case "${RESOLVED}" in
                */compat/*) echo "resolves to cuda-compat, as expected" ;;
                *) echo "ERROR: unexpected libcuda source"; exit 1 ;;
              esac
              # the hand-rolled stub directory must never come back
              test ! -e /opt/fio/cuda-stubs
            '

      - name: Verify pinned fio commit
        run: |
          ACTUAL=$(docker run --rm \
            "batesste-ci-images-ubuntu-cuda-rocm-fio:test" \
            cat /usr/local/share/fio-commit.txt)
          EXPECTED=$(./ci-images-tool.py build-args ubuntu-cuda-rocm-fio \
            | sed -n 's/^FIO_COMMIT=//p')
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "ERROR: fio commit $ACTUAL != $EXPECTED"
            exit 1
          fi

      - name: Run fio smoke job
        run: |
          docker run --rm \
            "batesste-ci-images-ubuntu-cuda-rocm-fio:test" \
            fio --name=smoke --ioengine=psync --rw=write \
                --bs=64k --size=4m --directory=/tmp --minimal

  test-compose:
    name: Test Docker Compose Stack
    runs-on: ubuntu-latest
    needs: [discover-images, build]
    if: >-
      contains(
        fromJson(needs.discover-images.outputs.images),
        'ubuntu-qemu-libvfio-user'
      ) &&
      contains(
        fromJson(needs.discover-images.outputs.images),
        'ubuntu-rocm-ernic'
      ) &&
      contains(
        fromJson(needs.discover-images.outputs.images),
        'ubuntu-rocm-rocjitsu'
      )
    steps:
      - uses: actions/checkout@v7

      - name: Download qemu image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image-ubuntu-qemu-libvfio-user

      - name: Download rocm-ernic image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image-ubuntu-rocm-ernic

      - name: Download rocm-rocjitsu image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image-ubuntu-rocm-rocjitsu

      - name: Load Docker images
        run: |
          zstd -dc ubuntu-qemu-libvfio-user.tar.zst \
            | docker load
          zstd -dc ubuntu-rocm-ernic.tar.zst \
            | docker load
          zstd -dc ubuntu-rocm-rocjitsu.tar.zst \
            | docker load
          docker tag \
            batesste-ci-images-ubuntu-qemu-libvfio-user:test \
            batesste-ci-images-ubuntu-qemu-libvfio-user:latest
          docker tag \
            batesste-ci-images-ubuntu-rocm-ernic:test \
            batesste-ci-images-ubuntu-rocm-ernic:latest
          docker tag \
            batesste-ci-images-ubuntu-rocm-rocjitsu:test \
            batesste-ci-images-ubuntu-rocm-rocjitsu:latest

      - name: Start compose stack
        run: |
          docker compose \
            -f compose/docker-compose.yml \
            up -d

      - name: Wait for rocm-ernic to start
        run: |
          for i in $(seq 1 30); do
            if docker compose \
              -f compose/docker-compose.yml \
              ps rocm-ernic \
              | grep -q "Up\|running"; then
              echo "rocm-ernic running after ~${i}s"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "ERROR: rocm-ernic not running"
              docker compose \
                -f compose/docker-compose.yml \
                logs rocm-ernic
              exit 1
            fi
            sleep 1
          done

      - name: Verify rocm-ernic socket is present
        run: |
          docker compose \
            -f compose/docker-compose.yml \
            exec rocm-ernic \
            test -S \
            /tmp/vfio-sockets/rocm-ernic.sock

      - name: Wait for rocm-rocjitsu to start
        run: |
          for i in $(seq 1 30); do
            if docker compose \
              -f compose/docker-compose.yml \
              ps rocm-rocjitsu \
              | grep -q "Up\|running"; then
              echo "rocm-rocjitsu running after ~${i}s"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "ERROR: rocm-rocjitsu not running"
              docker compose \
                -f compose/docker-compose.yml \
                logs rocm-rocjitsu
              exit 1
            fi
            sleep 1
          done

      - name: Verify rocjitsu socket is present
        run: |
          docker compose \
            -f compose/docker-compose.yml \
            exec rocm-rocjitsu \
            test -S \
            /tmp/vfio-sockets/rocjitsu.sock

      - name: Show compose logs
        if: always()
        run: |
          docker compose \
            -f compose/docker-compose.yml \
            logs

      - name: Teardown
        if: always()
        run: |
          docker compose \
            -f compose/docker-compose.yml \
            down -v
