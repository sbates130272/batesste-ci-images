name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover-images:
    name: Discover Images
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.find-images.outputs.images }}
    steps:
      - uses: actions/checkout@v7
      - name: Find all Dockerfiles
        id: find-images
        run: |
          # ubuntu-cuda-rocm-fio layers on ubuntu-cuda-rocm, so it is built
          # by the build-and-push-derived job instead of this matrix.
          IMAGES=$(find . -maxdepth 2 \
            -name "Dockerfile" -type f | \
            sed 's|^\./||' | \
            sed 's|/Dockerfile$||' | sort | \
            jq -R -s -c 'split("\n")[:-1]
              | map(select(. != "ubuntu-cuda-rocm-fio"))')
          echo "images=$IMAGES" >> $GITHUB_OUTPUT
          echo "Found images: $IMAGES"

  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest
    needs: discover-images
    strategy:
      fail-fast: false
      matrix:
        image: >-
          ${{
            fromJson(
              needs.discover-images.outputs.images
            )
          }}
        variant: ['']
        include:
          - image: ubuntu-qemu-libvfio-user
            variant: '-sbates-fork'
            qemu_repo: >-
              https://github.com/sbates130272/qemu.git
            qemu_commit: >-
              dev/stephen/pci-mmio-bridge-submit
          - image: ubuntu-rocm-ernic
            variant: ''
            rocm_ernic_commit: >-
              e3ef00c2a0c1ba1df95e6cbbe9362c2a1ad1d2fb
          - image: ubuntu-rocm-rocjitsu
            variant: ''
            rocjitsu_repo: >-
              https://github.com/ROCm/rocm-systems.git
            rocjitsu_branch: >-
              develop
            rocjitsu_commit: >-
              5e9cc7c57d372c0198fd8decb1fe5ceb07038a2b
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # The VM build stage needs /dev/kvm, reachable only
          # from a RUN --security=insecure step.
          buildkitd-flags: >-
            --allow-insecure-entitlement security.insecure
            --allow-insecure-entitlement network.host

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install tool dependencies
        run: pip install -r requirements.txt

      # ci-images-tool.py owns the tag scheme so a release and a local
      # build cannot drift; the pinned versions reach it through the same
      # env vars that drive the build args below.
      - name: Compute image tags and labels
        id: tags
        env:
          REGISTRY: docker.io
          REGISTRY_IMAGE: batesste-ci-images
          REGISTRY_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          QEMU_COMMIT: ${{ matrix.qemu_commit }}
          ROCM_ERNIC_COMMIT: ${{ matrix.rocm_ernic_commit }}
          ROCM_ROCJITSU_COMMIT: ${{ matrix.rocjitsu_commit }}
          ROCM_ROCJITSU_BRANCH: ${{ matrix.rocjitsu_branch }}
        run: |
          {
            echo 'refs<<TAGS_EOF'
            ./ci-images-tool.py tags "${{ matrix.image }}" \
              --tag "${{ steps.version.outputs.version }}" \
              --suffix="${{ matrix.variant }}" \
              --extra-tag "sha-${GITHUB_SHA:0:7}" \
              --extra-tag "${{ steps.version.outputs.tag }}"
            echo TAGS_EOF
            echo 'labels<<LABELS_EOF'
            ./ci-images-tool.py labels "${{ matrix.image }}" \
              --tag "${{ steps.version.outputs.version }}"
            echo LABELS_EOF
          } >> "$GITHUB_OUTPUT"

      - name: Ensure cloud image cache dir exists
        run: mkdir -p common/cloud-image-cache

      - name: Cache Ubuntu cloud image
        if: matrix.image == 'ubuntu-qemu-libvfio-user'
        uses: actions/cache@v6
        with:
          path: common/cloud-image-cache
          key: cloud-image-noble-amd64
          restore-keys: cloud-image-noble-

      - name: Pre-download cloud image
        if: matrix.image == 'ubuntu-qemu-libvfio-user'
        run: |
          DIR="common/cloud-image-cache"
          IMG="${DIR}/noble-server-cloudimg-amd64.img"
          if [ ! -f "$IMG" ]; then
            wget --progress=dot:giga --timeout=30 --tries=5 \
              --retry-connrefused -O "$IMG" \
              "https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img"
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.image }}/Dockerfile
          allow: security.insecure
          push: true
          tags: ${{ steps.tags.outputs.refs }}
          cache-from: >-
            type=gha,scope=${{
              matrix.image
            }}${{
              matrix.variant
            }}
          cache-to: >-
            type=gha,mode=max,scope=${{
              matrix.image
            }}${{
              matrix.variant
            }}
          build-args: |
            QEMU_REPO=${{ matrix.qemu_repo || 'https://gitlab.com/qemu-project/qemu.git' }}
            QEMU_COMMIT=${{ matrix.qemu_commit || 'v11.1.1' }}
            ${{ (matrix.image == 'ubuntu-qemu-libvfio-user' || matrix.image == 'ubuntu-rocm-ernic') && 'LIBVFIO_USER_COMMIT=323f4cb6cddc3713fb7aebe44436f28b28b5413a' || '' }}
            ${{ matrix.image == 'ubuntu-qemu-libvfio-user' && 'QEMU_MINIMAL_REPO=https://github.com/sbates130272/qemu-minimal.git' || '' }}
            ${{ matrix.image == 'ubuntu-qemu-libvfio-user' && 'QEMU_MINIMAL_COMMIT=225a81766b87ad2adb4e93d71bb8ed5e4e996466' || '' }}
            ${{ matrix.image == 'ubuntu-rocm-ernic' && format('ROCM_ERNIC_COMMIT={0}', matrix.rocm_ernic_commit) || '' }}
            ${{ matrix.image == 'ubuntu-rocm-rocjitsu' && format('ROCJITSU_BRANCH={0}', matrix.rocjitsu_branch) || '' }}
            ${{ matrix.image == 'ubuntu-rocm-rocjitsu' && format('ROCJITSU_COMMIT={0}', matrix.rocjitsu_commit) || '' }}
          labels: |
            ${{ steps.tags.outputs.labels }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}

  build-and-push-derived:
    name: Build and Push Derived
    runs-on: ubuntu-latest
    needs: build-and-push
    env:
      REGISTRY: docker.io
      REGISTRY_IMAGE: batesste-ci-images
      REGISTRY_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      FIO_REPO: https://github.com/axboe/fio.git
      FIO_COMMIT: 975ea1856fee9f4c0f01f6f19ba3c61ce24f9bc8
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install tool dependencies
        run: pip install -r requirements.txt

      # The base ref is the first line of the base image's tag set: the
      # immutable, fully specified tag build-and-push just published.
      - name: Compute image tags and labels
        id: tags
        run: |
          BASE=$(./ci-images-tool.py tags ubuntu-cuda-rocm \
            --tag "${{ steps.version.outputs.version }}" | head -1)
          echo "base=${BASE}" >> "$GITHUB_OUTPUT"
          {
            echo 'refs<<TAGS_EOF'
            ./ci-images-tool.py tags ubuntu-cuda-rocm-fio \
              --tag "${{ steps.version.outputs.version }}" \
              --extra-tag "sha-${GITHUB_SHA:0:7}" \
              --extra-tag "${{ steps.version.outputs.tag }}"
            echo TAGS_EOF
            echo 'labels<<LABELS_EOF'
            ./ci-images-tool.py labels ubuntu-cuda-rocm-fio \
              --tag "${{ steps.version.outputs.version }}"
            echo LABELS_EOF
          } >> "$GITHUB_OUTPUT"

      - name: Build and push ubuntu-cuda-rocm-fio
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ubuntu-cuda-rocm-fio/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.refs }}
          cache-from: type=gha,scope=ubuntu-cuda-rocm-fio
          cache-to: type=gha,mode=max,scope=ubuntu-cuda-rocm-fio
          build-args: |
            BASE_IMAGE=${{ steps.tags.outputs.base }}
            FIO_REPO=${{ env.FIO_REPO }}
            FIO_COMMIT=${{ env.FIO_COMMIT }}
          labels: |
            ${{ steps.tags.outputs.labels }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-and-push, build-and-push-derived]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          make_latest: true
