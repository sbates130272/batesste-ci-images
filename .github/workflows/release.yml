name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover-images:
    name: Discover Images
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.find-images.outputs.images }}
    steps:
      - uses: actions/checkout@v7
      - name: Find all Dockerfiles
        id: find-images
        run: |
          # ubuntu-cuda-rocm-fio layers on ubuntu-cuda-rocm, so it is built
          # by the build-and-push-derived job instead of this matrix.
          IMAGES=$(find . -maxdepth 2 \
            -name "Dockerfile" -type f | \
            sed 's|^\./||' | \
            sed 's|/Dockerfile$||' | sort | \
            jq -R -s -c 'split("\n")[:-1]
              | map(select(. != "ubuntu-cuda-rocm-fio"))')
          echo "images=$IMAGES" >> $GITHUB_OUTPUT
          echo "Found images: $IMAGES"

  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest
    needs: discover-images
    strategy:
      fail-fast: false
      matrix:
        image: >-
          ${{
            fromJson(
              needs.discover-images.outputs.images
            )
          }}
        variant: ['']
        include:
          - image: ubuntu-qemu-libvfio-user
            variant: '-sbates-fork'
            qemu_repo: >-
              https://github.com/sbates130272/qemu.git
            qemu_commit: >-
              dev/stephen/pci-mmio-bridge-submit
          - image: ubuntu-rocm-ernic
            variant: ''
            rocm_ernic_commit: >-
              66512ca117b9e7c7f0fd825c6a7daf8b0d5a2263
          - image: ubuntu-rocm-rocjitsu
            variant: ''
            rocjitsu_repo: >-
              https://github.com/ROCm/rocm-systems.git
            rocjitsu_branch: >-
              develop
            rocjitsu_commit: >-
              5591761e3865fb92f3b82e2f18106927af77d34a
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # The VM build stage needs /dev/kvm, reachable only
          # from a RUN --security=insecure step.
          buildkitd-flags: >-
            --allow-insecure-entitlement security.insecure
            --allow-insecure-entitlement network.host

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Ensure cloud image cache dir exists
        run: mkdir -p common/cloud-image-cache

      - name: Cache Ubuntu cloud image
        if: matrix.image == 'ubuntu-qemu-libvfio-user'
        uses: actions/cache@v4
        with:
          path: common/cloud-image-cache
          key: cloud-image-noble-amd64
          restore-keys: cloud-image-noble-

      - name: Pre-download cloud image
        if: matrix.image == 'ubuntu-qemu-libvfio-user'
        run: |
          DIR="common/cloud-image-cache"
          IMG="${DIR}/noble-server-cloudimg-amd64.img"
          if [ ! -f "$IMG" ]; then
            wget -q -O "$IMG" \
              "https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img"
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.image }}/Dockerfile
          allow: security.insecure
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/batesste-ci-images-${{ matrix.image }}${{ matrix.variant }}:${{ steps.version.outputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/batesste-ci-images-${{ matrix.image }}${{ matrix.variant }}:latest
          cache-from: >-
            type=gha,scope=${{
              matrix.image
            }}${{
              matrix.variant
            }}
          cache-to: >-
            type=gha,mode=max,scope=${{
              matrix.image
            }}${{
              matrix.variant
            }}
          build-args: |
            QEMU_REPO=${{ matrix.qemu_repo || 'https://gitlab.com/qemu-project/qemu.git' }}
            QEMU_COMMIT=${{ matrix.qemu_commit || 'v11.1.1' }}
            ${{ matrix.image == 'ubuntu-qemu-libvfio-user' && 'LIBVFIO_USER_COMMIT=323f4cb6cddc3713fb7aebe44436f28b28b5413a' || '' }}
            ${{ matrix.image == 'ubuntu-qemu-libvfio-user' && 'QEMU_MINIMAL_REPO=https://github.com/sbates130272/qemu-minimal.git' || '' }}
            ${{ matrix.image == 'ubuntu-qemu-libvfio-user' && 'QEMU_MINIMAL_COMMIT=f88d4561031b80aec4441352d221c42ede30848b' || '' }}
            ${{ matrix.image == 'ubuntu-rocm-ernic' && format('ROCM_ERNIC_COMMIT={0}', matrix.rocm_ernic_commit) || '' }}
            ${{ matrix.image == 'ubuntu-rocm-rocjitsu' && format('ROCJITSU_BRANCH={0}', matrix.rocjitsu_branch) || '' }}
            ${{ matrix.image == 'ubuntu-rocm-rocjitsu' && format('ROCJITSU_COMMIT={0}', matrix.rocjitsu_commit) || '' }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  build-and-push-derived:
    name: Build and Push Derived
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Build and push ubuntu-cuda-rocm-fio
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ubuntu-cuda-rocm-fio/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/batesste-ci-images-ubuntu-cuda-rocm-fio:${{ steps.version.outputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/batesste-ci-images-ubuntu-cuda-rocm-fio:latest
          cache-from: type=gha,scope=ubuntu-cuda-rocm-fio
          cache-to: type=gha,mode=max,scope=ubuntu-cuda-rocm-fio
          build-args: |
            BASE_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/batesste-ci-images-ubuntu-cuda-rocm:${{ steps.version.outputs.tag }}
            FIO_REPO=https://github.com/axboe/fio.git
            FIO_COMMIT=ae35a58399b28edf857f7ebc43b3eb40d86ac29b
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-and-push, build-and-push-derived]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          make_latest: true
