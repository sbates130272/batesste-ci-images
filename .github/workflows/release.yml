name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Layer cache lives in GHCR, not the Actions cache: the latter is capped at
# 10 GB per repository with LRU eviction, and mode=max across every image
# scope meant they evicted each other between runs.
env:
  CACHE_REGISTRY: ghcr.io/${{ github.repository }}/buildcache
  BASE_REGISTRY: ghcr.io/${{ github.repository }}/ci-base

jobs:
  discover-images:
    name: Discover Images
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.find-images.outputs.images }}
    steps:
      - uses: actions/checkout@v7
      - name: Find all Dockerfiles
        id: find-images
        run: |
          # ubuntu-base and ubuntu-libvfio-user are built by build-bases;
          # ubuntu-cuda-rocm-fio layers on ubuntu-cuda-rocm and is built by
          # build-and-push-derived. None belongs in this matrix.
          IMAGES=$(find . -maxdepth 2 \
            -name "Dockerfile" -type f | \
            sed 's|^\./||' | \
            sed 's|/Dockerfile$||' | sort | \
            jq -R -s -c 'split("\n")[:-1]
              | map(select(. != "ubuntu-cuda-rocm-fio"
                        and . != "ubuntu-base"
                        and . != "ubuntu-libvfio-user"))')
          echo "images=$IMAGES" >> $GITHUB_OUTPUT
          echo "Found images: $IMAGES"

  # Shared layers, built once. Published to Docker Hub like any other image
  # so a local build can layer on them without rebuilding, and to a GHCR
  # scratch tag so the matrix below can resolve them immediately.
  build-bases:
    name: Build and Push Base Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      base: ${{ steps.refs.outputs.base }}
      vfu: ${{ steps.refs.outputs.vfu }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install tool dependencies
        run: pip install -r requirements.txt

      - name: Compute refs, tags and labels
        id: refs
        env:
          REGISTRY: docker.io
          REGISTRY_IMAGE: batesste-ci-images
          REGISTRY_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          V="${{ steps.version.outputs.version }}"
          echo "base=${BASE_REGISTRY}:ubuntu-base-${GITHUB_SHA}" \
            >> "$GITHUB_OUTPUT"
          echo "vfu=${BASE_REGISTRY}:ubuntu-libvfio-user-${GITHUB_SHA}" \
            >> "$GITHUB_OUTPUT"
          for img in ubuntu-base ubuntu-libvfio-user; do
            key="${img//-/_}"
            {
              echo "${key}_tags<<EOF"
              ./ci-images-tool.py tags "$img" --tag "$V" \
                --extra-tag "sha-${GITHUB_SHA:0:7}" \
                --extra-tag "${{ steps.version.outputs.tag }}"
              echo "${BASE_REGISTRY}:${img}-${GITHUB_SHA}"
              echo EOF
              echo "${key}_labels<<EOF"
              ./ci-images-tool.py labels "$img" --tag "$V"
              echo EOF
            } >> "$GITHUB_OUTPUT"
          done

      - name: Build and push ubuntu-base
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ubuntu-base/Dockerfile
          push: true
          tags: ${{ steps.refs.outputs.ubuntu_base_tags }}
          cache-from: type=registry,ref=${{ env.CACHE_REGISTRY }}:ubuntu-base
          cache-to: >-
            type=registry,mode=max,image-manifest=true,oci-mediatypes=true,ref=${{
              env.CACHE_REGISTRY
            }}:ubuntu-base
          labels: |
            ${{ steps.refs.outputs.ubuntu_base_labels }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}

      - name: Build and push ubuntu-libvfio-user
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ubuntu-libvfio-user/Dockerfile
          push: true
          tags: ${{ steps.refs.outputs.ubuntu_libvfio_user_tags }}
          build-args: |
            BASE_IMAGE=${{ steps.refs.outputs.base }}
          cache-from: >-
            type=registry,ref=${{ env.CACHE_REGISTRY }}:ubuntu-libvfio-user
          cache-to: >-
            type=registry,mode=max,image-manifest=true,oci-mediatypes=true,ref=${{
              env.CACHE_REGISTRY
            }}:ubuntu-libvfio-user
          labels: |
            ${{ steps.refs.outputs.ubuntu_libvfio_user_labels }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}

  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest
    needs: [discover-images, build-bases]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: >-
          ${{
            fromJson(
              needs.discover-images.outputs.images
            )
          }}
        variant: ['']
        include:
          - image: ubuntu-qemu-libvfio-user
            variant: '-sbates-fork'
            qemu_repo: >-
              https://github.com/sbates130272/qemu.git
            qemu_commit: >-
              dev/stephen/pci-mmio-bridge-submit
    env:
      REGISTRY: docker.io
      REGISTRY_IMAGE: batesste-ci-images
      REGISTRY_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      # Point ci-images-tool.py's BASE_IMAGE resolution at the bases
      # build-bases just published to the GHCR scratch tag.
      BASE_IMAGE_FOR_UBUNTU_BASE: ${{ needs.build-bases.outputs.base }}
      BASE_IMAGE_FOR_UBUNTU_LIBVFIO_USER: ${{ needs.build-bases.outputs.vfu }}
      QEMU_REPO: ${{ matrix.qemu_repo }}
      QEMU_COMMIT: ${{ matrix.qemu_commit }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # The VM build stage needs /dev/kvm, reachable only
          # from a RUN --security=insecure step.
          buildkitd-flags: >-
            --allow-insecure-entitlement security.insecure
            --allow-insecure-entitlement network.host

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install tool dependencies
        run: pip install -r requirements.txt

      # ci-images-tool.py owns the tag scheme, the labels and the pinned
      # versions, so a release and a local build cannot drift.
      - name: Compute image tags, labels and build args
        id: tags
        run: |
          {
            echo 'refs<<TAGS_EOF'
            ./ci-images-tool.py tags "${{ matrix.image }}" \
              --tag "${{ steps.version.outputs.version }}" \
              --suffix="${{ matrix.variant }}" \
              --extra-tag "sha-${GITHUB_SHA:0:7}" \
              --extra-tag "${{ steps.version.outputs.tag }}"
            echo TAGS_EOF
            echo 'labels<<LABELS_EOF'
            ./ci-images-tool.py labels "${{ matrix.image }}" \
              --tag "${{ steps.version.outputs.version }}"
            echo LABELS_EOF
            echo 'args<<ARGS_EOF'
            ./ci-images-tool.py build-args "${{ matrix.image }}" \
              --tag "${{ steps.version.outputs.version }}"
            echo ARGS_EOF
          } >> "$GITHUB_OUTPUT"

      - name: Ensure cloud image cache dir exists
        run: mkdir -p common/cloud-image-cache

      - name: Cache Ubuntu cloud image
        if: matrix.image == 'ubuntu-qemu-libvfio-user'
        uses: actions/cache@v4
        with:
          path: common/cloud-image-cache
          key: cloud-image-noble-amd64
          restore-keys: cloud-image-noble-

      - name: Pre-download cloud image
        if: matrix.image == 'ubuntu-qemu-libvfio-user'
        run: |
          DIR="common/cloud-image-cache"
          IMG="${DIR}/noble-server-cloudimg-amd64.img"
          if [ ! -f "$IMG" ]; then
            wget --progress=dot:giga --timeout=30 --tries=5 \
              --retry-connrefused -O "$IMG" \
              "https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img"
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.image }}/Dockerfile
          allow: security.insecure
          push: true
          tags: ${{ steps.tags.outputs.refs }}
          cache-from: >-
            type=registry,ref=${{ env.CACHE_REGISTRY }}:${{
              matrix.image
            }}${{
              matrix.variant
            }}
          cache-to: >-
            type=registry,mode=max,image-manifest=true,oci-mediatypes=true,ref=${{
              env.CACHE_REGISTRY
            }}:${{
              matrix.image
            }}${{
              matrix.variant
            }}
          build-args: ${{ steps.tags.outputs.args }}
          labels: |
            ${{ steps.tags.outputs.labels }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}

  build-and-push-derived:
    name: Build and Push Derived
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: docker.io
      REGISTRY_IMAGE: batesste-ci-images
      REGISTRY_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install tool dependencies
        run: pip install -r requirements.txt

      # BASE_IMAGE resolves to the first line of ubuntu-cuda-rocm's tag set:
      # the immutable, fully specified tag build-and-push just published.
      - name: Compute image tags, labels and build args
        id: tags
        run: |
          {
            echo 'refs<<TAGS_EOF'
            ./ci-images-tool.py tags ubuntu-cuda-rocm-fio \
              --tag "${{ steps.version.outputs.version }}" \
              --extra-tag "sha-${GITHUB_SHA:0:7}" \
              --extra-tag "${{ steps.version.outputs.tag }}"
            echo TAGS_EOF
            echo 'labels<<LABELS_EOF'
            ./ci-images-tool.py labels ubuntu-cuda-rocm-fio \
              --tag "${{ steps.version.outputs.version }}"
            echo LABELS_EOF
            echo 'args<<ARGS_EOF'
            ./ci-images-tool.py build-args ubuntu-cuda-rocm-fio \
              --tag "${{ steps.version.outputs.version }}"
            echo ARGS_EOF
          } >> "$GITHUB_OUTPUT"

      - name: Build and push ubuntu-cuda-rocm-fio
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ubuntu-cuda-rocm-fio/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.refs }}
          cache-from: >-
            type=registry,ref=${{ env.CACHE_REGISTRY }}:ubuntu-cuda-rocm-fio
          cache-to: >-
            type=registry,mode=max,image-manifest=true,oci-mediatypes=true,ref=${{
              env.CACHE_REGISTRY
            }}:ubuntu-cuda-rocm-fio
          build-args: ${{ steps.tags.outputs.args }}
          labels: |
            ${{ steps.tags.outputs.labels }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-bases, build-and-push, build-and-push-derived]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          make_latest: true
