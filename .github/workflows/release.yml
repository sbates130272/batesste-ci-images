name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Layer cache lives in GHCR, not the Actions cache: the latter is capped at
# 10 GB per repository with LRU eviction, and mode=max across every image
# scope meant they evicted each other between runs.
env:
  CACHE_REGISTRY: ghcr.io/${{ github.repository }}/buildcache
  BASE_REGISTRY: ghcr.io/${{ github.repository }}/ci-base

jobs:
  discover-images:
    name: Discover Images
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.find-images.outputs.targets }}
      derived: ${{ steps.find-images.outputs.derived }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install tool dependencies
        run: pip install -r requirements.txt

      # images.yml says which job builds what, so this no longer globs for
      # Dockerfiles and carries its own exclusion list. One image can declare
      # several variants, each a separate target built from the same Dockerfile.
      - name: Enumerate matrix targets
        id: find-images
        run: |
          ./ci-images-tool.py validate
          TARGETS=$(./ci-images-tool.py targets --job matrix --json)
          echo "targets=$TARGETS" >> $GITHUB_OUTPUT
          echo "$TARGETS" | jq .
          DERIVED=$(./ci-images-tool.py targets --job derived --json)
          echo "derived=$DERIVED" >> $GITHUB_OUTPUT
          echo "$DERIVED" | jq .

  # Shared layers, built once. Published to Docker Hub like any other image
  # so a local build can layer on them without rebuilding, and to a GHCR
  # scratch tag so the matrix below can resolve them immediately.
  build-bases:
    name: Build and Push Base Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      base: ${{ steps.refs.outputs.base }}
      vfu: ${{ steps.refs.outputs.vfu }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install tool dependencies
        run: pip install -r requirements.txt

      - name: Compute refs, tags and labels
        id: refs
        env:
          REGISTRY: docker.io
          REGISTRY_IMAGE: batesste-ci-images
          REGISTRY_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          V="${{ steps.version.outputs.version }}"
          echo "base=${BASE_REGISTRY}:ubuntu-base-${GITHUB_SHA}" \
            >> "$GITHUB_OUTPUT"
          echo "vfu=${BASE_REGISTRY}:ubuntu-libvfio-user-${GITHUB_SHA}" \
            >> "$GITHUB_OUTPUT"
          for img in ubuntu-base ubuntu-libvfio-user; do
            key="${img//-/_}"
            {
              echo "${key}_tags<<EOF"
              ./ci-images-tool.py tags "$img" --tag "$V" \
                --extra-tag "sha-${GITHUB_SHA:0:7}" \
                --extra-tag "${{ steps.version.outputs.tag }}"
              echo "${BASE_REGISTRY}:${img}-${GITHUB_SHA}"
              echo EOF
              echo "${key}_labels<<EOF"
              ./ci-images-tool.py labels "$img" --tag "$V"
              echo EOF
            } >> "$GITHUB_OUTPUT"
          done

      - name: Build and push ubuntu-base
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ubuntu-base/Dockerfile
          push: true
          tags: ${{ steps.refs.outputs.ubuntu_base_tags }}
          cache-from: type=registry,ref=${{ env.CACHE_REGISTRY }}:ubuntu-base
          cache-to: >-
            type=registry,mode=max,image-manifest=true,oci-mediatypes=true,ref=${{
              env.CACHE_REGISTRY
            }}:ubuntu-base
          labels: |
            ${{ steps.refs.outputs.ubuntu_base_labels }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}

      - name: Build and push ubuntu-libvfio-user
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ubuntu-libvfio-user/Dockerfile
          push: true
          tags: ${{ steps.refs.outputs.ubuntu_libvfio_user_tags }}
          build-args: |
            BASE_IMAGE=${{ steps.refs.outputs.base }}
          cache-from: >-
            type=registry,ref=${{ env.CACHE_REGISTRY }}:ubuntu-libvfio-user
          cache-to: >-
            type=registry,mode=max,image-manifest=true,oci-mediatypes=true,ref=${{
              env.CACHE_REGISTRY
            }}:ubuntu-libvfio-user
          labels: |
            ${{ steps.refs.outputs.ubuntu_libvfio_user_labels }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}

  build-and-push:
    name: Build and Push ${{ matrix.target.key }}
    runs-on: ubuntu-latest
    needs: [discover-images, build-bases]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: >-
          ${{
            fromJson(
              needs.discover-images.outputs.targets
            )
          }}
    env:
      REGISTRY: docker.io
      REGISTRY_IMAGE: batesste-ci-images
      REGISTRY_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      # Point ci-images-tool.py's BASE_IMAGE resolution at the bases
      # build-bases just published to the GHCR scratch tag.
      BASE_IMAGE_FOR_UBUNTU_BASE: ${{ needs.build-bases.outputs.base }}
      BASE_IMAGE_FOR_UBUNTU_LIBVFIO_USER: ${{ needs.build-bases.outputs.vfu }}
    steps:
      - uses: actions/checkout@v7

      # ubuntu-cuda-rocm downloads ~10 GB of .deb files, which ubuntu-base's
      # apt cache mounts now keep for the whole build instead of letting
      # docker-clean discard them. On top of a 28 GB image that overruns the
      # runner. CI gets nothing from those mounts anyway -- BuildKit never
      # exports them -- so buy the headroom back off the preinstalled
      # toolchains we never use rather than give up the local-rebuild win.
      - name: Free up disk space
        if: matrix.target.image == 'ubuntu-cuda-rocm'
        run: |
          df -h /
          sudo rm -rf \
            /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/local/share/powershell \
            /usr/share/swift
          df -h /

      # x86 GitHub-hosted runners do expose /dev/kvm, but as root:kvm 0660,
      # and BuildKit's RUN step is not in the kvm group, so widen it. There is
      # no TCG fallback: a runner without /dev/kvm (ARM Linux, macOS, Windows,
      # ubuntu-slim) cannot build guest images and fails here rather than
      # spending an hour emulating one.
      - name: Enable KVM for the VM build
        if: matrix.target.entitlement != ''
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "::error::no /dev/kvm on this runner; guest images need KVM"
            exit 1
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          # The VM build stage needs /dev/kvm, reachable only
          # from a RUN --security=insecure step.
          buildkitd-flags: >-
            --allow-insecure-entitlement security.insecure
            --allow-insecure-entitlement network.host

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install tool dependencies
        run: pip install -r requirements.txt

      # ci-images-tool.py owns the tag scheme, the labels and the pinned
      # versions, so a release and a local build cannot drift.
      - name: Compute image tags, labels and build args
        id: tags
        run: |
          {
            echo 'refs<<TAGS_EOF'
            ./ci-images-tool.py tags "${{ matrix.target.key }}" \
              --tag "${{ steps.version.outputs.version }}" \
              --extra-tag "sha-${GITHUB_SHA:0:7}" \
              --extra-tag "${{ steps.version.outputs.tag }}"
            echo TAGS_EOF
            echo 'labels<<LABELS_EOF'
            ./ci-images-tool.py labels "${{ matrix.target.key }}" \
              --tag "${{ steps.version.outputs.version }}"
            echo LABELS_EOF
            echo 'args<<ARGS_EOF'
            ./ci-images-tool.py build-args "${{ matrix.target.key }}" \
              --tag "${{ steps.version.outputs.version }}"
            echo ARGS_EOF
          } >> "$GITHUB_OUTPUT"

      - name: Ensure cloud image cache dir exists
        run: mkdir -p common/cloud-image-cache

      # The guest release is pinned in images.yml, not here, so bumping it
      # there moves the cache key and the download URL with it.
      - name: Resolve guest Ubuntu release
        id: guest
        if: matrix.target.entitlement != ''
        run: |
          RELEASE=$(./ci-images-tool.py build-args "${{ matrix.target.key }}" \
            | sed -n 's/^RELEASE=//p')
          [ -n "$RELEASE" ] || { echo "::error::no RELEASE build arg"; exit 1; }
          echo "release=${RELEASE}" >> "$GITHUB_OUTPUT"

      - name: Cache Ubuntu cloud image
        if: matrix.target.entitlement != ''
        uses: actions/cache@v6
        with:
          path: common/cloud-image-cache
          key: cloud-image-${{ steps.guest.outputs.release }}-amd64
          restore-keys: cloud-image-${{ steps.guest.outputs.release }}-

      - name: Pre-download cloud image
        if: matrix.target.entitlement != ''
        run: |
          DIR="common/cloud-image-cache"
          REL="${{ steps.guest.outputs.release }}"
          IMG="${DIR}/${REL}-server-cloudimg-amd64.img"
          if [ ! -f "$IMG" ]; then
            wget --progress=dot:giga --timeout=30 --tries=5 \
              --retry-connrefused -O "$IMG" \
              "https://cloud-images.ubuntu.com/${REL}/current/${REL}-server-cloudimg-amd64.img"
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.target.image }}/Dockerfile
          allow: security.insecure
          push: true
          tags: ${{ steps.tags.outputs.refs }}
          cache-from: >-
            type=registry,ref=${{ env.CACHE_REGISTRY }}:${{
              matrix.target.scope
            }}
          cache-to: >-
            type=registry,mode=max,image-manifest=true,oci-mediatypes=true,ref=${{
              env.CACHE_REGISTRY
            }}:${{
              matrix.target.scope
            }}
          build-args: ${{ steps.tags.outputs.args }}
          labels: |
            ${{ steps.tags.outputs.labels }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}

  build-and-push-derived:
    name: Build and Push ${{ matrix.target.key }}
    runs-on: ubuntu-latest
    needs: [discover-images, build-and-push]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: >-
          ${{
            fromJson(
              needs.discover-images.outputs.derived
            )
          }}
    env:
      REGISTRY: docker.io
      REGISTRY_IMAGE: batesste-ci-images
      REGISTRY_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v7

      # This job builds on top of the 28 GB cuda-rocm image, so it is
      # tighter for space than the job that produced the base. See the
      # matching step in the build-and-push job above.
      - name: Free up disk space
        run: |
          df -h /
          sudo rm -rf \
            /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/local/share/powershell \
            /usr/share/swift
          df -h /

      # Same flags as the matrix job: a derived target that builds a guest
      # qcow2 needs security.insecure to reach /dev/kvm. Granting the
      # entitlement to the builder is not the same as using it -- the build
      # step still has to ask for it via `allow:`.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          buildkitd-flags: >-
            --allow-insecure-entitlement security.insecure
            --allow-insecure-entitlement network.host

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install tool dependencies
        run: pip install -r requirements.txt

      # ── guest-image support, gated on the entitlement rather than on an
      # image name, so a new `job: derived` guest flavour picks all of this up
      # from its images.yml entry alone. Mirrors the matrix job's steps.

      - name: Ensure cloud image cache dir exists
        run: mkdir -p common/cloud-image-cache

      - name: Resolve guest Ubuntu release
        id: guest
        if: matrix.target.entitlement != ''
        run: |
          RELEASE=$(./ci-images-tool.py build-args "${{ matrix.target.key }}" \
            | sed -n 's/^RELEASE=//p')
          [ -n "$RELEASE" ] || { echo "::error::no RELEASE build arg"; exit 1; }
          echo "release=${RELEASE}" >> "$GITHUB_OUTPUT"

      - name: Cache Ubuntu cloud image
        if: matrix.target.entitlement != ''
        uses: actions/cache@v6
        with:
          path: common/cloud-image-cache
          key: cloud-image-${{ steps.guest.outputs.release }}-amd64
          restore-keys: cloud-image-${{ steps.guest.outputs.release }}-

      - name: Pre-download cloud image
        if: matrix.target.entitlement != ''
        run: |
          DIR="common/cloud-image-cache"
          REL="${{ steps.guest.outputs.release }}"
          IMG="${DIR}/${REL}-server-cloudimg-amd64.img"
          if [ ! -f "$IMG" ]; then
            wget --progress=dot:giga --timeout=30 --tries=5 \
              --retry-connrefused -O "$IMG" \
              "https://cloud-images.ubuntu.com/${REL}/current/${REL}-server-cloudimg-amd64.img"
          fi

      - name: Enable KVM for the VM build
        if: matrix.target.entitlement != ''
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "::error::no /dev/kvm on this runner; guest images need KVM"
            exit 1
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      # BASE_IMAGE resolves to the first line of the base's tag set: the
      # immutable, fully specified tag build-and-push just published.
      - name: Compute image tags, labels and build args
        id: tags
        run: |
          {
            echo 'refs<<TAGS_EOF'
            ./ci-images-tool.py tags "${{ matrix.target.key }}" \
              --tag "${{ steps.version.outputs.version }}" \
              --extra-tag "sha-${GITHUB_SHA:0:7}" \
              --extra-tag "${{ steps.version.outputs.tag }}"
            echo TAGS_EOF
            echo 'labels<<LABELS_EOF'
            ./ci-images-tool.py labels "${{ matrix.target.key }}" \
              --tag "${{ steps.version.outputs.version }}"
            echo LABELS_EOF
            echo 'args<<ARGS_EOF'
            ./ci-images-tool.py build-args "${{ matrix.target.key }}" \
              --tag "${{ steps.version.outputs.version }}"
            echo ARGS_EOF
          } >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.target.image }}/Dockerfile
          allow: security.insecure
          push: true
          tags: ${{ steps.tags.outputs.refs }}
          cache-from: >-
            type=registry,ref=${{ env.CACHE_REGISTRY }}:${{
              matrix.target.scope
            }}
          cache-to: >-
            type=registry,mode=max,image-manifest=true,oci-mediatypes=true,ref=${{
              env.CACHE_REGISTRY
            }}:${{
              matrix.target.scope
            }}
          build-args: ${{ steps.tags.outputs.args }}
          labels: |
            ${{ steps.tags.outputs.labels }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}

      # The scratch image is the low-friction path; this is what makes "qcow2
      # as an artifact" true rather than a container-shaped approximation --
      # a libvirt or bare-metal consumer can oras pull a disk with no
      # container runtime, addressed by its own digest.
      - name: Set up ORAS
        if: matrix.target.entitlement != ''
        uses: oras-project/setup-oras@v1

      - name: Push guest qcow2 as an ORAS artifact
        if: matrix.target.entitlement != ''
        env:
          REGISTRY_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          ./ci-images-tool.py push-artifact "${{ matrix.target.key }}" \
            --tag "${{ steps.version.outputs.version }}" \
            --extra-tag "sha-${GITHUB_SHA:0:7}" \
            --extra-tag "${{ steps.version.outputs.tag }}"

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-bases, build-and-push, build-and-push-derived]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          make_latest: true
