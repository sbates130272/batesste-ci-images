name: batesste-ci-images - Version Scrub

# The daily schedule is deliberately gone, and this is the record of why.
#
# Since #95 this workflow could not finish its own job: it scrubbed the pins,
# pushed a branch, and then died on `gh pr create`, because the repository
# forbids Actions from opening pull requests. So every run failed, every day,
# leaving behind a branch nobody had asked for and a red run nobody could act
# on -- and a daily red run is worse than no run at all, because it trains you
# to ignore the one that matters.
#
# The branches accumulated rather than superseding each other, since each is
# named for its date. Four had piled up before they were cleaned out, each
# carrying the same two pins at slightly different commits.
#
# Nothing is lost by stopping. scripts/version-scrub.sh is the actual
# implementation and is unchanged -- run it by hand, on a branch you own,
# where you can open the PR yourself and give it real CI. The branches this
# workflow pushed never had any: a GITHUB_TOKEN push cannot trigger a
# workflow, so they could not be judged on check status anyway.
#
# To put it back: restore the schedule below and either grant Actions
# permission to open PRs, or drop the `gh pr create` step and let it push a
# branch on purpose rather than as a side effect of failing.
#
#  schedule:
#    # Daily 08:17 UTC. Off the hour on purpose: GitHub queues scheduled runs
#    # globally and the :00 slot is the most contended, so a run asked for at
#    # 08:00 is the one most likely to start late or be dropped under load.
#    - cron: '17 8 * * *'
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  version-scrub:
    name: Version Scrub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: sudo apt-get install -y jq

      # version-scrub.sh reads the pins through ci-images-tool.py, which
      # imports docker, requests, yaml, dotenv and rich at module scope. jq
      # alone is not enough: without these the very first `==> Fetching latest
      # QEMU release tag...` line is followed by ModuleNotFoundError.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install tool dependencies
        run: pip install -r requirements.txt

      # Every repo version-scrub.sh reads is public, so these lookups need no
      # privileged credential -- the default token is enough, and two of the
      # fetches send no header at all. A PAT was only ever here on the theory
      # that some pin source was private; none is. It was also actively harmful:
      # gh_curl branches on the token being non-empty, never on it working, so
      # once VERSION_SCRUB_PAT expired every authenticated fetch 401'd and the
      # lane failed on requests that would have succeeded unauthenticated.
      - name: Run version scrub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/version-scrub.sh

      # The permissions block above grants what this needs. One accepted cost:
      # a PR opened by the default GITHUB_TOKEN does not trigger pull_request
      # workflows, so the scrub PR arrives with no Lint or Dockerfile Test
      # result. Push any commit to its branch to run them.
      - name: Open PR if versions changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BODY: |
            Automated version scrub — upstream dependency updates detected
            and applied by `scripts/version-scrub.sh`.

            **Note:** `ROCJITSU_COMMIT` is intentionally excluded from
            automated updates (tracks a user feature branch; requires a
            human decision before advancing).
        run: |
          if git diff --quiet; then
            echo "No version changes, nothing to PR."
            exit 0
          fi
          DATE=$(date -u +%Y-%m-%d)
          BRANCH="chore/version-scrub-${DATE}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -u
          git commit -m "chore: version scrub ${DATE}"
          git push origin "$BRANCH"
          gh pr create \
            --title "chore: version scrub ${DATE}" \
            --body "$PR_BODY" \
            --base main \
            --head "$BRANCH" \
            --label "dependencies,ci"
